<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>تشخيص Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  h1 { font-size: 18px; }
  button { font-size: 16px; padding: 12px 16px; border-radius: 8px; border: 0; background: #6b2fa0; color: #fff; width: 100%; margin: 8px 0; }
  pre { background: #f3f3f3; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; direction: ltr; text-align: left; }
</style>
</head>
<body>
<h1>تشخيص تسجيل الدخول بـ Pi</h1>
<p>افتح الصفحة دي من Pi Browser، اضغط الزرار، واستنى لحد ما يظهر «انتهى»، وابعت صورة للنتيجة.</p>
<button id="run">ابدأ التشخيص</button>
<pre id="out"></pre>
<script>
  // صفحة تشخيص فقط: لا ترسل التوكن لأي خادم ولا تخزّنه، وتعرض أول 6 أحرف منه فقط.
  const out = document.getElementById('out');
  const t0 = Date.now();
  const log = (m) => { out.textContent += `[${((Date.now() - t0) / 1000).toFixed(1)}s] ${m}\n`; };

  log('href: ' + location.href);
  log('referrer: ' + (document.referrer || '(none)'));
  log('UA: ' + navigator.userAgent);
  log('PiBrowser in UA: ' + /PiBrowser/i.test(navigator.userAgent));
  let framed;
  try { framed = window.self !== window.top; } catch (e) { framed = 'cross-origin parent'; }
  log('inside frame: ' + framed);
  log('window.Pi defined: ' + (typeof window.Pi !== 'undefined'));

  const timeout = (p, ms, label) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error(label + ' TIMEOUT ' + ms / 1000 + 's')), ms))]);

  document.getElementById('run').addEventListener('click', async () => {
    document.getElementById('run').disabled = true;
    try {
      log('Pi.init …');
      const initRet = window.Pi.init({ version: '2.0', sandbox: false });
      log('init returned promise: ' + (initRet && typeof initRet.then === 'function'));
      await timeout(Promise.resolve(initRet), 10000, 'init');
      log('Pi.init OK');

      log('Pi.authenticate(["username"]) …');
      const auth = await timeout(window.Pi.authenticate(['username'], (p) => log('incomplete payment: ' + p?.identifier)), 45000, 'authenticate');
      log('authenticate OK — user: ' + auth?.user?.username + ' uid: ' + (auth?.user?.uid || '').slice(0, 6) + '… token: ' + (auth?.accessToken || '').slice(0, 6) + '…');
    } catch (e) {
      log('ERROR: ' + (e?.message || e));
    }
    log('انتهى');
  });
</script>
</body>
</html>
