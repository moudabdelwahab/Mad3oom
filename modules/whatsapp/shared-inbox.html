<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صندوق الوارد المشترك | مدعوم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS — مدعوم Brand
   ═══════════════════════════════════════ */
:root {
  --brand-1: #1e3c72;
  --brand-2: #2a5298;
  --brand-3: #3b6fd4;
  --brand-4: #5a8dee;
  --brand-glow: rgba(42,82,152,.14);

  --bg-base:    #f2f5fb;
  --bg-surface: #ffffff;
  --bg-card:    #ffffff;
  --bg-raised:  #edf1fa;
  --bg-hover:   #e4eaf6;

  --tx-1: #0d1b3e;
  --tx-2: #4a5568;
  --tx-3: #8fa3bf;

  --bd-1: rgba(30,60,114,.09);
  --bd-2: rgba(30,60,114,.17);
  --bd-3: rgba(30,60,114,.30);

  --sh-sm: 0 1px 4px rgba(30,60,114,.08);
  --sh-md: 0 4px 16px rgba(30,60,114,.11);
  --sh-lg: 0 8px 32px rgba(30,60,114,.15);
  --sh-xl: 0 16px 48px rgba(30,60,114,.20);

  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 24px;
  --ok:  #10b981; --warn: #f59e0b; --err: #ef4444; --info: #3b82f6;
  --tr: all .22s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg-base:    #070d1a;
  --bg-surface: #0d1830;
  --bg-card:    #111f3a;
  --bg-raised:  #162540;
  --bg-hover:   #1d2e4f;
  --tx-1: #e8eef8; --tx-2: #94aac8; --tx-3: #546a8a;
  --bd-1: rgba(90,141,238,.08); --bd-2: rgba(90,141,238,.16); --bd-3: rgba(90,141,238,.30);
  --sh-sm: 0 1px 4px rgba(0,0,0,.3); --sh-md: 0 4px 16px rgba(0,0,0,.4);
  --sh-lg: 0 8px 32px rgba(0,0,0,.5); --sh-xl: 0 16px 48px rgba(0,0,0,.6);
  --brand-glow: rgba(90,141,238,.10);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Cairo',sans-serif;background:var(--bg-base);color:var(--tx-1);transition:background .3s,color .3s;font-size:15px}

/* ═══ LAYOUT ═══ */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* TOP BAR */
.topbar{
  height:60px;background:var(--bg-surface);border-bottom:1px solid var(--bd-1);
  box-shadow:var(--sh-sm);display:flex;align-items:center;gap:14px;padding:0 22px;
  flex-shrink:0;z-index:100;position:relative;
}
.topbar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--brand-1),var(--brand-3),var(--brand-4));
}
.logo{display:flex;align-items:center;gap:9px}
.logo-icon{
  width:36px;height:36px;background:linear-gradient(135deg,var(--brand-1),var(--brand-2));
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(30,60,114,.28);color:#fff;
}
.logo-name{font-size:15px;font-weight:900;color:var(--brand-1)}
[data-theme="dark"] .logo-name{color:var(--brand-4)}
.logo-sub{font-size:10px;color:var(--tx-3);font-weight:600;letter-spacing:.4px}
.sep{width:1px;height:26px;background:var(--bd-2)}
.crumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx-3)}
.crumb-cur{color:var(--brand-3);font-weight:700}
.tb-right{margin-right:auto;display:flex;align-items:center;gap:8px}

/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden;gap:0}

/* SIDEBAR - CONVERSATIONS LIST */
.inbox-sidebar{
  width:320px;background:var(--bg-surface);border-left:1px solid var(--bd-1);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
}
.inbox-sidebar-head{
  padding:14px 16px;border-bottom:1px solid var(--bd-1);display:flex;flex-direction:column;gap:10px;
}
.inbox-search{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--bg-raised);border:1px solid var(--bd-2);border-radius:var(--r-md);
  transition:var(--tr);
}
.inbox-search:focus-within{border-color:var(--brand-3);box-shadow:0 0 0 3px var(--brand-glow)}
.inbox-search input{
  flex:1;background:transparent;border:none;outline:none;
  font-size:12px;color:var(--tx-1);font-family:inherit;
}
.inbox-search input::placeholder{color:var(--tx-3)}
.inbox-filters{
  display:flex;gap:6px;flex-wrap:wrap;
}
.filter-btn{
  padding:5px 11px;border-radius:99px;border:1px solid var(--bd-2);
  background:var(--bg-raised);color:var(--tx-2);font-size:11px;font-weight:700;
  cursor:pointer;transition:var(--tr);font-family:inherit;
}
.filter-btn:hover{background:var(--bg-hover);border-color:var(--bd-3)}
.filter-btn.active{background:var(--brand-3);color:#fff;border-color:var(--brand-3)}

.inbox-list{
  flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;
  padding:8px;
}
.conversation-item{
  padding:12px;border-radius:var(--r-md);background:var(--bg-raised);
  border:1px solid transparent;cursor:pointer;transition:var(--tr);
  display:flex;flex-direction:column;gap:8px;position:relative;
}
.conversation-item:hover{background:var(--bg-hover);border-color:var(--bd-2)}
.conversation-item.active{
  background:linear-gradient(135deg,rgba(30,60,114,.08),rgba(42,82,152,.05));
  border-color:var(--bd-2);
}
.conversation-item.unread{font-weight:700}
.conv-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.conv-phone{
  font-size:13px;font-weight:700;color:var(--tx-1);flex:1;min-width:0;
  direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.conv-time{
  font-size:10px;color:var(--tx-3);white-space:nowrap;flex-shrink:0;
}
.conv-status{
  display:inline-flex;align-items:center;gap:4px;padding:2px 7px;
  border-radius:99px;font-size:9px;font-weight:700;
  background:rgba(16,185,129,.1);color:var(--ok);
}
.conv-status.pending{background:rgba(245,158,11,.1);color:var(--warn)}
.conv-status.closed{background:rgba(239,68,68,.1);color:var(--err)}

.conv-preview{
  font-size:12px;color:var(--tx-2);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.conv-meta{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.conv-agent{
  font-size:10px;padding:2px 7px;border-radius:99px;
  background:var(--brand-glow);color:var(--brand-3);font-weight:600;
}
.conv-tags{
  display:flex;gap:4px;flex-wrap:wrap;
}
.conv-tag{
  font-size:9px;padding:2px 6px;border-radius:4px;
  background:rgba(59,111,212,.1);color:var(--brand-3);font-weight:600;
}
.conv-unread-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:50%;background:var(--brand-3);
  color:#fff;font-size:10px;font-weight:800;flex-shrink:0;
}

/* MAIN CONTENT AREA */
.inbox-content{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}

/* CHAT HEADER */
.chat-header{
  height:60px;background:var(--bg-surface);border-bottom:1px solid var(--bd-1);
  padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  flex-shrink:0;
}
.chat-header-left{
  display:flex;align-items:center;gap:12px;flex:1;min-width:0;
}
.chat-avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand-1),var(--brand-3));
  color:#fff;font-size:14px;font-weight:800;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;
}
.chat-info{
  display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;
}
.chat-phone{
  font-size:13px;font-weight:700;color:var(--tx-1);
  direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chat-status{
  font-size:11px;color:var(--tx-3);
}
.chat-header-actions{
  display:flex;align-items:center;gap:8px;
}
.icon-btn{
  width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--bd-1);
  background:var(--bg-raised);color:var(--tx-2);display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:var(--tr);font-size:16px;
}
.icon-btn:hover{background:var(--brand-glow);border-color:var(--bd-3);color:var(--brand-3)}

/* MESSAGES AREA */
.messages-area{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;
  display:flex;flex-direction:column;gap:12px;
}
.message{
  display:flex;gap:8px;margin-bottom:8px;
}
.message.outbound{justify-content:flex-end}
.message-bubble{
  max-width:60%;padding:10px 14px;border-radius:var(--r-md);
  font-size:13px;line-height:1.5;word-wrap:break-word;
}
.message.inbound .message-bubble{
  background:var(--bg-raised);color:var(--tx-1);border:1px solid var(--bd-1);
}
.message.outbound .message-bubble{
  background:var(--brand-3);color:#fff;
}
.message-meta{
  font-size:10px;color:var(--tx-3);margin-top:4px;
  display:flex;align-items:center;gap:4px;
}
.message.outbound .message-meta{color:rgba(255,255,255,.6)}
.read-indicator{
  display:inline-flex;align-items:center;gap:2px;
}
.read-dot{
  width:4px;height:4px;border-radius:50%;background:currentColor;
}

/* SIDEBAR PANEL - CONVERSATION DETAILS */
.details-panel{
  width:280px;background:var(--bg-surface);border-left:1px solid var(--bd-1);
  display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;
}
.details-section{
  padding:14px 16px;border-bottom:1px solid var(--bd-1);
}
.details-section-title{
  font-size:11px;font-weight:800;color:var(--tx-3);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;
}

/* ASSIGN SECTION */
.assign-row{
  display:flex;align-items:center;gap:8px;
}
.assign-select{
  flex:1;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--bd-2);
  background:var(--bg-raised);color:var(--tx-1);font-size:12px;font-family:inherit;
  cursor:pointer;transition:var(--tr);
}
.assign-select:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px var(--brand-glow)}
.assign-btn{
  padding:8px 12px;border-radius:var(--r-sm);border:none;
  background:var(--brand-3);color:#fff;font-size:11px;font-weight:700;
  cursor:pointer;transition:var(--tr);font-family:inherit;
}
.assign-btn:hover{background:var(--brand-4);transform:translateY(-1px)}

/* TAGS SECTION */
.tags-list{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;
}
.tag-chip{
  display:inline-flex;align-items:center;gap:4px;padding:5px 10px;
  border-radius:99px;background:var(--brand-glow);color:var(--brand-3);
  font-size:11px;font-weight:600;border:1px solid var(--bd-2);
}
.tag-remove{
  cursor:pointer;font-weight:800;opacity:.6;transition:opacity .2s;
}
.tag-remove:hover{opacity:1}
.tag-input-row{
  display:flex;gap:6px;
}
.tag-input{
  flex:1;padding:6px 10px;border-radius:var(--r-sm);border:1px solid var(--bd-2);
  background:var(--bg-raised);color:var(--tx-1);font-size:11px;font-family:inherit;
}
.tag-add-btn{
  padding:6px 10px;border-radius:var(--r-sm);border:none;
  background:var(--ok);color:#fff;font-size:10px;font-weight:700;
  cursor:pointer;transition:var(--tr);font-family:inherit;
}
.tag-add-btn:hover{background:#059669}

/* STATUS SECTION */
.status-options{
  display:flex;flex-direction:column;gap:6px;
}
.status-option{
  padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--bd-2);
  background:var(--bg-raised);color:var(--tx-1);font-size:11px;font-weight:600;
  cursor:pointer;transition:var(--tr);text-align:right;
}
.status-option:hover{background:var(--bg-hover);border-color:var(--bd-3)}
.status-option.active{
  background:var(--brand-3);color:#fff;border-color:var(--brand-3);
}

/* INTERNAL NOTES */
.notes-area{
  display:flex;flex-direction:column;gap:8px;
}
.notes-input{
  width:100%;padding:10px;border-radius:var(--r-sm);border:1px solid var(--bd-2);
  background:var(--bg-raised);color:var(--tx-1);font-size:11px;font-family:inherit;
  resize:vertical;min-height:80px;
}
.notes-input:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px var(--brand-glow)}
.notes-save-btn{
  padding:8px 12px;border-radius:var(--r-sm);border:none;
  background:var(--brand-3);color:#fff;font-size:11px;font-weight:700;
  cursor:pointer;transition:var(--tr);font-family:inherit;
}
.notes-save-btn:hover{background:var(--brand-4)}
.notes-display{
  padding:10px;border-radius:var(--r-sm);background:var(--bg-raised);
  border:1px solid var(--bd-1);font-size:11px;color:var(--tx-2);line-height:1.5;
}

/* READ RECEIPTS */
.readers-list{
  display:flex;flex-direction:column;gap:8px;
}
.reader-item{
  display:flex;align-items:center;gap:8px;padding:8px;
  border-radius:var(--r-sm);background:var(--bg-raised);
}
.reader-avatar{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand-1),var(--brand-3));
  color:#fff;font-size:10px;font-weight:800;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;
}
.reader-info{
  display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;
}
.reader-name{
  font-size:11px;font-weight:700;color:var(--tx-1);
}
.reader-time{
  font-size:10px;color:var(--tx-3);
}

/* REPLY COMPOSER */
.reply-composer{
  padding:14px 16px;background:var(--bg-surface);border-top:1px solid var(--bd-1);
  flex-shrink:0;
}
.composer-row{
  display:flex;gap:8px;align-items:flex-end;
}
.composer-input{
  flex:1;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--bd-2);
  background:var(--bg-raised);color:var(--tx-1);font-size:12px;font-family:inherit;
  resize:vertical;min-height:40px;max-height:120px;
}
.composer-input:focus{outline:none;border-color:var(--brand-3);box-shadow:0 0 0 3px var(--brand-glow)}
.composer-btn{
  padding:10px 16px;border-radius:var(--r-md);border:none;
  background:var(--brand-3);color:#fff;font-size:12px;font-weight:700;
  cursor:pointer;transition:var(--tr);font-family:inherit;height:40px;
}
.composer-btn:hover{background:var(--brand-4);transform:translateY(-2px)}
.composer-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* BUTTONS */
.btn{
  padding:8px 16px;border-radius:var(--r-sm);font-family:'Cairo',sans-serif;font-size:12px;
  font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;
  transition:var(--tr);text-decoration:none;
}
.btn-p{background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:#fff;box-shadow:0 4px 10px rgba(30,60,114,.22)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(30,60,114,.32)}
.btn-s{background:var(--bg-raised);color:var(--tx-1);border:1px solid var(--bd-2)}
.btn-s:hover{background:var(--bg-hover);border-color:var(--bd-3)}
.btn-sm{padding:5px 11px;font-size:11px}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd-2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--bd-3)}

/* TOAST */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  padding:12px 20px;border-radius:11px;font-weight:700;font-size:13px;
  color:#fff;box-shadow:var(--sh-xl);z-index:9999;font-family:'Cairo',sans-serif;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--ok)} .toast.err{background:var(--err)} .toast.info{background:var(--brand-2)}

/* RESPONSIVE */
@media(max-width:1200px){
  .details-panel{width:240px}
  .inbox-sidebar{width:280px}
}
@media(max-width:768px){
  .inbox-sidebar{display:none}
  .details-panel{display:none}
  .message-bubble{max-width:85%}
}
</style>
</head>
<body data-theme="light">
<div class="shell">

<!-- TOP BAR -->
<header class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 12l2 2 4-4"/></svg>
    </div>
    <div>
      <div class="logo-name">مدعوم</div>
      <div class="logo-sub">Shared Inbox</div>
    </div>
  </div>
  <div class="sep"></div>
  <nav class="crumb">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
    <span style="color:var(--tx-3);font-size:12px">واتساب</span>
    <span style="color:var(--tx-3);font-size:12px">›</span>
    <span class="crumb-cur">صندوق الوارد المشترك</span>
  </nav>
  <div class="sep"></div>
  <div class="tb-right">
    <button class="icon-btn" title="تحديث" onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36M20.49 15a9 9 0 0 1-14.85 3.36"/></svg>
    </button>
    <button class="icon-btn" onclick="toggleTheme()" title="تبديل الوضع">
      <span id="themeIco">☀️</span>
    </button>
  </div>
</header>

<!-- MAIN CONTENT -->
<div class="main">
  <!-- SIDEBAR - CONVERSATIONS LIST -->
  <aside class="inbox-sidebar">
    <div class="inbox-sidebar-head">
      <div class="inbox-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="ابحث عن رقم أو نص..." onkeyup="filterConversations()">
      </div>
      <div class="inbox-filters">
        <button class="filter-btn active" onclick="filterByStatus('all')">الكل</button>
        <button class="filter-btn" onclick="filterByStatus('open')">مفتوحة</button>
        <button class="filter-btn" onclick="filterByStatus('pending')">معلقة</button>
        <button class="filter-btn" onclick="filterByStatus('closed')">مغلقة</button>
        <button class="filter-btn" onclick="filterByStatus('unread')">غير مقروءة</button>
      </div>
    </div>
    <div class="inbox-list" id="conversationsList">
      <div style="padding:20px;text-align:center;color:var(--tx-3);font-size:12px">جاري التحميل...</div>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <div class="inbox-content">
    <!-- CHAT HEADER -->
    <header class="chat-header" id="chatHeader">
      <div class="chat-header-left">
        <div class="chat-avatar" id="chatAvatar">-</div>
        <div class="chat-info">
          <div class="chat-phone" id="chatPhone">اختر محادثة</div>
          <div class="chat-status" id="chatStatus">صندوق الوارد المشترك</div>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" title="معلومات">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        </button>
      </div>
    </header>

    <!-- MESSAGES AREA -->
    <div class="messages-area" id="messagesArea">
      <div style="text-align:center;color:var(--tx-3);padding:40px 20px;font-size:13px">
        اختر محادثة من القائمة لعرض الرسائل
      </div>
    </div>

    <!-- REPLY COMPOSER -->
    <div class="reply-composer" id="replyComposer" style="display:none">
      <div class="composer-row">
        <textarea class="composer-input" id="replyInput" placeholder="اكتب ردك هنا..."></textarea>
        <button class="composer-btn" onclick="sendReply()">إرسال</button>
      </div>
    </div>
  </div>

  <!-- DETAILS PANEL -->
  <aside class="details-panel" id="detailsPanel" style="display:none">
    <!-- ASSIGN SECTION -->
    <div class="details-section">
      <div class="details-section-title">تعيين المحادثة</div>
      <div class="assign-row">
        <select class="assign-select" id="agentSelect">
          <option value="">-- اختر وكيل --</option>
        </select>
        <button class="assign-btn" onclick="assignConversation()">تعيين</button>
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--tx-3)">
        الوكيل الحالي: <strong id="currentAgent">غير معين</strong>
      </div>
    </div>

    <!-- STATUS SECTION -->
    <div class="details-section">
      <div class="details-section-title">حالة المحادثة</div>
      <div class="status-options">
        <button class="status-option active" onclick="setConversationStatus('open')">مفتوحة</button>
        <button class="status-option" onclick="setConversationStatus('pending')">معلقة</button>
        <button class="status-option" onclick="setConversationStatus('closed')">مغلقة</button>
      </div>
    </div>

    <!-- TAGS SECTION -->
    <div class="details-section">
      <div class="details-section-title">الوسوم</div>
      <div class="tags-list" id="tagsList"></div>
      <div class="tag-input-row">
        <input type="text" class="tag-input" id="tagInput" placeholder="وسم جديد...">
        <button class="tag-add-btn" onclick="addTag()">+</button>
      </div>
    </div>

    <!-- INTERNAL NOTES -->
    <div class="details-section">
      <div class="details-section-title">ملاحظات داخلية</div>
      <div class="notes-area">
        <textarea class="notes-input" id="notesInput" placeholder="أضف ملاحظات داخلية..."></textarea>
        <button class="notes-save-btn" onclick="saveNotes()">حفظ الملاحظات</button>
      </div>
      <div class="notes-display" id="notesDisplay" style="margin-top:10px;display:none"></div>
    </div>

    <!-- READ RECEIPTS -->
    <div class="details-section">
      <div class="details-section-title">من قرأ الرسالة</div>
      <div class="readers-list" id="readersList">
        <div style="font-size:11px;color:var(--tx-3);text-align:center;padding:10px">
          لا توجد قراءات حتى الآن
        </div>
      </div>
    </div>
  </aside>
</div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
//  STATE MANAGEMENT
// ═══════════════════════════════════════
const STATE = {
  conversations: [],
  activeConversationId: null,
  agents: [],
  currentUser: null,
  filters: {
    status: 'all',
    search: '',
    agent: null
  }
};

// ═══════════════════════════════════════
//  INITIALIZATION
// ═══════════════════════════════════════
async function init() {
  // Load agents list
  await loadAgents();
  
  // Load conversations
  await loadConversations();
  
  // Load current user
  await loadCurrentUser();
  
  // Setup event listeners
  setupEventListeners();
}

async function loadAgents() {
  // Mock agents data - في الإنتاج سيتم جلبها من Supabase
  STATE.agents = [
    { id: 1, name: 'أحمد محمود', email: 'ahmad@example.com' },
    { id: 2, name: 'فاطمة علي', email: 'fatima@example.com' },
    { id: 3, name: 'محمد سالم', email: 'mohammad@example.com' },
    { id: 4, name: 'ليلى حسن', email: 'layla@example.com' }
  ];
  
  // Populate agent select
  const agentSelect = document.getElementById('agentSelect');
  STATE.agents.forEach(agent => {
    const option = document.createElement('option');
    option.value = agent.id;
    option.textContent = agent.name;
    agentSelect.appendChild(option);
  });
}

async function loadConversations() {
  // Mock conversations data - في الإنتاج سيتم جلبها من Supabase
  STATE.conversations = [
    {
      id: 1,
      phone: '+966501234567',
      lastMessage: 'السلام عليكم ورحمة الله',
      timestamp: new Date(Date.now() - 5 * 60000),
      status: 'open',
      unread: 2,
      assignedTo: 1,
      tags: ['عميل جديد', 'استفسار'],
      notes: 'عميل يسأل عن المنتجات',
      readers: [{ agentId: 1, timestamp: new Date(Date.now() - 2 * 60000) }]
    },
    {
      id: 2,
      phone: '+966502345678',
      lastMessage: 'شكراً على الرد السريع',
      timestamp: new Date(Date.now() - 30 * 60000),
      status: 'closed',
      unread: 0,
      assignedTo: 2,
      tags: ['متابعة'],
      notes: '',
      readers: []
    },
    {
      id: 3,
      phone: '+966503456789',
      lastMessage: 'متى يتوفر المنتج؟',
      timestamp: new Date(Date.now() - 2 * 60000),
      status: 'pending',
      unread: 1,
      assignedTo: null,
      tags: [],
      notes: '',
      readers: []
    }
  ];
  
  renderConversations();
}

async function loadCurrentUser() {
  // Mock current user - في الإنتاج سيتم جلبها من Supabase Auth
  STATE.currentUser = {
    id: 1,
    name: 'أحمد محمود',
    email: 'ahmad@example.com'
  };
}

function setupEventListeners() {
  // Theme toggle
  document.body.dataset.theme = localStorage.getItem('theme') || 'light';
  updateThemeIcon();
}

// ═══════════════════════════════════════
//  CONVERSATION RENDERING
// ═══════════════════════════════════════
function renderConversations() {
  const list = document.getElementById('conversationsList');
  const filtered = filterConversationsList();
  
  if (filtered.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--tx-3);font-size:12px">لا توجد محادثات</div>';
    return;
  }
  
  list.innerHTML = filtered.map(conv => {
    const agent = STATE.agents.find(a => a.id === conv.assignedTo);
    const statusClass = conv.status;
    const isActive = conv.id === STATE.activeConversationId;
    
    return `
      <div class="conversation-item ${isActive ? 'active' : ''} ${conv.unread > 0 ? 'unread' : ''}" 
           onclick="selectConversation(${conv.id})">
        <div class="conv-header">
          <span class="conv-phone">${conv.phone}</span>
          <span class="conv-time">${formatTime(conv.timestamp)}</span>
        </div>
        <div class="conv-preview">${conv.lastMessage}</div>
        <div class="conv-meta">
          <span class="conv-status ${statusClass}">${getStatusLabel(conv.status)}</span>
          ${agent ? `<span class="conv-agent">${agent.name}</span>` : ''}
          ${conv.unread > 0 ? `<span class="conv-unread-badge">${conv.unread}</span>` : ''}
        </div>
        ${conv.tags.length > 0 ? `
          <div class="conv-tags">
            ${conv.tags.map(tag => `<span class="conv-tag">${tag}</span>`).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function filterConversationsList() {
  return STATE.conversations.filter(conv => {
    // Status filter
    if (STATE.filters.status !== 'all' && STATE.filters.status !== 'unread') {
      if (conv.status !== STATE.filters.status) return false;
    }
    if (STATE.filters.status === 'unread' && conv.unread === 0) return false;
    
    // Search filter
    if (STATE.filters.search) {
      const search = STATE.filters.search.toLowerCase();
      if (!conv.phone.includes(search) && !conv.lastMessage.toLowerCase().includes(search)) {
        return false;
      }
    }
    
    // Agent filter
    if (STATE.filters.agent && conv.assignedTo !== STATE.filters.agent) {
      return false;
    }
    
    return true;
  });
}

function selectConversation(convId) {
  STATE.activeConversationId = convId;
  const conv = STATE.conversations.find(c => c.id === convId);
  
  if (!conv) return;
  
  // Update header
  document.getElementById('chatPhone').textContent = conv.phone;
  document.getElementById('chatAvatar').textContent = conv.phone.slice(-1).toUpperCase();
  document.getElementById('chatStatus').textContent = `حالة: ${getStatusLabel(conv.status)}`;
  
  // Show details panel and reply composer
  document.getElementById('detailsPanel').style.display = 'flex';
  document.getElementById('replyComposer').style.display = 'block';
  
  // Render messages (mock)
  renderMessages(conv);
  
  // Update details panel
  updateDetailsPanel(conv);
  
  // Mark as read
  conv.unread = 0;
  renderConversations();
}

function renderMessages(conv) {
  const area = document.getElementById('messagesArea');
  
  // Mock messages
  const messages = [
    { id: 1, text: 'السلام عليكم ورحمة الله', direction: 'inbound', timestamp: new Date(Date.now() - 10 * 60000) },
    { id: 2, text: 'وعليكم السلام ورحمة الله وبركاته', direction: 'outbound', timestamp: new Date(Date.now() - 9 * 60000) },
    { id: 3, text: 'هل لديكم المنتج X متوفر؟', direction: 'inbound', timestamp: new Date(Date.now() - 5 * 60000) },
    { id: 4, text: 'نعم، المنتج متوفر حالياً', direction: 'outbound', timestamp: new Date(Date.now() - 4 * 60000) }
  ];
  
  area.innerHTML = messages.map(msg => `
    <div class="message ${msg.direction}">
      <div class="message-bubble">
        ${msg.text}
        <div class="message-meta">
          ${formatTime(msg.timestamp)}
          ${msg.direction === 'outbound' ? `
            <span class="read-indicator">
              <span class="read-dot"></span>
              مقروءة
            </span>
          ` : ''}
        </div>
      </div>
    </div>
  `).join('');
  
  // Scroll to bottom
  area.scrollTop = area.scrollHeight;
}

function updateDetailsPanel(conv) {
  const agent = STATE.agents.find(a => a.id === conv.assignedTo);
  
  // Update assigned agent
  document.getElementById('agentSelect').value = conv.assignedTo || '';
  document.getElementById('currentAgent').textContent = agent ? agent.name : 'غير معين';
  
  // Update status buttons
  document.querySelectorAll('.status-option').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(getStatusLabel(conv.status)));
  });
  
  // Update tags
  renderTags(conv.tags);
  
  // Update notes
  document.getElementById('notesInput').value = conv.notes;
  if (conv.notes) {
    document.getElementById('notesDisplay').textContent = conv.notes;
    document.getElementById('notesDisplay').style.display = 'block';
  } else {
    document.getElementById('notesDisplay').style.display = 'none';
  }
  
  // Update readers
  renderReaders(conv.readers);
}

function renderTags(tags) {
  const list = document.getElementById('tagsList');
  list.innerHTML = tags.map(tag => `
    <span class="tag-chip">
      ${tag}
      <span class="tag-remove" onclick="removeTag('${tag}')">×</span>
    </span>
  `).join('');
}

function renderReaders(readers) {
  const list = document.getElementById('readersList');
  
  if (readers.length === 0) {
    list.innerHTML = '<div style="font-size:11px;color:var(--tx-3);text-align:center;padding:10px">لا توجد قراءات حتى الآن</div>';
    return;
  }
  
  list.innerHTML = readers.map(reader => {
    const agent = STATE.agents.find(a => a.id === reader.agentId);
    return `
      <div class="reader-item">
        <div class="reader-avatar">${agent?.name.charAt(0) || '?'}</div>
        <div class="reader-info">
          <div class="reader-name">${agent?.name || 'وكيل'}</div>
          <div class="reader-time">${formatTime(reader.timestamp)}</div>
        </div>
      </div>
    `;
  }).join('');
}

// ═══════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════
function assignConversation() {
  const agentId = parseInt(document.getElementById('agentSelect').value);
  if (!agentId || !STATE.activeConversationId) return;
  
  const conv = STATE.conversations.find(c => c.id === STATE.activeConversationId);
  if (!conv) return;
  
  conv.assignedTo = agentId;
  const agent = STATE.agents.find(a => a.id === agentId);
  document.getElementById('currentAgent').textContent = agent.name;
  
  renderConversations();
  toast(`تم تعيين المحادثة لـ ${agent.name}`, 'ok');
}

function setConversationStatus(status) {
  if (!STATE.activeConversationId) return;
  
  const conv = STATE.conversations.find(c => c.id === STATE.activeConversationId);
  if (!conv) return;
  
  conv.status = status;
  document.getElementById('chatStatus').textContent = `حالة: ${getStatusLabel(status)}`;
  
  document.querySelectorAll('.status-option').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  renderConversations();
  toast(`تم تحديث الحالة إلى ${getStatusLabel(status)}`, 'ok');
}

function addTag() {
  const input = document.getElementById('tagInput');
  const tag = input.value.trim();
  
  if (!tag || !STATE.activeConversationId) return;
  
  const conv = STATE.conversations.find(c => c.id === STATE.activeConversationId);
  if (!conv || conv.tags.includes(tag)) {
    toast('الوسم موجود بالفعل', 'info');
    return;
  }
  
  conv.tags.push(tag);
  input.value = '';
  renderTags(conv.tags);
  renderConversations();
  toast('تم إضافة الوسم', 'ok');
}

function removeTag(tag) {
  if (!STATE.activeConversationId) return;
  
  const conv = STATE.conversations.find(c => c.id === STATE.activeConversationId);
  if (!conv) return;
  
  conv.tags = conv.tags.filter(t => t !== tag);
  renderTags(conv.tags);
  renderConversations();
  toast('تم حذف الوسم', 'ok');
}

function saveNotes() {
  if (!STATE.activeConversationId) return;
  
  const conv = STATE.conversations.find(c => c.id === STATE.activeConversationId);
  if (!conv) return;
  
  const notes = document.getElementById('notesInput').value.trim();
  conv.notes = notes;
  
  if (notes) {
    document.getElementById('notesDisplay').textContent = notes;
    document.getElementById('notesDisplay').style.display = 'block';
  } else {
    document.getElementById('notesDisplay').style.display = 'none';
  }
  
  toast('تم حفظ الملاحظات', 'ok');
}

function sendReply() {
  if (!STATE.activeConversationId) return;
  
  const input = document.getElementById('replyInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  const conv = STATE.conversations.find(c => c.id === STATE.activeConversationId);
  if (!conv) return;
  
  // Add message to mock data
  const area = document.getElementById('messagesArea');
  const messageHtml = `
    <div class="message outbound">
      <div class="message-bubble">
        ${text}
        <div class="message-meta">
          الآن
          <span class="read-indicator">
            <span class="read-dot"></span>
            مقروءة
          </span>
        </div>
      </div>
    </div>
  `;
  
  area.innerHTML += messageHtml;
  area.scrollTop = area.scrollHeight;
  input.value = '';
  
  toast('تم إرسال الرسالة', 'ok');
}

function filterConversations() {
  STATE.filters.search = document.getElementById('searchInput').value;
  renderConversations();
}

function filterByStatus(status) {
  STATE.filters.status = status;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  renderConversations();
}

// ═══════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════
function getStatusLabel(status) {
  const labels = {
    'open': 'مفتوحة',
    'pending': 'معلقة',
    'closed': 'مغلقة'
  };
  return labels[status] || status;
}

function formatTime(date) {
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return 'الآن';
  if (minutes < 60) return `${minutes}د`;
  if (hours < 24) return `${hours}س`;
  if (days < 7) return `${days}أ`;
  
  return date.toLocaleDateString('ar-SA');
}

function toggleTheme() {
  const dark = document.body.dataset.theme === 'dark';
  document.body.dataset.theme = dark ? 'light' : 'dark';
  localStorage.setItem('theme', document.body.dataset.theme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const icon = document.getElementById('themeIco');
  icon.textContent = document.body.dataset.theme === 'dark' ? '☀️' : '🌙';
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Initialize on load
window.addEventListener('load', init);
</script>
</body>
</html>
