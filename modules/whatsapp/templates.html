<!-- Modal for creating template (simplified from original index.html) -->
<div id="template-modal" class="modal" style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; backdrop-filter: blur(8px); padding: 20px;">
  <!-- Modal Content from original index.html -->
</div>

<script type="module" src="./shared.js"></script>
<script type="module">
  import { TemplatesPage } from './pages/TemplatesPage.js';
  
  async function initTemplates() {
    const container = document.getElementById('whatsapp-templates-root');
    const templates = new TemplatesPage(container);
    await templates.load();
  }
  
  document.addEventListener('DOMContentLoaded', initTemplates);
</script>
