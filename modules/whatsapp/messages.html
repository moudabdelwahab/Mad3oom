<script type="module" src="./shared.js"></script>
<script type="module">
  import { InboxPage } from './pages/InboxPage.js';
  import { SupabaseIntegration } from './supabase-integration.js';

  async function initMessages() {
    const container = document.getElementById('whatsapp-inbox-root');
    const supabase = await SupabaseIntegration.initializeSupabase();
    
    // Get business phone from integration
    const { data: integration } = await supabase
      .from('integrations')
      .select('*')
      .eq('provider', 'whatsapp')
      .single();
      
    const businessPhone = integration?.metadata?.phone_number || '';

    const inbox = new InboxPage(container, {
      getBusinessPhone: () => businessPhone
    });
    inbox.mount();
  }

  document.addEventListener('DOMContentLoaded', initMessages);
</script>
