<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>واجهة اللوحات - منصة مدعوم</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link rel="stylesheet" href="/assets/css/customer-dashboard.css">
    <link rel="stylesheet" href="/assets/css/owner-dashboard.css">
    <script>
        /* نفس سكربت ما قبل الرسم في كل صفحات البوابة: يضبط الثيم قبل أول رسم
           فمفيش وميض ولا قفزة عند الانتقال من لوحة إلى أخرى. منسوخ كما هو
           عمدًا — أي اختلاف هنا يعني وميضًا في هذه الصفحة وحدها. */
        (function () {
            var root = document.documentElement;
            try {
                var theme = localStorage.getItem('theme-preference')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                root.setAttribute('data-theme', theme);
            } catch (e) {
                root.setAttribute('data-theme', 'dark');
            }
            root.classList.add('no-transition');
            window.addEventListener('DOMContentLoaded', function () {
                requestAnimationFrame(function () { root.classList.remove('no-transition'); });
            });
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="/theme-manager.js" defer></script>
</head>
<body class="customer-shell owner-shell">

<main class="context-page">

    <header class="context-head">
        <div class="context-brand">
            <img src="/logo.png" alt="" width="34" height="34" aria-hidden="true">
            <span>
                <span class="context-brand-name">مدعوم</span>
                <span class="context-brand-sub">مالك المنصة</span>
            </span>
        </div>
        <h1 class="context-title">مرحبًا بك في مدعوم</h1>
        <p class="context-sub">اختر الواجهة التي تريد العمل من خلالها</p>
    </header>

    <!-- حالات التحميل والخطأ: نفس .state-block المستعمل في كل اللوحات -->
    <div id="contextState" class="panel">
        <div class="state-block state-block--compact">
            <div class="skeleton skeleton-line" style="width:12rem"></div>
            <p class="state-text">جارٍ قراءة الواجهات المتاحة…</p>
        </div>
    </div>

    <div id="contextGrid" class="context-grid" hidden></div>

    <p class="context-note" id="contextNote" hidden>
        الواجهات أعلاه يحسبها الخادم، لا هذه الصفحة. واختيارك لا يغيّر صلاحية
        حسابك — يحدّد أي جزء منها يكون ساريًا الآن، ويُسجَّل كل تبديل.
    </p>

</main>

<script type="module">
import { loadContexts, enterContext, contextStatus, CONTEXT_PRESENTATION } from '/assets/js/owner/owner-context.js';
import { supabase } from '/api-config.js';

const $state = document.getElementById('contextState');
const $grid  = document.getElementById('contextGrid');
const $note  = document.getElementById('contextNote');

function showState(title, text, isError) {
    $state.hidden = false;
    $grid.hidden = true;
    $state.innerHTML = `
        <div class="state-block${isError ? ' state-block--error' : ''}">
            <p class="state-title"></p>
            <p class="state-text"></p>
        </div>`;
    $state.querySelector('.state-title').textContent = title;
    $state.querySelector('.state-text').textContent = text;
}

function icon(name) {
    const paths = {
        owner:    '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path>',
        admin:    '<rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect>',
        company:  '<path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path>',
        preview:  '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>',
        customer: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>'
    };
    return `<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                 fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.owner}</svg>`;
}

(async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session?.user) { window.location.replace('/login.html'); return; }

    let status;
    try {
        status = await contextStatus();
    } catch (err) {
        showState('تعذّر التحقق من صلاحيتك', err.message, true);
        return;
    }

    // البوابة الحقيقية في الخادم؛ هذه رسالة عرض. غير المالك يحصل على قائمة
    // فارغة من available_contexts على أي حال.
    if (!status?.is_platform_owner) {
        showState('هذه الشاشة لمالك المنصة وحده',
                  'حسابك مسجّل دخوله بشكل صحيح، لكن اختيار الواجهات ليس من صفحاته.', true);
        return;
    }

    let contexts;
    try {
        contexts = await loadContexts();
    } catch (err) {
        showState('تعذّر جلب الواجهات', err.message, true);
        return;
    }

    if (!contexts.length) {
        showState('لا واجهات متاحة', 'لم يُرجع الخادم أي واجهة لحسابك.', true);
        return;
    }

    $state.hidden = true;
    $grid.hidden = false;
    $note.hidden = false;
    $grid.innerHTML = '';

    for (const c of contexts) {
        const p = CONTEXT_PRESENTATION[c.key] || {};
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'context-card';
        if (c.key === status.active_context) btn.classList.add('is-current');
        btn.disabled = c.granted !== true;

        btn.innerHTML = `
            <span class="context-card-icon">${icon(p.icon)}</span>
            <span class="context-card-name"></span>
            <p class="context-card-desc"></p>
            <span class="context-card-foot">
                <span class="context-card-go">
                    <span data-go></span>
                    <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.2"
                         fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </span>
                <span class="pill status-neutral" data-tag hidden></span>
            </span>`;

        btn.querySelector('.context-card-name').textContent = p.name || c.label || c.key;
        btn.querySelector('.context-card-desc').textContent = p.desc || '';
        btn.querySelector('[data-go]').textContent = c.granted === true ? 'دخول' : 'غير متاح';

        const tag = btn.querySelector('[data-tag]');
        if (c.key === status.active_context) {
            tag.textContent = 'الواجهة الحالية';
            tag.className = 'pill status-open';
            tag.hidden = false;
        } else if (p.readOnly) {
            tag.textContent = 'قراءة فقط';
            tag.className = 'pill status-in-progress';
            tag.hidden = false;
        }

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            try {
                const res = await enterContext(c.key);
                window.location.href = res.destination;
            } catch (err) {
                btn.disabled = false;
                showState('تعذّر فتح الواجهة', err.message, true);
            }
        });

        $grid.appendChild(btn);
    }
})();
</script>
</body>
</html>
