<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Muse — الوكيل الداخلي - لوحة المالك - منصة مدعوم</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link rel="stylesheet" href="/assets/css/customer-dashboard.css">
    <link rel="stylesheet" href="/assets/css/owner-dashboard.css">
    <link rel="stylesheet" href="/assets/css/owner-workspace.css">
    <link rel="stylesheet" href="/assets/css/portal-notifications.css">
    <link rel="stylesheet" href="/assets/css/owner-pages.css">
    <link rel="stylesheet" href="/assets/css/dashboard-layout.css">
    <link rel="stylesheet" href="/assets/css/owner-muse-chat.css">
    <script>
        /* نفس سكربت ما قبل الرسم في لوحة المالك — الثيم وحالة الطي قبل أول رسم. */
        (function () {
            var root = document.documentElement;
            try {
                var theme = localStorage.getItem('theme-preference')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                root.setAttribute('data-theme', theme);
                if (localStorage.getItem('mad3oom-sidebar-collapsed') === '1') {
                    root.setAttribute('data-sidebar', 'collapsed');
                }
            } catch (e) {
                root.setAttribute('data-theme', 'dark');
            }
            root.classList.add('no-transition');
            window.addEventListener('DOMContentLoaded', function () {
                requestAnimationFrame(function () { root.classList.remove('no-transition'); });
            });
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="/theme-manager.js" defer></script>
    <script src="/language-manager.js"></script>
    <link rel="stylesheet" href="/assets/responsive-global.css">
    <script src="/assets/responsive-global.js" defer></script>
</head>
<body class="customer-shell owner-shell dash-layout" data-owner-page="muse-chat">
    <div id="sidebar-container"></div>

    <main class="admin-main" id="ownerMain">
        <!-- بوابة العرض: سبب المنع بدل صفحة فارغة. القرار الحقيقي في القاعدة؛ هذه رسالة. -->
        <section class="panel" id="ownerGate" hidden>
            <div class="state-block" id="ownerGateBody"></div>
        </section>

        <div id="ownerContent" hidden>
            <!-- مربع الشات: الترويسة بالأفاتار، والرسائل، والإدخال — كلها داخل مربع واحد في المنتصف. -->
            <div class="muse-square-wrap">
                <section class="panel muse-square" aria-labelledby="museChatHeading">
                    <header class="muse-square-head">
                        <div class="muse-avatar" id="museAvatar"></div>
                        <div class="muse-square-titles">
                            <h1 class="muse-square-title" id="museChatHeading">Muse — الوكيل الداخلي</h1>
                            <p class="muse-square-status" id="museReplyStatus" role="status">جاهز — اكتب رسالتك بالأسفل.</p>
                        </div>
                        <div class="muse-square-controls">
                            <button type="button" class="btn btn-outline btn-sm" id="museAvatarAnimBtn" aria-pressed="true">إيقاف الحركة</button>
                            <button type="button" class="btn btn-outline btn-sm" id="museAvatarPaceBtn" aria-pressed="false">الإيقاع: هادئة</button>
                        </div>
                    </header>

                    <div id="museChatMessages" class="muse-chat-messages" role="log" aria-live="polite" aria-label="رسائل المحادثة">
                        <div class="skeleton skeleton-card" aria-hidden="true"></div>
                    </div>

                    <button type="button" class="btn btn-outline btn-sm muse-chat-load-retry" id="museChatLoadRetry" hidden>إعادة المحاولة</button>

                    <div class="muse-chat-error" id="museChatError" hidden>
                        <p id="museChatErrorText" role="alert"></p>
                        <button type="button" class="btn btn-outline btn-sm" id="museChatRetryBtn">إعادة المحاولة</button>
                    </div>

                    <form class="muse-chat-form" id="museChatForm" novalidate>
                        <label class="visually-hidden" for="museChatInput">اكتب رسالتك لـ Muse</label>
                        <input type="text" class="form-control" id="museChatInput" placeholder="اكتب رسالتك لـ Muse…" autocomplete="off" maxlength="2000">
                        <button type="submit" class="btn btn-primary" id="museChatSend">إرسال</button>
                    </form>
                    <p class="muse-chat-note">الرد بيوصل في حوالي دقيقة — الجسر بيفحص المحادثة كل دقيقة. دي جلسة تجريبية على حسابك بس.</p>
                </section>
            </div>

            <p class="owner-sie-status ows-toast" id="pageStatus" role="status" aria-live="polite" title="إخفاء" hidden></p>
        </div>
    </main>

    <script type="module" src="/assets/js/owner/pages/muse-chat.js"></script>
</body>
</html>
