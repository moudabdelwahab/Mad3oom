<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>تأكيد تغيير الحساب - منصة مدعوم</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link rel="stylesheet" href="/assets/css/customer-dashboard.css">
    <link rel="stylesheet" href="/assets/css/owner-dashboard.css">
    <link rel="stylesheet" href="/assets/css/owner-workspace.css">
    <link rel="stylesheet" href="/assets/css/portal-notifications.css">
    <link rel="stylesheet" href="/assets/css/owner-pages.css">
    <link rel="stylesheet" href="/assets/css/dashboard-layout.css">
    <link rel="stylesheet" href="/assets/css/step-up.css">
    <link rel="stylesheet" href="/assets/css/owner-security.css">
    <script>
        /* نفس سكربت ما قبل الرسم في لوحة المالك — الثيم وحالة الطي قبل أول رسم. */
        (function () {
            var root = document.documentElement;
            try {
                var theme = localStorage.getItem('theme-preference')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                root.setAttribute('data-theme', theme);
                if (localStorage.getItem('mad3oom-sidebar-collapsed') === '1') {
                    root.setAttribute('data-sidebar', 'collapsed');
                }
            } catch (e) {
                root.setAttribute('data-theme', 'dark');
            }
            root.classList.add('no-transition');
            window.addEventListener('DOMContentLoaded', function () {
                requestAnimationFrame(function () { root.classList.remove('no-transition'); });
            });
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="/theme-manager.js" defer></script>
    <script src="/language-manager.js"></script>
    <link rel="stylesheet" href="/assets/responsive-global.css">
    <script src="/assets/responsive-global.js" defer></script>
</head>
<body class="customer-shell owner-shell owner-approval-page">
    <main class="owner-approval" id="approvalMain">
        <section class="panel owner-approval-card" aria-labelledby="approvalTitle">
            <div class="owner-approval-brand">مدعوم — أمان حساب المالك</div>
            <h1 class="panel-title" id="approvalTitle">تأكيد تغيير الحساب</h1>
            <div id="approvalBody" aria-live="polite"><div class="skeleton skeleton-card"></div></div>
        </section>
    </main>
    <script type="module" src="/assets/js/owner/pages/security-approval.js"></script>
</body>
</html>
