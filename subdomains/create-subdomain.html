<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء نطاق فرعي - لوحة الإدارة</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/robot.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .input-row {
            display: flex;
            align-items: center;
            background: var(--color-surface);
            border: 1.5px solid var(--color-border);
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.15s ease;
        }
        .input-row:focus-within {
            border-color: var(--color-primary);
        }
        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--color-text);
            padding: 12px;
            direction: ltr;
        }
        .domain-suffix {
            padding: 0 12px;
            color: var(--color-text-secondary);
            background: var(--color-muted);
            height: 100%;
            display: flex;
            align-items: center;
            border-right: 1px solid var(--color-border);
            direction: ltr;
        }
        .admin-card {
            background: var(--color-surface);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: var(--shadow-md);
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .btn-primary {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
        }
    </style>
</head>
<body class="admin-body">
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div class="dashboard-container">
            <div class="page-intro">
                <h1>إنشاء نطاق فرعي لجهة جديدة</h1>
                <p>أدخل اسم الجهة بالإنجليزية، وسنربطه تلقائيًا بنطاق فرعي خاص بها على منصة مدعوم.</p>
            </div>

            <div class="admin-card">
                <form id="subdomainForm">
                    <div class="form-group">
                        <label for="orgName">اسم الجهة (بالإنجليزية)</label>
                        <div class="input-row">
                            <input type="text" id="orgName" name="orgName" placeholder="mtjr" required>
                            <span class="domain-suffix">.mad3oom.online</span>
                        </div>
                        <p style="font-size: 0.8rem; color: var(--color-text-secondary); mt: 0.5rem;">حروف إنجليزية صغيرة وأرقام وشرطات فقط.</p>
                    </div>
                    <button type="submit" class="btn-primary">إنشاء النطاق الفرعي</button>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { initSidebar } from '/assets/js/admin/sidebar.js';
        import { checkAdminAuth } from '/assets/js/admin/auth.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAdminAuth();
            initSidebar();
        });
    </script>
</body>
</html>
