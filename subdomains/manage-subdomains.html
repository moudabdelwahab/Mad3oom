<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة النطاقات الفرعية - لوحة الإدارة</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/robot.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .table-container {
            background: var(--color-surface);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            margin-top: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--color-border);
        }
        th {
            background: var(--color-muted);
            font-weight: 700;
        }
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge-success { background: #e6fffa; color: #2c7a7b; }
        .badge-pending { background: #fffaf0; color: #9c4221; }
    </style>
</head>
<body class="admin-body">
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div class="dashboard-container">
            <div class="page-intro">
                <h1>النطاقات الفرعية الفعالة</h1>
                <p>إدارة كل النطاقات الفرعية المرتبطة بالعملاء على mad3oom.online</p>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div class="search-box">
                    <input type="text" placeholder="بحث بالنطاق..." style="padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid var(--color-border);">
                </div>
                <a href="create-subdomain.html" class="btn-primary" style="text-decoration: none; padding: 0.5rem 1rem; background: var(--color-primary); color: white; border-radius: 0.5rem; font-weight: 600;">إنشاء نطاق جديد</a>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>النطاق</th>
                            <th>العميل</th>
                            <th>الحالة</th>
                            <th>تاريخ التفعيل</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="subdomainsTableBody">
                        <!-- سيتم تحميل البيانات هنا -->
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 2rem; color: var(--color-text-secondary);">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initSidebar } from '/assets/js/admin/sidebar.js';
        import { checkAdminAuth } from '/assets/js/admin/auth.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAdminAuth();
            initSidebar();
            
            // محاكاة تحميل البيانات أو ربطها بـ Supabase لاحقاً
            setTimeout(() => {
                const tbody = document.getElementById('subdomainsTableBody');
                tbody.innerHTML = `
                    <tr>
                        <td dir="ltr">demo.mad3oom.online</td>
                        <td>تجريبي</td>
                        <td><span class="badge badge-success">مفعل</span></td>
                        <td>2024-01-01</td>
                        <td>
                            <button style="background: none; border: none; color: var(--color-primary); cursor: pointer;">تعديل</button>
                        </td>
                    </tr>
                `;
            }, 1000);
        });
    </script>
</body>
</html>
