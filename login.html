<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدعوم - تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    background: #f0f4f8;
    overflow: hidden;
  }

  /* ===== LEFT PANEL ===== */
  .left-panel {
    width: 48%;
    background: linear-gradient(160deg, #0d2257 0%, #1a3a8f 40%, #1e4db7 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 48px 36px 32px;
    overflow: hidden;
  }

  /* Grid overlay */
  .left-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Glow circles */
  .left-panel::after {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(41,130,255,0.18) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .brand-top {
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .brand-name {
    font-size: 72px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1px;
    line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  .brand-tagline-ar {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    margin-top: 8px;
  }

  .brand-tagline-en {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  /* Central 3D icon area */
  .icon-scene {
    position: relative;
    z-index: 2;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Outer ring */
  .ring {
    position: absolute;
    width: 260px; height: 260px;
    border: 1.5px solid rgba(100,160,255,0.25);
    border-radius: 50%;
    animation: spin-slow 18s linear infinite;
  }
  .ring-2 {
    width: 220px; height: 220px;
    border-color: rgba(100,160,255,0.15);
    animation-direction: reverse;
    animation-duration: 24s;
  }

  @keyframes spin-slow { to { transform: rotate(360deg); } }

  /* Main chat bubble */
  .main-bubble {
    width: 160px; height: 160px;
    background: linear-gradient(145deg, #3a7bd5 0%, #1e4db7 50%, #0d2e8a 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 0 12px rgba(30,77,183,0.2),
      0 0 0 24px rgba(30,77,183,0.1),
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 2px 4px rgba(255,255,255,0.15);
    position: relative;
    z-index: 3;
  }

  .main-bubble svg {
    width: 80px; height: 80px;
  }

  /* Floating mini icons */
  .float-icon {
    position: absolute;
    width: 46px; height: 46px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    z-index: 4;
  }

  .float-icon svg { width: 22px; height: 22px; }

  .fi-1 { top: 10px; right: 10px; animation: float 3.2s ease-in-out infinite; }
  .fi-2 { top: 10px; left: 10px; animation: float 3.8s ease-in-out infinite 0.5s; }
  .fi-3 { bottom: 28px; right: 0px; animation: float 3.5s ease-in-out infinite 1s; }
  .fi-4 { bottom: 10px; left: 10px; animation: float 4s ease-in-out infinite 0.3s; }
  .fi-5 { top: 50%; right: -10px; transform: translateY(-50%); animation: float 3.6s ease-in-out infinite 0.7s; }

  /* Green chat icon (top right) */
  .fi-1 { background: rgba(37,211,102,0.15); border-color: rgba(37,211,102,0.3); }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  .fi-5 { transform: translateY(-50%); }
  .fi-5:hover { transform: translateY(calc(-50% - 4px)); }

  .copyright {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    position: relative;
    z-index: 2;
  }

  /* ===== RIGHT PANEL ===== */
  .right-panel {
    width: 52%;
    background: #e8edf5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    position: relative;
  }

  /* Subtle background texture */
  .right-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 80% 20%, rgba(30,60,114,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 60% at 20% 80%, rgba(42,82,152,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  .login-card {
    background: #fff;
    border-radius: 24px;
    padding: 44px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow:
      0 4px 6px rgba(0,0,0,0.04),
      0 20px 60px rgba(0,0,0,0.1),
      0 1px 3px rgba(0,0,0,0.06);
    position: relative;
    z-index: 1;
  }

  /* Card top icon */
  .card-icon {
    width: 68px; height: 68px;
    background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 8px 24px rgba(30,60,114,0.35);
  }

  .card-icon svg { width: 36px; height: 36px; }

  .card-title {
    font-size: 26px;
    font-weight: 800;
    color: #1a1a2e;
    text-align: center;
    margin-bottom: 32px;
  }

  /* Input group */
  .input-group {
    position: relative;
    margin-bottom: 16px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 48px 14px 48px;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    font-family: 'Cairo', sans-serif;
    color: #1a1a2e;
    background: #f8fafc;
    outline: none;
    text-align: right;
    direction: rtl;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .input-group input::placeholder { color: #a0aec0; }

  .input-group input:focus {
    border-color: #2a5298;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
  }

  .input-group input.error {
    border-color: #e53e3e;
    box-shadow: 0 0 0 3px rgba(229,62,62,0.1);
  }

  /* Icons inside inputs */
  .input-icon-right, .input-icon-left {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    color: #a0aec0;
    pointer-events: none;
  }

  .input-icon-right { right: 16px; }
  .input-icon-left { left: 16px; }

  .input-icon-left.clickable {
    pointer-events: auto;
    cursor: pointer;
    transition: color 0.2s;
  }
  .input-icon-left.clickable:hover { color: #2a5298; }

  /* Forgot password */
  .forgot-link {
    display: block;
    text-align: right;
    font-size: 13px;
    color: #4a5568;
    text-decoration: none;
    margin-bottom: 24px;
    font-weight: 500;
    cursor: pointer;
  }
  .forgot-link:hover { color: #2a5298; }

  /* Login button */
  .btn-login {
    width: 100%;
    padding: 15px;
    background: linear-gradient(90deg, #2a5298 0%, #1e3c72 100%);
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    box-shadow: 0 4px 15px rgba(30,60,114,0.35);
    position: relative;
    overflow: hidden;
  }

  .btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(30,60,114,0.45);
  }

  .btn-login:active { transform: translateY(0); }

  .btn-login:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  .btn-login .btn-spinner {
    display: none;
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-login.loading .btn-text { display: none; }
  .btn-login.loading .btn-spinner { display: block; }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0 8px;
    color: #a0aec0;
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e2e8f0;
  }

  .signup-link {
    text-align: center;
    font-size: 14px;
    color: #4a5568;
  }
  .signup-link a {
    color: #2a5298;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .signup-link a:hover { text-decoration: underline; }

  /* Error/success messages */
  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 16px;
    display: none;
    text-align: right;
  }
  .alert.error { background: #fff5f5; color: #c53030; border: 1px solid #fed7d7; }
  .alert.success { background: #f0fff4; color: #276749; border: 1px solid #c6f6d5; }
  .alert.show { display: block; }

  /* Forgot password modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal-box {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    text-align: center;
  }
  .modal-box h3 { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
  .modal-box p { font-size: 13px; color: #718096; margin-bottom: 20px; }
  .modal-close {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    background: #f7fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    color: #4a5568;
    cursor: pointer;
    font-weight: 600;
  }
  .modal-close:hover { background: #edf2f7; }

  /* Responsive */
  @media (max-width: 768px) {
    body { flex-direction: column; overflow: auto; }
    .left-panel { width: 100%; min-height: 320px; padding: 32px 24px 24px; }
    .right-panel { width: 100%; padding: 24px 16px 32px; }
    .brand-name { font-size: 52px; }
    .icon-scene { width: 200px; height: 200px; }
    .main-bubble { width: 120px; height: 120px; }
    .ring { width: 190px; height: 190px; }
    .ring-2 { width: 160px; height: 160px; }
  }
</style>
</head>
<body>

<!-- LEFT PANEL -->
<div class="left-panel">
  <div class="brand-top">
    <div class="brand-name">مدعوم</div>
    <div class="brand-tagline-ar">منصة تكامل الواتساب السحابي والدعم الفني</div>
    <div class="brand-tagline-en">WhatsApp Cloud API &amp; Tech Support Platform</div>
  </div>

  <div class="icon-scene">
    <div class="ring"></div>
    <div class="ring ring-2"></div>

    <!-- Float icons -->
    <div class="float-icon fi-1">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="#25D366"/>
        <circle cx="8" cy="11" r="1.2" fill="#fff"/>
        <circle cx="12" cy="11" r="1.2" fill="#fff"/>

      <svg viewBox="0 0 24 24" fill="none">

          <linearGradient id="bubbleGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#5096f0"/>

          </linearGradient>
          <linearGradient id="bubbleGrad2" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#5096f0"/>

  </div>

  <div class="copyright">مدعوم. جميع الحقوق محفوظة.</div>
</div>

<!-- RIGHT PANEL -->
<div class="right-panel">
  <div class="login-card">
    <div class="card-icon">
      <svg viewBox="0 0 60 60" fill="none">
        <ellipse cx="30" cy="28" rx="24" ry="22" fill="white" opacity="0.9"/>
        <path d="M10 50 L20 40" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
        <circle cx="21" cy="28" r="3.5" fill="#1e3c72"/>
        <circle cx="30" cy="28" r="3.5" fill="#1e3c72"/>

    <!-- Email -->

      <span class="input-icon-right">

<!-- Forgot Password Modal -->

  <div class="modal-box">

          <path d="M2 8l10 6 10-6" stroke="#a0aec0" stroke-width="1.5"/>

      </span>
      <input type="email" id="resetEmail" placeholder="البريد الإلكتروني" />
    </div>
    <button class="btn-login" id="resetBtn" onclick="handleReset()" style="margin-top:4px;">

      <div class="btn-spinner"></div>
    </button>
    <button class="modal-close" onclick="closeForgot()">إلغاء</button>

</div>

<script>
const SUPABASE_URL = 'https://srnelrdpqkcntbgudyto.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNybmVscmRwcWtjbnRiZ3VkeXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxNDYwNDcsImV4cCI6MjA3ODcyMjA0N30.Ox7wWQPu7GjYnjpx1w3gNYnDIykfANN4ott6narxdZI';

let pwVisible = false;
document.getElementById('togglePassword').addEventListener('click', () => {
  pwVisible = !pwVisible;
  const inp = document.getElementById('passwordInput');
  inp.type = pwVisible ? 'text' : 'password';
  document.getElementById('eyeIcon').innerHTML = pwVisible
    ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" stroke="#2a5298" stroke-width="1.5" stroke-linecap="round"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" stroke="#2a5298" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="1" x2="23" y2="23" stroke="#2a5298" stroke-width="1.5" stroke-linecap="round"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#a0aec0" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="#a0aec0" stroke-width="1.5"/>`;
});

function showAlert(type, msg) {
  ['alertError','alertSuccess'].forEach(id => {
    document.getElementById(id).classList.remove('show');
    document.getElementById(id).textContent = '';
  });
  const el = document.getElementById(type === 'error' ? 'alertError' : 'alertSuccess');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.classList.toggle('loading', loading);
}

async function handleLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;

  if (!email || !password) {
    showAlert('error', 'يرجى إدخال البريد الإلكتروني وكلمة المرور');
    return;
  }

  setLoading('loginBtn', true);

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    showAlert('success', `مرحباً بك! جاري تحويلك...`);
    setTimeout(() => {
      // Redirect to dashboard after login
      window.location.href = '/dashboard.html';
    }, 1200);
  } catch (err) {
    const msgs = {
      'Invalid login credentials': 'البريد الإلكتروني أو كلمة المرور غير صحيحة',
      'Email not confirmed': 'يرجى تأكيد بريدك الإلكتروني أولاً',
      'Too many requests': 'محاولات كثيرة، يرجى الانتظار قليلاً',
    };
    showAlert('error', msgs[err.message] || err.message);
  } finally {
    setLoading('loginBtn', false);
  }
}

function handleSignup() {
  // Redirect to signup page
  window.location.href = '/signup.html';
}

function openForgot() {
  document.getElementById('forgotModal').classList.add('show');
}

function closeForgot() {
  document.getElementById('forgotModal').classList.remove('show');
}

async function handleReset() {
  const email = document.getElementById('resetEmail').value.trim();
  if (!email) {
    alert('يرجى إدخال بريدك الإلكتروني');
    return;
  }

  setLoading('resetBtn', true);
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
    });
    if (error) throw error;
    closeForgot();
    showAlert('success', 'تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني');
  } catch (err) {
    alert('حدث خطأ: ' + err.message);
  } finally {
    setLoading('resetBtn', false);
  }
}

// Enter key support
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('forgotModal').classList.contains('show')) {
    handleLogin();
  }
});

// Check existing session
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    window.location.href = '/dashboard.html';
  }
})();
</script>
</body>
