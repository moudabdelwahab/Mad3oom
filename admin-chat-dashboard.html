<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الدردشة - مدعوم</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .admin-chat-container {
            display: flex;
            height: 100vh;
            gap: 1rem;
            padding: 1rem;
        }

        .conversations-panel {
            width: 350px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .conversations-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #003366 0%, #0055AA 100%);
            color: white;
        }

        .conversations-header h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.5rem;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: #003366;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .conversation-item {
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .conversation-item:hover {
            background: #f0f2f5;
            border-color: #0055AA;
        }

        .conversation-item.active {
            background: white;
            border-color: #0055AA;
            box-shadow: 0 2px 8px rgba(0,85,170,0.15);
        }

        .conversation-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .conversation-item-title {
            font-weight: 600;
            color: #333;
        }

        .conversation-item-status {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            background: #e3f2fd;
            color: #0055AA;
        }

        .conversation-item-preview {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.4;
        }

        .conversation-item-meta {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.5rem;
        }

        .chat-panel {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #003366 0%, #0055AA 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .chat-header-info p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .chat-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.admin {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.customer .message-bubble {
            background: #f0f2f5;
            color: #333;
        }

        .message.admin .message-bubble {
            background: linear-gradient(135deg, #003366 0%, #0055AA 100%);
            color: white;
        }

        .message-time {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.25rem;
        }

        .input-area {
            padding: 1.5rem;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 0.75rem;
        }

        .input-area textarea {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            resize: none;
            text-align: right;
        }

        .send-btn {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #003366 0%, #0055AA 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,85,170,0.3);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .stats-bar {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
        }

        .stat-card {
            flex: 1;
            text-align: center;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0055AA;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .work-hours-btn {
            padding: 0.5rem 1rem;
            background: #f0f2f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .work-hours-btn:hover {
            background: #e3f2fd;
            border-color: #0055AA;
        }

        @media (max-width: 1024px) {
            .admin-chat-container {
                flex-direction: column;
            }

            .conversations-panel {
                width: 100%;
                max-height: 300px;
            }

            .message-bubble {
                max-width: 80%;
            }
        }

        @media (max-width: 768px) {
            .admin-chat-container {
                padding: 0.5rem;
                gap: 0.5rem;
            }

            .conversations-panel {
                display: none;
            }

            .chat-panel {
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-chat-container">
        <!-- قائمة المحادثات -->
        <div class="conversations-panel">
            <div class="conversations-header">
                <h2>المحادثات</h2>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="active">النشطة</button>
                    <button class="tab-btn" data-tab="closed">المغلقة</button>
                </div>
            </div>
            <div class="conversations-list" id="conversationsList"></div>
        </div>

        <!-- لوحة الدردشة -->
        <div class="chat-panel">
            <div id="chatContent" class="empty-state">
                <div class="empty-state-icon">💬</div>
                <p>اختر محادثة للبدء</p>
            </div>
        </div>
    </div>

    <!-- نموذج إدارة أوقات العمل -->
    <div id="workHoursModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 2rem; border-radius: 12px; max-width: 500px; width: 90%;">
            <h2 style="margin-bottom: 1.5rem;">إدارة أوقات العمل</h2>
            <div id="workHoursForm"></div>
            <button onclick="closeWorkHoursModal()" style="width: 100%; padding: 0.75rem; background: #0055AA; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 1rem;">إغلاق</button>
        </div>
    </div>

    <script src="chat-service.js"></script>
    <script src="admin-chat-dashboard.js"></script>
</body>
</html>
