<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة العميل - منصة مدعوم</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="theme-manager.js" defer></script>
    <script src="language-manager.js"></script>
    <script src="/error-tracker.js"></script>
    <link rel="stylesheet" href="robot.css">
    <style>
        :root {
            --color-primary: #003366;
            --color-accent: #0077CC;
            --color-background: #F1F5F9;
            --color-surface: #FFFFFF;
            --color-border: #E2E8F0;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--color-background); margin: 0; }
        
        .dashboard-container { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        
        .sidebar { background: var(--color-primary); color: white; padding: 2rem 1.5rem; }
        .sidebar-logo { margin-bottom: 3rem; text-align: center; }
        .sidebar-menu { list-style: none; padding: 0; }
        .menu-item { padding: 1rem; border-radius: 0.5rem; margin-bottom: 0.5rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; transition: 0.2s; }
        .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.1); }
        
        .main-content { padding: 2rem; overflow-y: auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 1rem; box-shadow: var(--shadow-sm); border: 1px solid var(--color-border); }
        
        .tickets-layout { display: grid; grid-template-columns: 400px 1fr; gap: 2rem; height: calc(100vh - 250px); }
        .tickets-list { background: white; border-radius: 1rem; border: 1px solid var(--color-border); overflow-y: auto; padding: 1rem; }
        .ticket-card { padding: 1rem; border-radius: 0.75rem; background: #F8FAFC; margin-bottom: 1rem; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .ticket-card:hover { background: #F1F5F9; }
        .ticket-card.active { border-color: var(--color-accent); background: white; }
        
        .ticket-details { background: white; border-radius: 1rem; border: 1px solid var(--color-border); display: flex; flex-direction: column; overflow: hidden; }
        .details-header { padding: 1.5rem; border-bottom: 1px solid var(--color-border); background: #F8FAFC; }
        .details-body { padding: 1.5rem; flex: 1; overflow-y: auto; }
        .details-footer { padding: 1.5rem; border-top: 1px solid var(--color-border); }
        
        .msg { margin-bottom: 1rem; max-width: 80%; padding: 1rem; border-radius: 1rem; }
        .msg-user { background: var(--color-primary); color: white; margin-right: auto; }
        .msg-admin { background: #F1F5F9; margin-left: auto; }
        
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; cursor: pointer; font-weight: 600; font-family: 'Cairo'; }
        .btn-primary { background: var(--color-accent); color: white; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2rem; border-radius: 1rem; width: 100%; max-width: 500px; }
        
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 700; }
        .status-open { background: #FEF3C7; color: #92400E; }
        .status-in-progress { background: #DBEAFE; color: #1E40AF; }
        .status-resolved { background: #D1FAE5; color: #065F46; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/assets/images/logo.png" height="40" alt="مدعوم">
            </div>
            <ul class="sidebar-menu">
                <li class="menu-item active">تذاكر الدعم</li>
                <li class="menu-item" onclick="location.href='/chat-customer.html'">المحادثة المباشرة</li>
                <li class="menu-item" onclick="location.href='/customer-subscriptions.html'">اشتراكاتي</li>
                <li class="menu-item" onclick="location.href='/customer-settings-modal.html'">الإعدادات</li>
            </ul>
        </aside>

        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 id="welcomeUser">مرحباً بك</h1>
                <button class="btn btn-primary" id="btnCreateTicket">إنشاء تذكرة جديدة</button>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <p style="color: #64748B; font-size: 0.9rem;">إجمالي التذاكر</p>
                    <h2 id="statTotal">0</h2>
                </div>
                <div class="stat-card">
                    <p style="color: #64748B; font-size: 0.9rem;">قيد المعالجة</p>
                    <h2 id="statInProgress" style="color: var(--color-accent);">0</h2>
                </div>
                <div class="stat-card">
                    <p style="color: #64748B; font-size: 0.9rem;">المحلولة</p>
                    <h2 id="statResolved" style="color: #10B981;">0</h2>
                </div>
            </div>

            <div class="tickets-layout">
                <div class="tickets-list" id="ticketsList">
                    <p style="text-align: center; color: #64748B; padding: 2rem;">جاري تحميل التذاكر...</p>
                </div>

                <div class="ticket-details" id="ticketDetails">
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94A3B8;">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <p style="margin-top: 1rem; font-weight: 600;">اختر تذكرة لعرض المحادثة</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Ticket Modal -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">فتح تذكرة جديدة</h2>
            <form id="createForm">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">الموضوع</label>
                    <input type="text" id="ticketTitle" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 0.5rem;" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">التصنيف</label>
                    <select id="ticketCategory" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 0.5rem;">
                        <option value="general">عام</option>
                        <option value="technical">مشكلة تقنية</option>
                        <option value="billing">الفواتير والدفع</option>
                        <option value="whatsapp">خدمات واتساب</option>
                    </select>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">الأولوية</label>
                    <select id="ticketPriority" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 0.5rem;">
                        <option value="low">منخفضة</option>
                        <option value="medium" selected>متوسطة</option>
                        <option value="high">عالية</option>
                    </select>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">وصف المشكلة</label>
                    <textarea id="ticketDesc" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 0.5rem; min-height: 100px;" required></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('createModal').classList.remove('active')">إلغاء</button>
                    <button type="submit" class="btn btn-primary">إنشاء التذكرة</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from './api-config.js';
        import { fetchUserTickets, createTicket, fetchTicketReplies, addTicketReply, fetchTicketStats, subscribeToTickets } from './tickets-service.js';
        import { requireAuth } from './auth-client.js';

        let currentTicketId = null;

        async function init() {
            const user = await requireAuth('customer');
            if (!user) return;

            document.getElementById('welcomeUser').textContent = `مرحباً، ${user.profile?.full_name || 'مستخدم'}`;
            
            await loadStats();
            await loadTickets();
            
            subscribeToTickets(() => {
                loadStats();
                loadTickets();
            });

            document.getElementById('btnCreateTicket').onclick = () => document.getElementById('createModal').classList.add('active');
            
            document.getElementById('createForm').onsubmit = async (e) => {
                e.preventDefault();
                const title = document.getElementById('ticketTitle').value;
                const description = document.getElementById('ticketDesc').value;
                const priority = document.getElementById('ticketPriority').value;
                const category = document.getElementById('ticketCategory').value;

                try {
                    await createTicket({ title, description, priority, category });
                    document.getElementById('createModal').classList.remove('active');
                    loadTickets();
                } catch (err) {
                    alert('فشل إنشاء التذكرة');
                }
            };
        }

        async function loadStats() {
            const stats = await fetchTicketStats();
            document.getElementById('statTotal').textContent = stats.total;
            document.getElementById('statInProgress').textContent = stats.inProgress;
            document.getElementById('statResolved').textContent = stats.resolved;
        }

        async function loadTickets() {
            const tickets = await fetchUserTickets();
            const list = document.getElementById('ticketsList');
            
            list.innerHTML = tickets.map(t => `
                <div class="ticket-card ${currentTicketId === t.id ? 'active' : ''}" onclick="window.selectTicket('${t.id}')">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="font-weight: 800; font-size: 0.8rem; color: #64748B;">#${t.ticket_number}</span>
                        <span class="status-badge status-${t.status}">${getStatusLabel(t.status)}</span>
                    </div>
                    <div style="font-weight: 700;">${t.title}</div>
                    <div style="font-size: 0.8rem; color: #64748B; margin-top: 0.5rem;">${new Date(t.created_at).toLocaleDateString('ar-EG')}</div>
                </div>
            `).join('');
        }

        window.selectTicket = async (id) => {
            currentTicketId = id;
            loadTickets();
            
            const { data: ticket } = await supabase.from('tickets').select('*').eq('id', id).single();
            const replies = await fetchTicketReplies(id);
            
            const panel = document.getElementById('ticketDetails');
            panel.innerHTML = `
                <div class="details-header">
                    <h2 style="margin: 0; font-size: 1.2rem;">${ticket.title}</h2>
                    <p style="margin: 0.5rem 0 0 0; font-size: 0.85rem; color: #64748B;">حالة التذكرة: ${getStatusLabel(ticket.status)}</p>
                </div>
                <div class="details-body">
                    <div style="background: #F8FAFC; padding: 1rem; border-radius: 0.5rem; margin-bottom: 2rem;">
                        <p style="margin: 0; white-space: pre-wrap;">${ticket.description}</p>
                    </div>
                    <div id="repliesContainer">
                        ${replies.map(r => `
                            <div class="msg ${r.profiles?.role === 'admin' ? 'msg-admin' : 'msg-user'}">
                                <div style="font-size: 0.75rem; opacity: 0.8; margin-bottom: 0.25rem;">
                                    ${r.profiles?.role === 'admin' ? 'الدعم الفني' : 'أنا'} • ${new Date(r.created_at).toLocaleTimeString('ar-EG')}
                                </div>
                                <div>${r.message}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="details-footer">
                    <div style="display: flex; gap: 1rem;">
                        <input type="text" id="replyText" style="flex: 1; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 0.5rem;" placeholder="اكتب ردك هنا...">
                        <button class="btn btn-primary" onclick="window.sendReply()">إرسال</button>
                    </div>
                </div>
            `;
            
            const body = panel.querySelector('.details-body');
            body.scrollTop = body.scrollHeight;
        };

        window.sendReply = async () => {
            const text = document.getElementById('replyText').value.trim();
            if (!text) return;

            try {
                await addTicketReply(currentTicketId, text);
                window.selectTicket(currentTicketId);
            } catch (err) {
                alert('فشل إرسال الرد');
            }
        };

        function getStatusLabel(s) {
            const map = { 'open': 'مفتوحة', 'in-progress': 'قيد المعالجة', 'resolved': 'محلولة' };
            return map[s] || s;
        }

        init();
    </script>
</body>
</html>
