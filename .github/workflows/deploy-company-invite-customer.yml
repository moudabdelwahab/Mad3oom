
name: Deploy Company Invitation Function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-company-invite-customer
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy company-invite-customer
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"
            exit 1
          }

          test -n "$SUPABASE_PROJECT_REF" || {
            echo "::error::Missing SUPABASE_PROJECT_REF secret"
            exit 1
          }

          test -f supabase/functions/company-invite-customer/index.ts
          test -f supabase/functions/company-invite-customer/handler.js
          test -f supabase/functions/company-invite-customer/template.js
          test -f supabase/functions/_shared/email.js

          echo "Required function and shared files exist."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy invitation function
        run: |
          supabase functions deploy company-invite-customer \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api
