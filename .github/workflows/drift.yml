# ============================================================================
# كشف الانحراف بين المستودع وقاعدة الإنتاج
#
# لماذا هذا الملف موجود:
#   تقوية الأمان في 2026-09 كشفت أن المستودع والإنتاج انحرفا في الاتجاهين:
#   ست ترحيلات أمنية مكتوبة ومدموجة و**غير مطبَّقة**، و19 دالة حافة منشورة
#   بلا أي مصدر في المستودع، و175 دالة قاعدة بيانات حيّة بلا مصدر.
#
#   أخطر ما في ذلك أنه كان صامتًا. ترحيلة أمنية غير مطبَّقة ليست دَينًا تقنيًا،
#   بل ثغرة مفتوحة يظن الفريق أنها مغلقة — وهذا ما حدث فعلًا في ست حالات.
#   هذا الفحص يجعل الفجوة مرئية، ويمنع اتساعها بصمت.
#
# الأسرار:
#   المقارنة بالإنتاج تحتاج SUPABASE_ACCESS_TOKEN. يُمرَّر عبر env من أسرار
#   المستودع ولا يُطبع أبدًا — والسكربت يطبع أسماء كائنات فقط، ولا يطبع أي
#   استجابة خام من الـAPI (قد تحمل تفاصيل بيئة).
#
#   وطلبات pull_request من fork لا تصلها الأسرار. ولذلك تُفصل المقارنة إلى
#   وظيفة مستقلة لا تعمل على fork إطلاقًا، بدل أن تفشل هناك بفشل مُضلِّل.
# ============================================================================
name: Drift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # الانحراف يحدث بين الدمجات لا عندها: أحدهم ينشر دالة من اللوحة يوم ثلاثاء.
    # فحص يومي يلتقط ذلك؛ فحص عند الدمج وحده لا يلتقطه.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: فحوص المستودع
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: جرد المستودع
        run: node scripts/drift-check.mjs

      - name: اختبارات كاشف الانحراف
        run: node --test tests/drift-check.test.mjs

  production-drift:
    name: مقارنة بالإنتاج
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # لا تعمل على fork: الأسرار لا تصلها، والفشل هناك مُضلِّل لا مفيد.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # فحصٌ لم يعمل ليس فحصًا ناجحًا. إن غاب السرّ نقولها بوضوح كتحذير
      # مرئي، ولا ندع الوظيفة تمرّ خضراء وكأن المقارنة تمّت.
      - name: التحقق من توفّر بيانات الاعتماد
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN أو SUPABASE_PROJECT_REF غير مضبوط — المقارنة بالإنتاج لم تتم"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: كشف الانحراف
        if: steps.creds.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/drift-check.mjs --remote
