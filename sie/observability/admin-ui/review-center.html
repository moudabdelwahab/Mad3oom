<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="/error-tracker.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز المراجعة — محرك الدعم الذكي | لوحة الإدارة</title>
<link rel="icon" type="image/png" href="/assets/images/logo.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/robot.css">
<link rel="stylesheet" href="/assets/js/admin/admin-style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme='light'], :root[data-theme='dark']{
    --color-primary:#00234A; --color-primary-variant:#0077CC; --color-accent:#0077CC; --color-accent-2:#4DA3FF;
    --color-background:#060B14; --color-surface:#0D1622; --color-surface-2:#121F30;
    --color-text:#F3F6FB; --color-text-secondary:#94A6C2; --color-text-3:#5A6A82; --color-muted:#101B2C;
    --color-success:#22C58B; --color-warning:#F5A623; --color-danger:#FF6B6B; --color-border:rgba(255,255,255,.09);
    --input-bg:#0F1A2A; --shadow-lg:0 25px 60px -20px rgba(0,8,25,.75); --shadow-sm:0 10px 24px -12px rgba(0,8,25,.6);
    --font-display:'Cairo', 'IBM Plex Sans Arabic', sans-serif;
    --font-body:'IBM Plex Sans Arabic', 'Cairo', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
body{
    font-family: var(--font-body);
    position: relative;
    font-size: 14px;
    line-height: 1.6;
}
body::before{
    content:""; position:fixed; inset:0; z-index:-2;
    background:
        radial-gradient(60rem 40rem at 90% -10%, rgba(0,119,204,.20), transparent 60%),
        radial-gradient(50rem 35rem at -10% 30%, rgba(77,163,255,.10), transparent 55%),
        var(--color-background);
}
body::after{
    content:""; position:fixed; inset:0; z-index:-1;
    background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(60rem 60rem at 70% 0%, black, transparent 70%);
    opacity:.6;
}
h1,h2,h3,h4 { font-family: var(--font-display); }
a { color: inherit; }
button, select, textarea, input { font-family: inherit; }
button { cursor: pointer; }
.ltr-data { direction: ltr; unicode-bidi: isolate; text-align: left; font-family: var(--font-mono); }

.gradient-text{
    background: linear-gradient(90deg,#8FC7FF,#4DA3FF,#B9DCFF);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.eyebrow{
    display:inline-flex; align-items:center; gap:.5rem; font-size:.75rem; font-weight:700;
    color:#8FC7FF; background:rgba(0,119,204,.14); border:1px solid rgba(77,163,255,.25);
    padding:.3rem .85rem; border-radius:99px; margin-bottom:.6rem;
}
.eyebrow .dot { width:6px; height:6px; border-radius:50%; background:var(--color-accent-2); box-shadow:0 0 8px var(--color-accent-2); }
.glass-card{
    background: rgba(255,255,255,.04); border:1px solid var(--color-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius:1.1rem;
}
.page-header{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:1rem; margin-bottom:1.75rem; }
.page-header h1{ font-size:clamp(1.4rem,3vw,1.9rem); margin:0; }
.page-header p{ color:var(--color-text-secondary); margin:.5rem 0 0; max-width:62ch; font-size:.9rem; line-height:1.7; }
.demo-flag{
    font-family: var(--font-mono); direction: ltr; font-size:10.5px; color:#8FC7FF;
    background: rgba(0,119,204,.14); border:1px solid rgba(77,163,255,.25); padding:4px 10px; border-radius:20px; white-space:nowrap;
}
.demo-flag.live{ color:#22C58B; background:rgba(34,197,139,.14); border-color:rgba(34,197,139,.3); }
.demo-flag.error{ color:#FF6B6B; background:rgba(255,107,107,.14); border-color:rgba(255,107,107,.3); }

.not-authorized{
    max-width:520px; margin:4rem auto; text-align:center; padding:2.5rem 2rem;
}

/* ---------- إحصائيات سريعة ---------- */
.stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:1rem; margin-bottom:1.75rem; }
.stat-card{ padding:1.15rem 1.25rem; display:flex; align-items:center; gap:1rem; }
.stat-icon{ width:44px; height:44px; min-width:44px; border-radius:.85rem; display:flex; align-items:center; justify-content:center; background:rgba(0,119,204,.15); color:#8FC7FF; }
.stat-icon.warn { background:rgba(245,166,35,.15); color:#F5A623; }
.stat-icon.danger { background:rgba(255,107,107,.15); color:#FF6B6B; }
.stat-icon.ok { background:rgba(34,197,139,.15); color:#22C58B; }
.stat-info .stat-label{ font-size:.78rem; color:var(--color-text-secondary); font-weight:600; }
.stat-info .stat-value{ font-size:1.5rem; font-weight:800; color:var(--color-text); font-family:'Space Grotesk', var(--font-display); }

/* ---------- جدول قائمة التعلّم ---------- */
.section-card{ padding:0; overflow:hidden; }
.table-wrap{ overflow-x:auto; }
.queue-table{ width:100%; border-collapse:collapse; min-width:760px; }
.queue-table th{
    text-align:right; font-size:.72rem; font-weight:700; color:var(--color-text-secondary);
    padding:.9rem 1.1rem; border-bottom:1px solid var(--color-border); white-space:nowrap; background:rgba(255,255,255,.02);
}
.queue-table td{ padding:.85rem 1.1rem; border-bottom:1px solid var(--color-border); font-size:.85rem; vertical-align:middle; }
.queue-table tbody tr{ cursor:pointer; transition:background .15s ease; }
.queue-table tbody tr:hover{ background:rgba(255,255,255,.035); }
.queue-table tbody tr.selected{ background:rgba(0,119,204,.12); }
.qid{ font-family:var(--font-mono); direction:ltr; text-align:left; color:var(--color-text-3); font-size:.78rem; }
.qmsg-sub{ display:block; color:var(--color-text-3); font-size:.74rem; margin-top:2px; }
.conf{ font-family:var(--font-mono); direction:ltr; text-align:left; font-size:.82rem; color:var(--color-text-secondary); }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; width:fit-content; }
.badge.fallback { background:rgba(245,166,35,.16); color:#F5A623; }
.badge.escalated_unknown { background:rgba(255,107,107,.16); color:#FF6B6B; }
.badge.low_confidence { background:rgba(0,119,204,.16); color:#4DA3FF; }

.status-badge{ display:inline-flex; padding:.25rem .75rem; border-radius:99px; font-size:.72rem; font-weight:700; width:fit-content; }
.status-open      { background:rgba(148,166,194,.16); color:#94A6C2; }
.status-in_review { background:rgba(245,166,35,.16);  color:#F5A623; }
.status-resolved  { background:rgba(34,197,139,.16);  color:#22C58B; }
.status-dismissed { background:rgba(255,107,107,.16); color:#FF6B6B; }

.empty-state{ padding:4rem 1rem; text-align:center; color:var(--color-text-secondary); font-size:.9rem; }

/* ---------- لوحة التفاصيل ---------- */
.detail{ margin-top:1.5rem; padding:1.75rem; display:none; }
.detail.open{ display:block; }
.detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:1.25rem; border-bottom:1px solid var(--color-border); padding-bottom:1.1rem; margin-bottom:1.5rem; }
.detail-title{ font-size:1.1rem; font-weight:700; margin:0; }
.detail-meta{ font-size:.78rem; color:var(--color-text-secondary); margin-top:.4rem; line-height:1.7; }
.close-btn{ background:var(--color-muted); border:1px solid var(--color-border); border-radius:.6rem; padding:.5rem 1rem; font-size:.78rem; color:var(--color-text); }
.close-btn:hover{ background:var(--color-border); }

.detail-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:1.75rem; }
@media (max-width:900px){ .detail-grid{ grid-template-columns:1fr; } }

/* عمود التتبّع — الخطوات الفعلية المتاحة في أعمدة chat_engine_trace_events المنفصلة */
.spine{ position:relative; padding-right:26px; }
.spine::before{ content:''; position:absolute; right:7px; top:6px; bottom:6px; width:2px; background:linear-gradient(180deg, var(--color-accent-2) 0%, rgba(255,255,255,.12) 100%); }
.spine-step{ position:relative; margin-bottom:4px; }
.spine-dot{ position:absolute; right:-26px; top:3px; width:14px; height:14px; border-radius:50%; background:var(--color-surface); border:2px solid var(--color-accent-2); }
.spine-step.inactive .spine-dot{ border-color:rgba(255,255,255,.2); }
.spine-toggle{ width:100%; text-align:right; background:none; border:none; padding:.5rem 0 .5rem .75rem; display:flex; justify-content:space-between; align-items:center; border-radius:.5rem; color:var(--color-text); }
.spine-toggle:hover{ background:rgba(255,255,255,.03); }
.spine-num{ font-family:var(--font-mono); direction:ltr; font-size:10.5px; color:var(--color-text-3); margin-left:8px; }
.spine-name{ font-weight:700; font-size:.88rem; }
.spine-summary{ font-size:.78rem; color:var(--color-text-3); font-family:var(--font-mono); direction:ltr; text-align:left; }
.spine-body{ display:none; background:#050912; color:#C7CBE0; border:1px solid var(--color-border); border-radius:.6rem; padding:.9rem 1rem; margin:6px 0 14px 0; font-family:var(--font-mono); direction:ltr; text-align:left; font-size:.76rem; line-height:1.65; white-space:pre-wrap; }
.spine-body.open{ display:block; }

.response-card{ background:var(--color-muted); border:1px solid var(--color-border); border-radius:.7rem; padding:.9rem 1rem; margin-top:1.1rem; font-size:.85rem; }
.response-card .label{ font-size:.72rem; color:var(--color-text-secondary); margin-bottom:.4rem; font-weight:700; }

/* العمود الأيسر: التصحيح والحالة */
.panel-block{ border:1px solid var(--color-border); background:var(--color-muted); border-radius:.8rem; padding:1.1rem 1.2rem; margin-bottom:1rem; }
.panel-block h4{ margin:0 0 .3rem; font-size:.9rem; }
.panel-block p.hint{ color:var(--color-text-secondary); font-size:.75rem; margin:0 0 .8rem; line-height:1.6; }
select, textarea, input[type=text]{
    width:100%; border:1px solid var(--color-border); border-radius:.6rem; padding:.6rem .7rem;
    font-family: var(--font-body); font-size:.85rem; background:var(--input-bg); color:var(--color-text);
}
textarea{ resize:vertical; min-height:64px; }
label.field-label{ font-size:.75rem; color:var(--color-text-secondary); font-weight:600; display:block; margin:.6rem 0 .3rem; }
.status-options{ display:flex; gap:6px; flex-wrap:wrap; margin-top:.5rem; }
.status-opt{ border:1px solid var(--color-border); background:var(--input-bg); border-radius:20px; padding:.4rem .8rem; font-size:.78rem; color:var(--color-text-secondary); }
.status-opt.active{ background:var(--color-accent); color:#fff; border-color:var(--color-accent); }
.btn{ border:none; border-radius:.6rem; padding:.6rem 1.1rem; font-size:.82rem; font-weight:700; font-family:inherit; }
.btn-primary{ background:linear-gradient(135deg,#4DA3FF,#0077CC); color:#fff; }
.btn-primary:hover{ box-shadow:0 0 20px -4px rgba(77,163,255,.5); }
.btn-ghost{ background:var(--color-muted); border:1px solid var(--color-border); color:var(--color-text); display:inline-flex; align-items:center; gap:6px; }
.btn-ghost:hover{ background:var(--color-border); }
.btn-ghost:disabled{ opacity:.55; cursor:default; }
.btn-sm{ padding:.4rem .75rem; font-size:.74rem; }
.save-row{ display:flex; justify-content:flex-start; align-items:center; gap:.8rem; margin-top:.9rem; }
.saved-flag{ font-size:.78rem; color:#22C58B; display:none; }
.saved-flag.show{ display:inline; }

/* ---------- رأس الصفحة: أزرار وحالة الاتصال ---------- */
.header-actions{ display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; justify-content:flex-end; }
.last-sync{ font-family:var(--font-mono); direction:ltr; font-size:10.5px; color:var(--color-text-3); white-space:nowrap; }

/* ---------- نبض محرك SIE ---------- */
.pulse-card{ padding:1.1rem 1.35rem; margin-bottom:1.75rem; }
.pulse-title{ font-size:.78rem; font-weight:700; color:var(--color-text-secondary); margin-bottom:.9rem; }
.pulse-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:1rem; }
.pulse-item{ text-align:center; }
.pulse-value{ font-size:1.3rem; font-weight:800; font-family:'Space Grotesk', var(--font-display); color:var(--color-text); }
.pulse-value.zero{ color:var(--color-text-3); }
.pulse-label{ font-size:.72rem; color:var(--color-text-secondary); margin-top:.2rem; }
.pulse-note{ margin-top:.9rem; padding-top:.8rem; border-top:1px solid var(--color-border); font-size:.78rem; color:#F5A623; display:none; line-height:1.7; }
.pulse-note.show{ display:block; }

/* ---------- شريط الفلاتر ---------- */
.filters-card{ padding:1rem 1.25rem; margin-bottom:1.1rem; }
.filters-row{ display:flex; align-items:flex-end; gap:.9rem; flex-wrap:wrap; }
.filter-field{ min-width:150px; }
.filter-field label{ display:block; font-size:.72rem; color:var(--color-text-secondary); font-weight:600; margin-bottom:.35rem; }
.filter-field select, .filter-field input{ padding:.5rem .65rem; font-size:.8rem; }
.filter-search{ flex:1; min-width:200px; }

/* ---------- تحميل المزيد ---------- */
.load-more-row{ display:flex; justify-content:center; padding:1rem; border-top:1px solid var(--color-border); }

/* ---------- المحادثة الكاملة ---------- */
.transcript{ margin-top:.8rem; max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-left:4px; }
.t-msg{ max-width:85%; padding:.55rem .8rem; border-radius:.7rem; font-size:.8rem; line-height:1.6; }
.t-msg .t-meta{ font-size:.68rem; color:var(--color-text-3); margin-top:3px; font-family:var(--font-mono); direction:ltr; text-align:left; }
.t-msg.customer{ align-self:flex-start; background:var(--color-muted); border:1px solid var(--color-border); }
.t-msg.bot{ align-self:flex-end; background:rgba(0,119,204,.14); border:1px solid rgba(77,163,255,.22); }
.t-msg.admin{ align-self:flex-end; background:rgba(34,197,139,.12); border:1px solid rgba(34,197,139,.25); }

@media (max-width:768px){
    .admin-main{ padding:1.25rem; }
    .stats-grid{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>
<div id="sidebar-container"></div>

<main class="admin-main">
    <div id="app-root">
        <div style="text-align:center; padding:5rem 1rem; color:var(--color-text-secondary);">جارِ التحقق من الصلاحيات...</div>
    </div>
</main>

<template id="page-template">
    <div class="page-header">
        <div>
            <span class="eyebrow"><span class="dot"></span> محرك الدعم الذكي — Module 9</span>
            <h1 class="gradient-text">قائمة التعلّم</h1>
            <p>المحادثات اللي المحرك حطّها للمراجعة — ثقة منخفضة، رد احتياطي (Fallback)، أو تصعيد لم يُحل. الشاشة دي فلتر على سجل التتبع نفسه، مش تخزين منفصل.</p>
        </div>
        <div class="header-actions">
            <span class="demo-flag" id="dataModeFlag" style="display:none;"></span>
            <span class="last-sync" id="lastSyncLabel"></span>
            <button class="btn btn-ghost btn-sm" id="refreshBtn" title="تحديث القائمة الآن">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                تحديث
            </button>
        </div>
    </div>

    <div class="glass-card pulse-card">
        <div class="pulse-title">نبض محرك SIE — حالة المحرك الفعلية، مش مجرد تأكيد اتصال</div>
        <div class="pulse-grid">
            <div class="pulse-item"><div class="pulse-value" id="pulse-total-traces">—</div><div class="pulse-label">تتبّعات مُسجَّلة (كل الوقت)</div></div>
            <div class="pulse-item"><div class="pulse-value" id="pulse-sessions">—</div><div class="pulse-label">جلسات SIE حقيقية مُسجَّلة</div></div>
            <div class="pulse-item"><div class="pulse-value" id="pulse-last-trace">—</div><div class="pulse-label">آخر تتبّع مسجَّل</div></div>
            <div class="pulse-item"><div class="pulse-value" id="pulse-sie-users">—</div><div class="pulse-label">عملاء مفعّل لهم SIE</div></div>
        </div>
        <div class="pulse-note" id="pulse-note"></div>
    </div>

    <div class="stats-grid">
        <div class="glass-card stat-card">
            <div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
            <div class="stat-info"><div class="stat-label">إجمالي القائمة</div><div class="stat-value" id="stat-total">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon warn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
            <div class="stat-info"><div class="stat-label">رد احتياطي (Fallback)</div><div class="stat-value" id="stat-fallback">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon danger"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
            <div class="stat-info"><div class="stat-label">تصعيد غير معروف</div><div class="stat-value" id="stat-escalated">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon ok"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
            <div class="stat-info"><div class="stat-label">تم التصحيح</div><div class="stat-value" id="stat-corrected">—</div></div>
        </div>
    </div>

    <div class="glass-card filters-card">
        <div class="filters-row">
            <div class="filter-field">
                <label>السبب</label>
                <select id="filter-reason">
                    <option value="all">الكل</option>
                    <option value="fallback">رد احتياطي</option>
                    <option value="escalated_unknown">تصعيد (غير معروف)</option>
                    <option value="low_confidence">ثقة منخفضة</option>
                </select>
            </div>
            <div class="filter-field">
                <label>الحالة</label>
                <select id="filter-status">
                    <option value="all">الكل</option>
                    <option value="unresolved">غير محلولة</option>
                    <option value="reviewed">تمت المراجعة</option>
                    <option value="corrected">تم التصحيح</option>
                </select>
            </div>
            <div class="filter-field filter-search">
                <label>بحث بمعرّف الجلسة</label>
                <input type="text" id="filter-session" placeholder="مثلاً a1b2c3…" class="ltr-data" autocomplete="off">
            </div>
            <button class="btn btn-ghost btn-sm" id="clearFiltersBtn">مسح الفلاتر</button>
        </div>
    </div>

    <div class="glass-card section-card">
        <div class="table-wrap">
            <table class="queue-table">
                <thead>
                    <tr>
                        <th>الجلسة</th>
                        <th>تفسير القرار</th>
                        <th>السبب</th>
                        <th>الثقة</th>
                        <th>الحالة</th>
                        <th>الدور</th>
                    </tr>
                </thead>
                <tbody id="queue-body"></tbody>
            </table>
        </div>
        <div id="empty" class="empty-state" style="display:none;">مفيش حاجة في قائمة التعلّم دلوقتي.</div>
        <div class="load-more-row" id="loadMoreRow" style="display:none;">
            <button class="btn btn-ghost btn-sm" id="loadMoreBtn">تحميل 200 صف إضافي</button>
        </div>
    </div>

    <section id="detail" class="detail glass-card">
        <div class="detail-head">
            <div>
                <h3 class="detail-title" id="detail-title">—</h3>
                <div class="detail-meta" id="detail-meta">—</div>
            </div>
            <button class="close-btn" id="closeDetailBtn">إغلاق</button>
        </div>

        <div class="detail-grid">
            <div>
                <div class="spine" id="spine"></div>
                <div class="response-card">
                    <div class="label">الرد المُرسل في هذا الدور</div>
                    <div id="response-text">—</div>
                </div>
                <div class="panel-block" style="margin-top:1rem;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <h4 style="margin:0;">المحادثة الكاملة</h4>
                        <button class="btn btn-ghost btn-sm" id="loadConversationBtn">عرض</button>
                    </div>
                    <p class="hint" style="margin-top:.5rem;">كل رسائل الجلسة دي بالترتيب — مش الدور المُبلَّغ عنه بس — عشان تفهم السياق كامل قبل التصحيح.</p>
                    <div id="conversation-transcript" class="transcript" style="display:none;"></div>
                </div>
            </div>

            <div>
                <div class="panel-block">
                    <h4>تصحيح التشخيص</h4>
                    <p class="hint">لو المحرك اختار السيناريو الغلط، صححه هنا. ده هيتسجل كملاحظة على المراجعة — مش هيغيّر كتالوج السيناريوهات لوحده.</p>
                    <label class="field-label">السيناريو الصحيح</label>
                    <select id="correction-scenario"></select>
                    <label class="field-label">ملاحظة للفريق</label>
                    <textarea id="correction-note" placeholder="مثلاً: العميل كان بيسأل عن إلغاء الاشتراك، مش الفوترة…"></textarea>
                </div>

                <div class="panel-block">
                    <h4>حالة المراجعة</h4>
                    <p class="hint">متسجّلة في جدول chat_engine_conversation_reviews.</p>
                    <div class="status-options" id="status-options"></div>
                </div>

                <div class="save-row">
                    <button class="btn btn-primary" id="saveReviewBtn">حفظ المراجعة</button>

</template>

<template id="not-authorized-template">
    <div class="glass-card not-authorized">
        <h2 style="margin:0 0 .6rem;">هذه الصفحة متاحة للأدمن فقط</h2>
        <p style="color:var(--color-text-secondary); font-size:.9rem; line-height:1.7; margin:0;">
            مركز مراجعة محرك الدعم الذكي (Learning Queue) يعرض محادثات حقيقية وتصحيحات على تشخيص المحرك، لذا الوصول مقصور على حسابات الأدمن.
        </p>
    </div>
</template>

<script type="module">
import { checkAdminAuth, updateAdminUI } from '/assets/js/admin/auth.js';
import { initSidebar } from '/assets/js/admin/sidebar.js';
import { supabase } from '/api-config.js';

initSidebar();

const appRoot = document.getElementById('app-root');
const user = await checkAdminAuth();

if (user) {
    updateAdminUI(user);

    if (user.profile?.role === 'admin') {
        appRoot.innerHTML = '';
        appRoot.appendChild(document.getElementById('page-template').content.cloneNode(true));
        initReviewCenter(user);
    } else {
        appRoot.innerHTML = '';
        appRoot.appendChild(document.getElementById('not-authorized-template').content.cloneNode(true));
    }
}

// ------------------------------------------------------------------
// متصل ببيانات حقيقية فعلاً — والشكل هنا اتأكّد منه مباشرة على القاعدة
// الحية عبر Supabase (مش من ملف migration 0001 المرفق في الريبو، اللي
// بقى قديم — حد غيّر السكيمـا فعليًا على القاعدة بعد كتابته):
//
//   - chat_engine_learning_queue (VIEW): trace_event_id, session_id,
//     turn, action, scenario_id, confidence, explanation, created_at.
//     مفيش عمود trace (jsonb) واحد ولا reason ولا review_id/review_status
//     زي ما كان متوقّع قديمًا — "السبب" بيتحسب هنا في الواجهة (نفس شرط
//     WHERE بتاع الـ view نفسه)، والمراجعة بتتجاب باستعلام منفصل على
//     chat_engine_conversation_reviews بالـ session_id.
//
//   - chat_engine_trace_events (الجدول نفسه، مش الـ view): أعمدة منفصلة
//     بدل عمود trace واحد: normalized_tokens, hypotheses, ranking,
//     decision, knowledge_data, rendered, action_result,
//     response_language, processing_time_ms. بنجيبها بالـ id لما صف
//     يتفتح. العرض هنا دفاعي عن قصد: بيدوّر على المفاتيح المتوقعة ولو
//     مالقاش بيعرض الـ JSON خام بدل ما يفترض شكل ثابت.
//
//     ملحوظة مهمة: لحد وقت قريب كان الجدول ده بيفضل 0 صف حتى مع استخدام
//     حقيقي من عملاء مؤهّلين لـ SIE، لأن sie/action/supabase-port.supabase.js
//     كانت لسه بتكتب على عمود trace القديم اللي مبقاش موجود — كل INSERT
//     كان بيفشل بصمت. اتصلح دلوقتي (insertTraceEvent بقى بيكتب على
//     الأعمدة الحقيقية)، فالقائمة المفروض تتغذّى فعليًا من محرك SIE
//     الحي من هنا وطالع. "نبض المحرك" تحت بيوريك العدد الحقيقي بدل ما
//     تفترض إن "الاتصال شغّال" يعني "فيه بيانات حقيقية".
//
//   - chat_engine_conversation_reviews: مراجعة واحدة لكل *جلسة* مش لكل
//     دور (session_id عليه UNIQUE constraint، ومفيش عمود
//     triggered_by_turn أصلًا). الأعمدة الحقيقية: id, session_id,
//     status, corrected_scenario_id, reviewed_by, reviewed_at, notes,
//     created_at. status مقيّد بـ CHECK على 3 قيم بس:
//     unresolved | reviewed | corrected (مش open/in_review/resolved/
//     dismissed زي ما كان في التصميم الأصلي).
// ------------------------------------------------------------------
async function initReviewCenter(currentUser) {
    const PAGE_SIZE = 200;
    const FALLBACK_SCENARIO_OPTIONS = [
        'login_token_expired', 'api_integration_issue', 'webhook_delivery_failure',
        'subscription_payment_not_reflected', 'pricing_inquiry', 'platform_info_inquiry',
        'ticket_status_inquiry', 'subscription_status_inquiry', 'unknown'
    ];
    const STATUS_OPTIONS = [
        { value: 'unresolved', label: 'غير محلولة' },
        { value: 'reviewed', label: 'تمت المراجعة' },
        { value: 'corrected', label: 'تم التصحيح' }
    ];

    let QUEUE = [];
    let SCENARIO_OPTIONS = FALLBACK_SCENARIO_OPTIONS;
    let selected = null;
    let pendingStatus = {};
    let hasMore = false;
    let totalTraceEventsEver = null; // null = لسه معرفناش، 0 = عرفنا إنها فاضية فعلاً
    const filters = { reason: 'all', status: 'all', session: '' };

    const dataModeFlag = document.getElementById('dataModeFlag');
    const lastSyncLabel = document.getElementById('lastSyncLabel');

    function setFlag(mode, text) {
        // حالة النجاح (live) مالهاش لازمة تتعلن كـ "شارة نجاح" دايمة —
        // ده بالظبط النص اللي طلب صاحب المنصة نشيله لأنه بيوهم إن وصول
        // الاستعلام يعني وجود بيانات حقيقية ذات معنى. بدل كده، بنكتفي
        // بتحديث "آخر تحديث" بصمت، ونسيب الشارة الظاهرة بس لحالة التحميل
        // أو الخطأ الفعلي.
        if (mode === 'live') {
            dataModeFlag.style.display = 'none';
            dataModeFlag.textContent = '';
            lastSyncLabel.textContent = `آخر تحديث: ${new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
            return;
        }
        dataModeFlag.style.display = 'inline-flex';
        dataModeFlag.className = 'demo-flag' + (mode ? ' ' + mode : '');
        dataModeFlag.textContent = text;
    }

    function reasonLabel(r) { return { fallback: 'رد احتياطي', escalated_unknown: 'تصعيد (غير معروف)', low_confidence: 'ثقة منخفضة' }[r] || r || '—'; }
    function statusLabel(s) { return (STATUS_OPTIONS.find(o => o.value === s) || {}).label || s; }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function safeStringify(v) {
        if (v === null || v === undefined) return 'null';
        if (typeof v === 'string') return v;
        try { return JSON.stringify(v, null, 2); } catch { return String(v); }
    }

    function pickText(obj, keys) {
        if (typeof obj === 'string') return obj;
        if (!obj || typeof obj !== 'object') return null;
        for (const k of keys) {
            if (typeof obj[k] === 'string' && obj[k].trim() !== '') return obj[k];
        }
        return null;
    }

    // بيحسب سبب ظهور الصف في القائمة بنفس منطق شرط WHERE في
    // chat_engine_learning_queue (الأولوية: fallback > escalated_unknown > low_confidence)
    function computeReason(row) {
        if (row.action === 'FALLBACK') return 'fallback';
        if (row.action === 'ESCALATE_TO_HUMAN' && (!row.scenario_id || row.scenario_id === 'unknown')) return 'escalated_unknown';
        return 'low_confidence';
    }

    // يحوّل صف الـ view + صف المراجعة (لو موجود) لشكل مناسب للعرض
    function projectRow(row, review) {
        const confidenceNum = row.confidence === null || row.confidence === undefined ? null : Number(row.confidence);
        return {
            traceEventId: row.trace_event_id,
            sessionId: row.session_id,
            turn: row.turn,
            reason: computeReason(row),
            confidence: Number.isFinite(confidenceNum) ? confidenceNum : null,
            action: row.action,
            scenarioId: row.scenario_id,
            explanation: row.explanation,
            reviewId: review?.id || null,
            status: review?.status || 'unresolved',
            correctedScenarioId: review?.corrected_scenario_id || null,
            notes: review?.notes || null,
            createdAt: row.created_at
        };
    }

    async function loadScenarioOptions() {
        try {
            const { data, error } = await supabase
                .from('chat_engine_scenarios')
                .select('scenario_key');
            if (error || !data || data.length === 0) return;
            const uniqueKeys = [...new Set(data.map(r => r.scenario_key))].sort();
            if (uniqueKeys.length > 0) SCENARIO_OPTIONS = uniqueKeys;
        } catch (err) {
            console.warn('[review-center] تعذّر تحميل قائمة السيناريوهات، هنستخدم القائمة الافتراضية:', err);
        }
    }

    let offset = 0;
    let reviewsBySession = {};

    function formatRelative(iso) {
        if (!iso) return '—';
        const diffMs = Date.now() - new Date(iso).getTime();
        const mins = Math.floor(diffMs / 60000);
        if (mins < 1) return 'الآن';
        if (mins < 60) return `منذ ${mins} د`;
        const hours = Math.floor(mins / 60);
        if (hours < 24) return `منذ ${hours} س`;
        const days = Math.floor(hours / 24);
        return `منذ ${days} يوم`;
    }

    // بيجيب أرقام حقيقية عن حالة محرك SIE (مش مجرد "الاستعلام نجح") — عدد
    // التتبّعات المُسجَّلة فعليًا من كل الوقت، عدد الجلسات المختلفة، آخر
    // وقت اتسجّل فيه تتبّع، وعدد العملاء المفعّل لهم SIE. لو العدد صفر،
    // بنوريه صراحة بدل ما نسيب القائمة الفاضية تفسَّر غلط على إنها "كل حاجة تمام".
    async function loadEnginePulse() {
        const noteEl = document.getElementById('pulse-note');
        noteEl.classList.remove('show');
        noteEl.textContent = '';
        try {
            const { count, error: countError } = await supabase
                .from('chat_engine_trace_events')
                .select('id', { count: 'exact', head: true });
            if (countError) throw countError;

            totalTraceEventsEver = count ?? 0;
            const totalEl = document.getElementById('pulse-total-traces');
            totalEl.textContent = totalTraceEventsEver;
            totalEl.classList.toggle('zero', totalTraceEventsEver === 0);

            const sessionsEl = document.getElementById('pulse-sessions');
            const lastTraceEl = document.getElementById('pulse-last-trace');

            if (totalTraceEventsEver === 0) {
                sessionsEl.textContent = '0'; sessionsEl.classList.add('zero');
                lastTraceEl.textContent = 'لسه ولا مرة'; lastTraceEl.classList.add('zero');
                noteEl.textContent = 'محرك SIE لسه ما سجّلش أي تتبّع حقيقي — القائمة تحت فاضية لأن مفيش بيانات بتتولّد أصلًا، مش لأن كل حاجة تمام.';
                noteEl.classList.add('show');
            } else {
                sessionsEl.classList.remove('zero'); lastTraceEl.classList.remove('zero');
                const [sessionsResult, lastResult] = await Promise.all([
                    supabase.from('chat_engine_trace_events').select('session_id').limit(5000),
                    supabase.from('chat_engine_trace_events').select('created_at').order('created_at', { ascending: false }).limit(1).maybeSingle()
                ]);
                if (sessionsResult.error) throw sessionsResult.error;
                if (lastResult.error) throw lastResult.error;
                const distinctSessions = new Set((sessionsResult.data || []).map(r => r.session_id)).size;
                const approx = (sessionsResult.data || []).length >= 5000 ? '+' : '';
                sessionsEl.textContent = distinctSessions + approx;
                lastTraceEl.textContent = formatRelative(lastResult.data?.created_at);
            }
        } catch (err) {
            console.warn('[review-center] تعذّر تحميل نبض المحرك:', err);
            document.getElementById('pulse-total-traces').textContent = '—';
            document.getElementById('pulse-sessions').textContent = '—';
            document.getElementById('pulse-last-trace').textContent = '—';
        }

        // عدد العملاء المفعّل لهم SIE — best effort: لو الحساب الحالي مش
        // is_sie_admin() (بريد محدد، مش أي أدمن) هيرجع صفر بسبب RLS، مش
        // لازم يبقى معناه فعليًا صفر عميل مفعّل.
        try {
            const { count: sieUsersCount, error: sieUsersError } = await supabase
                .from('customer_sie_access')
                .select('id', { count: 'exact', head: true })
                .eq('is_enabled', true);
            document.getElementById('pulse-sie-users').textContent = sieUsersError ? '—' : (sieUsersCount ?? 0);
        } catch {
            document.getElementById('pulse-sie-users').textContent = '—';
        }
    }

    function applyFilters(rows) {
        return rows.filter(item => {
            if (filters.reason !== 'all' && item.reason !== filters.reason) return false;
            if (filters.status !== 'all' && item.status !== filters.status) return false;
            if (filters.session && !String(item.sessionId || '').toLowerCase().includes(filters.session)) return false;
            return true;
        });
    }

    async function loadQueue({ reset = true } = {}) {
        setFlag(null, '● جارِ الاتصال بقاعدة البيانات…');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        if (reset) offset = 0;
        else { loadMoreBtn.disabled = true; loadMoreBtn.textContent = 'جارِ التحميل…'; }

        try {
            const { data, error } = await supabase
                .from('chat_engine_learning_queue')
                .select('trace_event_id, session_id, turn, action, scenario_id, confidence, explanation, created_at')
                .order('created_at', { ascending: false })
                .range(offset, offset + PAGE_SIZE - 1);

            if (error) throw error;

            const rows = data || [];
            const newSessionIds = [...new Set(rows.map(r => r.session_id))].filter(id => !(id in reviewsBySession));

            if (newSessionIds.length > 0) {
                const { data: reviews, error: reviewsError } = await supabase
                    .from('chat_engine_conversation_reviews')
                    .select('id, session_id, status, corrected_scenario_id, notes')
                    .in('session_id', newSessionIds);
                if (reviewsError) throw reviewsError;
                for (const sid of newSessionIds) reviewsBySession[sid] = null;
                for (const r of (reviews || [])) reviewsBySession[r.session_id] = r;
            }

            const projected = rows.map(row => projectRow(row, reviewsBySession[row.session_id]));
            QUEUE = reset ? projected : QUEUE.concat(projected);
            offset += rows.length;
            hasMore = rows.length === PAGE_SIZE;
            document.getElementById('loadMoreRow').style.display = hasMore ? 'flex' : 'none';

            setFlag('live');
            renderQueue();
        } catch (err) {
            console.error('[review-center] فشل تحميل قائمة التعلّم:', err);
            setFlag('error', '● تعذّر الاتصال بالبيانات — تحقق من صلاحيات Supabase/RLS');
            document.getElementById('empty').style.display = 'block';
            document.getElementById('empty').textContent =
                'تعذّر تحميل قائمة التعلّم. تحقق من رسالة الخطأ في الـ console — غالبًا صلاحيات الحساب ' +
                '(is_chat_engine_staff) أو مشكلة في شكل الاستعلام مقابل الـ view الحالي.';
            document.getElementById('queue-body').innerHTML = '';
        } finally {
            loadMoreBtn.disabled = false;
            loadMoreBtn.textContent = 'تحميل 200 صف إضافي';
        }
    }

    function renderStats() {
        document.getElementById('stat-total').textContent = QUEUE.length;
        document.getElementById('stat-fallback').textContent = QUEUE.filter(q => q.reason === 'fallback').length;
        document.getElementById('stat-escalated').textContent = QUEUE.filter(q => q.reason === 'escalated_unknown').length;
        document.getElementById('stat-corrected').textContent = QUEUE.filter(q => q.status === 'corrected').length;
    }

    function renderQueue() {
        renderStats();
        const body = document.getElementById('queue-body');
        const emptyEl = document.getElementById('empty');
        const visibleRows = applyFilters(QUEUE);

        if (QUEUE.length === 0) {
            emptyEl.style.display = 'block';
            if (totalTraceEventsEver === 0) {
                emptyEl.textContent = 'القائمة فاضية لأن محرك SIE لسه ما سجّلش أي محادثة حقيقية خالص — راجع "نبض المحرك" فوق. الفراغ هنا معناه "مفيش بيانات"، مش "كل حاجة تمام".';
            } else if (typeof totalTraceEventsEver === 'number' && totalTraceEventsEver > 0) {
                emptyEl.textContent = `المحرك سجّل ${totalTraceEventsEver} تتبّع فعلي حتى الآن، ومفيش ولا واحد محتاج مراجعة دلوقتي — يبان إن ثقة المحرك كويسة.`;
            } else {
                emptyEl.textContent = 'مفيش حاجة في قائمة التعلّم دلوقتي.';
            }
            body.innerHTML = '';
            return;
        }

        if (visibleRows.length === 0) {
            emptyEl.style.display = 'block';
            emptyEl.textContent = 'مفيش صفوف مطابقة للفلاتر الحالية — جرّب "مسح الفلاتر".';
            body.innerHTML = '';
            return;
        }

        emptyEl.style.display = 'none';
        body.innerHTML = visibleRows.map(item => `
            <tr class="${selected === item.traceEventId ? 'selected' : ''}" data-id="${escapeHtml(item.traceEventId)}">
                <td class="qid">${escapeHtml((item.sessionId || '').toString().slice(0, 8))}</td>
                <td>${escapeHtml(item.explanation || item.scenarioId || item.action || '—')}<span class="qmsg-sub">${escapeHtml(item.scenarioId || 'unknown')} · الدور ${item.turn}</span></td>
                <td><span class="badge ${item.reason}">${reasonLabel(item.reason)}</span></td>
                <td class="conf">${item.confidence === null ? '—' : item.confidence.toFixed(2)}</td>
                <td><span class="status-badge status-${item.status}">${statusLabel(item.status)}</span></td>
                <td class="conf">#${item.turn}</td>
            </tr>
        `).join('');
        body.querySelectorAll('tr').forEach(row => {
            row.addEventListener('click', () => openDetail(row.dataset.id));
        });
    }

    // بيبني عمود التتبّع من أعمدة chat_engine_trace_events الفعلية.
    // دفاعي عن قصد: بيحاول المفاتيح المتوقعة ولو مالقاش بيعرض الـ JSON
    // الخام للعمود كامل بدل ما يفترض شكل ثابت.
    function buildSpine(row) {
        const tokens = row.normalized_tokens;
        const tokenList = Array.isArray(tokens) ? tokens : (Array.isArray(tokens?.canonicals) ? tokens.canonicals : null);
        const rawText = pickText(tokens, ['rawText', 'raw_text', 'text']);

        const hyps = Array.isArray(row.hypotheses) ? row.hypotheses : (Array.isArray(row.hypotheses?.items) ? row.hypotheses.items : []);
        const ranking = row.ranking || {};
        const decision = row.decision || {};
        const rendered = row.rendered || {};
        const responseText = pickText(rendered, ['responseText', 'text', 'message']);

        const steps = [
            {
                name: 'اللغة',
                summary: rawText ? rawText.slice(0, 40) : (tokenList ? `${tokenList.length} tokens` : '—'),
                body: (rawText ? `rawText: ${JSON.stringify(rawText)}\n\n` : '') +
                    `normalized_tokens:\n${safeStringify(tokens)}` +
                    (row.response_language ? `\n\nresponse_language: ${row.response_language}` : '')
            },
            {
                name: 'التشخيص',
                summary: `${hyps.length} hypotheses`,
                body: hyps.length
                    ? 'hypotheses:\n' + hyps.map(h => `  - scenarioId: ${h.scenarioId ?? h.scenario_id ?? '—'}  confidence: ${h.confidence ?? '—'}  status: ${h.status ?? '—'}`).join('\n')
                    : `hypotheses:\n${safeStringify(row.hypotheses)}`
            },
            {
                name: 'الترتيب',
                summary: `top: ${ranking.topScenarioId ?? ranking.top_scenario_id ?? 'none'} (${ranking.topConfidence ?? ranking.top_confidence ?? '—'})`,
                body: safeStringify(ranking)
            },
            {
                name: 'القرار',
                summary: `${decision.action ?? row.action ?? '—'}`,
                body: safeStringify(decision) +
                    (typeof row.processing_time_ms === 'number' ? `\n\nprocessing_time_ms: ${row.processing_time_ms}` : '')
            }
        ];

        if (row.knowledge_data !== null && row.knowledge_data !== undefined) {
            steps.push({ name: 'المعرفة', summary: 'knowledge_data', body: safeStringify(row.knowledge_data) });
        }

        steps.push({
            name: 'الحوار',
            summary: responseText ? responseText.slice(0, 40) : '(مفيش نص رد مُستخرَج)',
            body: (responseText ? `responseText: ${JSON.stringify(responseText)}\n\n` : '') + `rendered:\n${safeStringify(rendered)}`
        });

        if (row.action_result !== null && row.action_result !== undefined) {
            steps.push({ name: 'تنفيذ الإجراء', summary: 'action_result', body: safeStringify(row.action_result) });
        }

        return steps;
    }

    function renderSpine(spine) {
        document.getElementById('spine').innerHTML = spine.map((step, si) => `
            <div class="spine-step" id="spine-step-${si}">
                <div class="spine-dot"></div>
                <button class="spine-toggle" data-si="${si}">
                    <span class="spine-summary">${escapeHtml(step.summary)}</span>
                    <span><span class="spine-name">${step.name}</span><span class="spine-num">0${si + 1}</span></span>
                </button>
                <div class="spine-body" id="spine-body-${si}">${escapeHtml(step.body).replace(/\n/g, '<br>')}</div>
            </div>
        `).join('');
        document.querySelectorAll('.spine-toggle').forEach(btn => {
            btn.addEventListener('click', () => toggleSpine(Number(btn.dataset.si)));
        });
    }

    async function openDetail(traceEventId) {
        const item = QUEUE.find(q => q.traceEventId === traceEventId);
        if (!item) return;
        selected = traceEventId;
        renderQueue();
        const detail = document.getElementById('detail');
        detail.classList.add('open');
        document.getElementById('detail-title').textContent = `الجلسة ${item.sessionId} — الدور ${item.turn}`;
        document.getElementById('detail-meta').textContent =
            `السبب: ${reasonLabel(item.reason)} · الثقة: ${item.confidence === null ? 'غير متاحة' : item.confidence.toFixed(3)}` +
            (item.explanation ? ` · ${item.explanation}` : '');
        document.getElementById('response-text').textContent = '—';
        document.getElementById('spine').innerHTML = '<div class="empty-state" style="padding:2rem 0;">جارِ تحميل تفاصيل التتبّع…</div>';

        const scenarioSelect = document.getElementById('correction-scenario');
        scenarioSelect.innerHTML = SCENARIO_OPTIONS.map(s => `<option value="${s}" ${s === item.correctedScenarioId ? 'selected' : ''}>${s}</option>`).join('');

        const noteField = document.getElementById('correction-note');
        noteField.value = item.notes || '';

        pendingStatus[traceEventId] = pendingStatus[traceEventId] || item.status;
        renderStatusOptions(traceEventId);
        document.getElementById('saved-flag').classList.remove('show');

        const convWrap = document.getElementById('conversation-transcript');
        convWrap.style.display = 'none';
        convWrap.innerHTML = '';
        const loadConvBtn = document.getElementById('loadConversationBtn');
        loadConvBtn.textContent = 'عرض';
        loadConvBtn.onclick = () => loadConversation(item.sessionId, traceEventId);

        detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        // تفاصيل التتبّع الكاملة بتيجي من الجدول نفسه (chat_engine_trace_events)
        // مش من الـ view — الـ view بيدّي الحقول الأساسية بس اللي بتحدد
        // الفلترة والعرض في الجدول.
        try {
            const { data, error } = await supabase
                .from('chat_engine_trace_events')
                .select('normalized_tokens, hypotheses, ranking, decision, knowledge_data, rendered, action_result, response_language, processing_time_ms')
                .eq('id', item.traceEventId)
                .maybeSingle();
            if (error) throw error;
            if (selected !== traceEventId) return; // المستخدم فتح صف تاني قبل ما يخلص التحميل

            if (!data) {
                document.getElementById('spine').innerHTML = '<div class="empty-state" style="padding:2rem 0;">تعذّر إيجاد سجل التتبّع الكامل لهذا الصف.</div>';
                return;
            }

            renderSpine(buildSpine(data));
            const responseText = pickText(data.rendered, ['responseText', 'text', 'message']);
            document.getElementById('response-text').textContent = responseText || '—';
        } catch (err) {
            console.error('[review-center] تعذّر تحميل تفاصيل التتبّع:', err);
            if (selected === traceEventId) {
                document.getElementById('spine').innerHTML = '<div class="empty-state" style="padding:2rem 0;">تعذّر تحميل تفاصيل التتبّع.</div>';
            }
        }
    }

    // المحادثة الكاملة للجلسة — مش الدور المُبلَّغ عنه بس — عشان السياق.
    // best effort: لو الحساب الحالي مش is_main_admin() فعليًا (بريد محدد،
    // مش أي دور admin) هيرجع فاضي بسبب RLS على chat_messages.
    async function loadConversation(sessionId, forTraceEventId) {
        const wrap = document.getElementById('conversation-transcript');
        const btn = document.getElementById('loadConversationBtn');
        if (wrap.style.display === 'flex') {
            wrap.style.display = 'none';
            btn.textContent = 'عرض';
            return;
        }
        btn.disabled = true;
        btn.textContent = 'جارِ التحميل…';
        try {
            const { data, error } = await supabase
                .from('chat_messages')
                .select('id, message_text, is_bot_reply, is_admin_reply, created_at, image_url')
                .eq('session_id', sessionId)
                .order('created_at', { ascending: true })
                .limit(300);
            if (error) throw error;
            if (selected !== forTraceEventId) return;

            const rows = data || [];
            if (rows.length === 0) {
                wrap.innerHTML = '<div class="empty-state" style="padding:1rem 0;">مفيش رسائل متاحة لهذه الجلسة (أو الحساب الحالي مالوش صلاحية قراءتها).</div>';
            } else {
                wrap.innerHTML = rows.map(m => {
                    const cls = m.is_admin_reply ? 'admin' : (m.is_bot_reply ? 'bot' : 'customer');
                    const who = m.is_admin_reply ? 'الفريق' : (m.is_bot_reply ? 'البوت' : 'العميل');
                    const time = new Date(m.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                    const body = m.message_text || (m.image_url ? '(صورة)' : '—');
                    return `<div class="t-msg ${cls}">${escapeHtml(body)}<div class="t-meta">${who} · ${time}</div></div>`;
                }).join('');
            }
            wrap.style.display = 'flex';
            btn.textContent = 'إخفاء';
        } catch (err) {
            console.error('[review-center] تعذّر تحميل المحادثة الكاملة:', err);
            wrap.innerHTML = '<div class="empty-state" style="padding:1rem 0;">تعذّر تحميل المحادثة — تحقق من صلاحيات الحساب.</div>';
            wrap.style.display = 'flex';
            btn.textContent = 'عرض';
        } finally {
            btn.disabled = false;
        }
    }

    function toggleSpine(si) {
        document.getElementById(`spine-body-${si}`).classList.toggle('open');
        document.getElementById(`spine-step-${si}`).classList.toggle('inactive');
    }

    function renderStatusOptions(traceEventId) {
        const wrap = document.getElementById('status-options');
        wrap.innerHTML = STATUS_OPTIONS.map(s => `
            <button class="status-opt ${pendingStatus[traceEventId] === s.value ? 'active' : ''}" data-value="${s.value}">${s.label}</button>
        `).join('');
        wrap.querySelectorAll('.status-opt').forEach(btn => {
            btn.addEventListener('click', () => setStatus(traceEventId, btn.dataset.value));
        });
    }

    function setStatus(traceEventId, s) {
        pendingStatus[traceEventId] = s;
        renderStatusOptions(traceEventId);
    }

    async function saveReview() {
        if (selected === null) return;
        const item = QUEUE.find(q => q.traceEventId === selected);
        if (!item) return;
        const saveBtn = document.getElementById('saveReviewBtn');
        const notes = document.getElementById('correction-note').value.trim() || null;
        const correctedScenarioId = document.getElementById('correction-scenario').value || null;
        const status = pendingStatus[selected];

        saveBtn.disabled = true;
        saveBtn.textContent = 'جارِ الحفظ…';

        try {
            if (item.reviewId) {
                const { error } = await supabase
                    .from('chat_engine_conversation_reviews')
                    .update({
                        status,
                        corrected_scenario_id: correctedScenarioId,
                        notes,
                        reviewed_by: currentUser.id,
                        reviewed_at: new Date().toISOString()
                    })
                    .eq('id', item.reviewId);
                if (error) throw error;
            } else {
                const { data, error } = await supabase
                    .from('chat_engine_conversation_reviews')
                    .insert({
                        session_id: item.sessionId,
                        status,
                        corrected_scenario_id: correctedScenarioId,
                        notes,
                        reviewed_by: currentUser.id,
                        reviewed_at: new Date().toISOString()
                    })
                    .select('id')
                    .single();
                if (error) throw error;
                item.reviewId = data.id;
                reviewsBySession[item.sessionId] = { id: data.id, session_id: item.sessionId, status, corrected_scenario_id: correctedScenarioId, notes };
            }

            item.status = status;
            item.correctedScenarioId = correctedScenarioId;
            item.notes = notes;
            renderQueue();

            const flag = document.getElementById('saved-flag');
            flag.style.color = '';
            flag.textContent = 'تم الحفظ في chat_engine_conversation_reviews';
            flag.classList.add('show');
            setTimeout(() => flag.classList.remove('show'), 2500);
        } catch (err) {
            console.error('[review-center] فشل حفظ المراجعة:', err);
            const flag = document.getElementById('saved-flag');
            flag.textContent = 'فشل الحفظ — تحقق من صلاحيات الأدمن (RLS)';
            flag.style.color = 'var(--color-danger)';
            flag.classList.add('show');
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ المراجعة';
        }
    }

    document.getElementById('closeDetailBtn').addEventListener('click', () => {
        selected = null;
        document.getElementById('detail').classList.remove('open');
        renderQueue();
    });
    document.getElementById('saveReviewBtn').addEventListener('click', saveReview);

    document.getElementById('filter-reason').addEventListener('change', e => { filters.reason = e.target.value; renderQueue(); });
    document.getElementById('filter-status').addEventListener('change', e => { filters.status = e.target.value; renderQueue(); });
    document.getElementById('filter-session').addEventListener('input', e => { filters.session = e.target.value.trim().toLowerCase(); renderQueue(); });
    document.getElementById('clearFiltersBtn').addEventListener('click', () => {
        filters.reason = 'all'; filters.status = 'all'; filters.session = '';
        document.getElementById('filter-reason').value = 'all';
        document.getElementById('filter-status').value = 'all';
        document.getElementById('filter-session').value = '';
        renderQueue();
    });
    document.getElementById('refreshBtn').addEventListener('click', () => {
        loadQueue({ reset: true });
        loadEnginePulse();
    });
    document.getElementById('loadMoreBtn').addEventListener('click', () => loadQueue({ reset: false }));

    await Promise.all([loadScenarioOptions(), loadQueue(), loadEnginePulse()]);
}
</script>
</body>
</html>
