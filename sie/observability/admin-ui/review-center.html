<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="/error-tracker.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز المراجعة — محرك الدعم الذكي | لوحة الإدارة</title>
<link rel="icon" type="image/png" href="/assets/images/logo.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/robot.css">
<link rel="stylesheet" href="/assets/js/admin/admin-style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme='light'], :root[data-theme='dark']{
    --color-primary:#00234A; --color-primary-variant:#0077CC; --color-accent:#0077CC; --color-accent-2:#4DA3FF;
    --color-background:#060B14; --color-surface:#0D1622; --color-surface-2:#121F30;
    --color-text:#F3F6FB; --color-text-secondary:#94A6C2; --color-text-3:#5A6A82; --color-muted:#101B2C;
    --color-success:#22C58B; --color-warning:#F5A623; --color-danger:#FF6B6B; --color-border:rgba(255,255,255,.09);
    --input-bg:#0F1A2A; --shadow-lg:0 25px 60px -20px rgba(0,8,25,.75); --shadow-sm:0 10px 24px -12px rgba(0,8,25,.6);
    --font-display:'Cairo', 'IBM Plex Sans Arabic', sans-serif;
    --font-body:'IBM Plex Sans Arabic', 'Cairo', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
body{
    font-family: var(--font-body);
    position: relative;
    font-size: 14px;
    line-height: 1.6;
}
body::before{
    content:""; position:fixed; inset:0; z-index:-2;
    background:
        radial-gradient(60rem 40rem at 90% -10%, rgba(0,119,204,.20), transparent 60%),
        radial-gradient(50rem 35rem at -10% 30%, rgba(77,163,255,.10), transparent 55%),
        var(--color-background);
}
body::after{
    content:""; position:fixed; inset:0; z-index:-1;
    background-image: radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(60rem 60rem at 70% 0%, black, transparent 70%);
    opacity:.6;
}
h1,h2,h3,h4 { font-family: var(--font-display); }
a { color: inherit; }
button, select, textarea, input { font-family: inherit; }
button { cursor: pointer; }
.ltr-data { direction: ltr; unicode-bidi: isolate; text-align: left; font-family: var(--font-mono); }

.gradient-text{
    background: linear-gradient(90deg,#8FC7FF,#4DA3FF,#B9DCFF);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.eyebrow{
    display:inline-flex; align-items:center; gap:.5rem; font-size:.75rem; font-weight:700;
    color:#8FC7FF; background:rgba(0,119,204,.14); border:1px solid rgba(77,163,255,.25);
    padding:.3rem .85rem; border-radius:99px; margin-bottom:.6rem;
}
.eyebrow .dot { width:6px; height:6px; border-radius:50%; background:var(--color-accent-2); box-shadow:0 0 8px var(--color-accent-2); }
.glass-card{
    background: rgba(255,255,255,.04); border:1px solid var(--color-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-radius:1.1rem;
}
.page-header{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:1rem; margin-bottom:1.75rem; }
.page-header h1{ font-size:clamp(1.4rem,3vw,1.9rem); margin:0; }
.page-header p{ color:var(--color-text-secondary); margin:.5rem 0 0; max-width:62ch; font-size:.9rem; line-height:1.7; }
.demo-flag{
    font-family: var(--font-mono); direction: ltr; font-size:10.5px; color:#8FC7FF;
    background: rgba(0,119,204,.14); border:1px solid rgba(77,163,255,.25); padding:4px 10px; border-radius:20px; white-space:nowrap;
}
.demo-flag.live{ color:#22C58B; background:rgba(34,197,139,.14); border-color:rgba(34,197,139,.3); }
.demo-flag.error{ color:#FF6B6B; background:rgba(255,107,107,.14); border-color:rgba(255,107,107,.3); }

.not-authorized{
    max-width:520px; margin:4rem auto; text-align:center; padding:2.5rem 2rem;
}

/* ---------- إحصائيات سريعة ---------- */
.stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:1rem; margin-bottom:1.75rem; }
.stat-card{ padding:1.15rem 1.25rem; display:flex; align-items:center; gap:1rem; }
.stat-icon{ width:44px; height:44px; min-width:44px; border-radius:.85rem; display:flex; align-items:center; justify-content:center; background:rgba(0,119,204,.15); color:#8FC7FF; }
.stat-icon.warn { background:rgba(245,166,35,.15); color:#F5A623; }
.stat-icon.danger { background:rgba(255,107,107,.15); color:#FF6B6B; }
.stat-icon.ok { background:rgba(34,197,139,.15); color:#22C58B; }
.stat-info .stat-label{ font-size:.78rem; color:var(--color-text-secondary); font-weight:600; }
.stat-info .stat-value{ font-size:1.5rem; font-weight:800; color:var(--color-text); font-family:'Space Grotesk', var(--font-display); }

/* ---------- جدول قائمة التعلّم ---------- */
.section-card{ padding:0; overflow:hidden; }
.table-wrap{ overflow-x:auto; }
.queue-table{ width:100%; border-collapse:collapse; min-width:760px; }
.queue-table th{
    text-align:right; font-size:.72rem; font-weight:700; color:var(--color-text-secondary);
    padding:.9rem 1.1rem; border-bottom:1px solid var(--color-border); white-space:nowrap; background:rgba(255,255,255,.02);
}
.queue-table td{ padding:.85rem 1.1rem; border-bottom:1px solid var(--color-border); font-size:.85rem; vertical-align:middle; }
.queue-table tbody tr{ cursor:pointer; transition:background .15s ease; }
.queue-table tbody tr:hover{ background:rgba(255,255,255,.035); }
.queue-table tbody tr.selected{ background:rgba(0,119,204,.12); }
.qid{ font-family:var(--font-mono); direction:ltr; text-align:left; color:var(--color-text-3); font-size:.78rem; }
.qmsg-sub{ display:block; color:var(--color-text-3); font-size:.74rem; margin-top:2px; }
.conf{ font-family:var(--font-mono); direction:ltr; text-align:left; font-size:.82rem; color:var(--color-text-secondary); }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; width:fit-content; }
.badge.fallback { background:rgba(245,166,35,.16); color:#F5A623; }
.badge.escalated_unknown { background:rgba(255,107,107,.16); color:#FF6B6B; }
.badge.low_confidence { background:rgba(0,119,204,.16); color:#4DA3FF; }

.status-badge{ display:inline-flex; padding:.25rem .75rem; border-radius:99px; font-size:.72rem; font-weight:700; width:fit-content; }
.status-open      { background:rgba(148,166,194,.16); color:#94A6C2; }
.status-in_review { background:rgba(245,166,35,.16);  color:#F5A623; }
.status-resolved  { background:rgba(34,197,139,.16);  color:#22C58B; }
.status-dismissed { background:rgba(255,107,107,.16); color:#FF6B6B; }

.empty-state{ padding:4rem 1rem; text-align:center; color:var(--color-text-secondary); font-size:.9rem; }

/* ---------- لوحة التفاصيل ---------- */
.detail{ margin-top:1.5rem; padding:1.75rem; display:none; }
.detail.open{ display:block; }
.detail-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:1.25rem; border-bottom:1px solid var(--color-border); padding-bottom:1.1rem; margin-bottom:1.5rem; }
.detail-title{ font-size:1.1rem; font-weight:700; margin:0; }
.detail-meta{ font-size:.78rem; color:var(--color-text-secondary); margin-top:.4rem; line-height:1.7; }
.close-btn{ background:var(--color-muted); border:1px solid var(--color-border); border-radius:.6rem; padding:.5rem 1rem; font-size:.78rem; color:var(--color-text); }
.close-btn:hover{ background:var(--color-border); }

.detail-grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:1.75rem; }
@media (max-width:900px){ .detail-grid{ grid-template-columns:1fr; } }

/* عمود التتبّع — الخطوات الفعلية المتاحة في trace jsonb */
.spine{ position:relative; padding-right:26px; }
.spine::before{ content:''; position:absolute; right:7px; top:6px; bottom:6px; width:2px; background:linear-gradient(180deg, var(--color-accent-2) 0%, rgba(255,255,255,.12) 100%); }
.spine-step{ position:relative; margin-bottom:4px; }
.spine-dot{ position:absolute; right:-26px; top:3px; width:14px; height:14px; border-radius:50%; background:var(--color-surface); border:2px solid var(--color-accent-2); }
.spine-step.inactive .spine-dot{ border-color:rgba(255,255,255,.2); }
.spine-toggle{ width:100%; text-align:right; background:none; border:none; padding:.5rem 0 .5rem .75rem; display:flex; justify-content:space-between; align-items:center; border-radius:.5rem; color:var(--color-text); }
.spine-toggle:hover{ background:rgba(255,255,255,.03); }
.spine-num{ font-family:var(--font-mono); direction:ltr; font-size:10.5px; color:var(--color-text-3); margin-left:8px; }
.spine-name{ font-weight:700; font-size:.88rem; }
.spine-summary{ font-size:.78rem; color:var(--color-text-3); font-family:var(--font-mono); direction:ltr; text-align:left; }
.spine-body{ display:none; background:#050912; color:#C7CBE0; border:1px solid var(--color-border); border-radius:.6rem; padding:.9rem 1rem; margin:6px 0 14px 0; font-family:var(--font-mono); direction:ltr; text-align:left; font-size:.76rem; line-height:1.65; white-space:pre-wrap; }
.spine-body.open{ display:block; }

.response-card{ background:var(--color-muted); border:1px solid var(--color-border); border-radius:.7rem; padding:.9rem 1rem; margin-top:1.1rem; font-size:.85rem; }
.response-card .label{ font-size:.72rem; color:var(--color-text-secondary); margin-bottom:.4rem; font-weight:700; }

/* العمود الأيسر: التصحيح والحالة */
.panel-block{ border:1px solid var(--color-border); background:var(--color-muted); border-radius:.8rem; padding:1.1rem 1.2rem; margin-bottom:1rem; }
.panel-block h4{ margin:0 0 .3rem; font-size:.9rem; }
.panel-block p.hint{ color:var(--color-text-secondary); font-size:.75rem; margin:0 0 .8rem; line-height:1.6; }
select, textarea, input[type=text]{
    width:100%; border:1px solid var(--color-border); border-radius:.6rem; padding:.6rem .7rem;
    font-family: var(--font-body); font-size:.85rem; background:var(--input-bg); color:var(--color-text);
}
textarea{ resize:vertical; min-height:64px; }
label.field-label{ font-size:.75rem; color:var(--color-text-secondary); font-weight:600; display:block; margin:.6rem 0 .3rem; }
.status-options{ display:flex; gap:6px; flex-wrap:wrap; margin-top:.5rem; }
.status-opt{ border:1px solid var(--color-border); background:var(--input-bg); border-radius:20px; padding:.4rem .8rem; font-size:.78rem; color:var(--color-text-secondary); }
.status-opt.active{ background:var(--color-accent); color:#fff; border-color:var(--color-accent); }
.btn{ border:none; border-radius:.6rem; padding:.6rem 1.1rem; font-size:.82rem; font-weight:700; font-family:inherit; }
.btn-primary{ background:linear-gradient(135deg,#4DA3FF,#0077CC); color:#fff; }
.btn-primary:hover{ box-shadow:0 0 20px -4px rgba(77,163,255,.5); }
.save-row{ display:flex; justify-content:flex-start; align-items:center; gap:.8rem; margin-top:.9rem; }
.saved-flag{ font-size:.78rem; color:#22C58B; display:none; }
.saved-flag.show{ display:inline; }

@media (max-width:768px){
    .admin-main{ padding:1.25rem; }
    .stats-grid{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>
<div id="sidebar-container"></div>

<main class="admin-main">
    <div id="app-root">
        <div style="text-align:center; padding:5rem 1rem; color:var(--color-text-secondary);">جارِ التحقق من الصلاحيات...</div>
    </div>
</main>

<template id="page-template">
    <div class="page-header">
        <div>
            <span class="eyebrow"><span class="dot"></span> محرك الدعم الذكي — Module 9</span>
            <h1 class="gradient-text">قائمة التعلّم</h1>
            <p>المحادثات اللي المحرك حطّها للمراجعة — ثقة منخفضة، رد احتياطي (Fallback)، أو تصعيد لم يُحل. الشاشة دي فلتر على سجل التتبع نفسه، مش تخزين منفصل.</p>
        </div>
        <span class="demo-flag" id="dataModeFlag">● جارِ الاتصال بقاعدة البيانات…</span>
    </div>

    <div class="stats-grid">
        <div class="glass-card stat-card">
            <div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
            <div class="stat-info"><div class="stat-label">إجمالي القائمة</div><div class="stat-value" id="stat-total">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon warn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
            <div class="stat-info"><div class="stat-label">رد احتياطي (Fallback)</div><div class="stat-value" id="stat-fallback">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon danger"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
            <div class="stat-info"><div class="stat-label">تصعيد غير معروف</div><div class="stat-value" id="stat-escalated">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon ok"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
            <div class="stat-info"><div class="stat-label">تم الحل</div><div class="stat-value" id="stat-resolved">—</div></div>
        </div>
    </div>

    <div class="glass-card section-card">
        <div class="table-wrap">
            <table class="queue-table">
                <thead>
                    <tr>
                        <th>الجلسة</th>
                        <th>الرسالة المُعلّمة</th>
                        <th>السبب</th>
                        <th>الثقة</th>
                        <th>الحالة</th>
                        <th>الدور</th>
                    </tr>
                </thead>
                <tbody id="queue-body"></tbody>
            </table>
        </div>
        <div id="empty" class="empty-state" style="display:none;">مفيش حاجة في قائمة التعلّم دلوقتي.</div>
    </div>

    <section id="detail" class="detail glass-card">
        <div class="detail-head">
            <div>
                <h3 class="detail-title" id="detail-title">—</h3>
                <div class="detail-meta" id="detail-meta">—</div>
            </div>
            <button class="close-btn" id="closeDetailBtn">إغلاق</button>
        </div>

        <div class="detail-grid">
            <div>
                <div class="spine" id="spine"></div>
                <div class="response-card">
                    <div class="label">الرد المُرسل في هذا الدور</div>
                    <div id="response-text">—</div>
                </div>
            </div>

            <div>
                <div class="panel-block">
                    <h4>تصحيح التشخيص</h4>
                    <p class="hint">لو المحرك اختار السيناريو الغلط، صححه هنا. ده هيتسجل كملاحظة على المراجعة — مش هيغيّر كتالوج السيناريوهات لوحده.</p>
                    <label class="field-label">السيناريو الصحيح</label>
                    <select id="correction-scenario"></select>
                    <label class="field-label">ملاحظة للفريق</label>
                    <textarea id="correction-note" placeholder="مثلاً: العميل كان بيسأل عن إلغاء الاشتراك، مش الفوترة…"></textarea>
                </div>

                <div class="panel-block">
                    <h4>حالة المراجعة</h4>
                    <p class="hint">متسجّلة في جدول chat_engine_conversation_reviews.</p>
                    <div class="status-options" id="status-options"></div>
                </div>

                <div class="save-row">
                    <button class="btn btn-primary" id="saveReviewBtn">حفظ المراجعة</button>
                    <span class="saved-flag" id="saved-flag">تم الحفظ (محليًا فقط — عرض تجريبي)</span>
                </div>
            </div>
        </div>
    </section>
</template>

<template id="not-authorized-template">
    <div class="glass-card not-authorized">
        <h2 style="margin:0 0 .6rem;">هذه الصفحة متاحة للأدمن فقط</h2>
        <p style="color:var(--color-text-secondary); font-size:.9rem; line-height:1.7; margin:0;">
            مركز مراجعة محرك الدعم الذكي (Learning Queue) يعرض محادثات حقيقية وتصحيحات على تشخيص المحرك، لذا الوصول مقصور على حسابات الأدمن.
        </p>
    </div>
</template>

<script type="module">
import { checkAdminAuth, updateAdminUI } from '/assets/js/admin/auth.js';
import { initSidebar } from '/assets/js/admin/sidebar.js';

initSidebar();

const appRoot = document.getElementById('app-root');
const user = await checkAdminAuth();

if (user) {
    updateAdminUI(user);

    if (user.profile?.role === 'admin') {
        appRoot.innerHTML = '';
        appRoot.appendChild(document.getElementById('page-template').content.cloneNode(true));
        initReviewCenter();
    } else {
        appRoot.innerHTML = '';
        appRoot.appendChild(document.getElementById('not-authorized-template').content.cloneNode(true));
    }
}

// ------------------------------------------------------------------
// هذه الجولة من التعديل تغطي التصميم فقط: نقل الصفحة لثيم لوحة
// الإدارة الحقيقي (Cairo/IBM Plex Sans Arabic، ألوان --color-*،
// الشريط الجانبي المشترك، وفحص صلاحية الأدمن) — مع إبقاء منطق
// وبيانات العرض التجريبي كما هي مؤقتًا. الربط الفعلي بـ
// chat_engine_learning_queue / chat_engine_conversation_reviews
// عبر Supabase هيتم في خطوة تالية منفصلة، بعد تشغيل الـ migration
// اللي بيصلّح is_chat_engine_staff().
// ------------------------------------------------------------------
function initReviewCenter() {
    const SCENARIO_OPTIONS = [
        'login_token_expired', 'api_integration_issue', 'webhook_delivery_failure',
        'subscription_payment_not_reflected', 'pricing_inquiry', 'platform_info_inquiry',
        'ticket_status_inquiry', 'subscription_status_inquiry', 'unknown'
    ];
    const STATUS_OPTIONS = [
        { value: 'open', label: 'مفتوحة' },
        { value: 'in_review', label: 'قيد المراجعة' },
        { value: 'resolved', label: 'تم الحل' },
        { value: 'dismissed', label: 'مرفوضة' }
    ];

    const QUEUE = [
        {
            sessionId: 'a1c9-4e21', turn: 2, reason: 'low_confidence', status: 'open', confidence: 0.14,
            rawText: 'مش عارف انا عندي مشكلة في حاجة غريبة شوية بس مش قادر اوصفها',
            trace: [
                { name: 'اللغة', summary: '11 tokens', body: 'normalizedTokenCanonicals: [مش, عارف, انا, عندي, مشكله, في, حاجه, غريبه, شويه, بس, مش]' },
                { name: 'التشخيص', summary: '2 active hypotheses, weak signal', body: 'hypotheses:\n  - scenarioId: unknown            confidence: 0.140  status: active\n  - scenarioId: subscription_payment_not_reflected  confidence: 0.090  status: active' },
                { name: 'الترتيب', summary: 'top: unknown (0.14) · ambiguous: false', body: 'topScenarioId: unknown\ntopConfidence: 0.140\nisAmbiguous: false' },
                { name: 'القرار', summary: 'FALLBACK · below activation threshold', body: 'action: FALLBACK\nscenarioId: null\nexplanation: "No hypothesis reached the activation threshold with usable specificity; offering the fallback menu."' },
                { name: 'الحوار', summary: 'FALLBACK template · 2 options', body: 'text: "مش متأكد إني فهمتك صح 🗒️ اختار من الاختيارات دي وهساعدك:"\noptions: [عندي استفسار, عندي مشكلة]' }
            ],
            responseText: 'مش متأكد إني فهمتك صح 🗒️ اختار من الاختيارات دي وهساعدك:'
        },
        {
            sessionId: 'f7b0-88d3', turn: 4, reason: 'escalated_unknown', status: 'in_review', confidence: null,
            rawText: 'كل اللي قلتهولك مش بيحل المشكلة، حد يرد عليا بجد',
            trace: [
                { name: 'اللغة', summary: '9 tokens', body: 'normalizedTokenCanonicals: [كل, اللي, قلتهولك, مش, بيحل, المشكله, حد, يرد, عليا]' },
                { name: 'التشخيص', summary: '0 active hypotheses after 4 turns', body: 'hypotheses: []\naccumulator.entries: 6 (none matched a current scenario token this turn)' },
                { name: 'الترتيب', summary: 'top: none · ambiguous: false', body: 'topScenarioId: null\ntopConfidence: null\nisAmbiguous: false' },
                { name: 'القرار', summary: 'ESCALATE_TO_HUMAN · no-progress cap reached', body: 'action: ESCALATE_TO_HUMAN\nscenarioId: null\nexplanation: "consecutiveNoNewEvidenceTurns=3 exceeded cap after FALLBACK; escalating to a human agent."' },
                { name: 'الحوار', summary: 'ESCALATE_TO_HUMAN template', body: 'text: "هوصلك بفريق الدعم البشري عشان يقدر يساعدك بشكل مباشر 🗒️"' }
            ],
            responseText: 'هوصلك بفريق الدعم البشري عشان يقدر يساعدك بشكل مباشر 🗒️'
        },
        {
            sessionId: '2d61-c40a', turn: 1, reason: 'low_confidence', status: 'resolved', confidence: 0.18,
            rawText: 'في مشكلة في الدفع بتاعي مش متأكد ايه بالظبط',
            trace: [
                { name: 'اللغة', summary: '8 tokens', body: 'normalizedTokenCanonicals: [في, مشكله, في, الدفع, بتاعي, مش, متأكد, ايه]' },
                { name: 'التشخيص', summary: '1 active hypothesis, low confidence', body: 'hypotheses:\n  - scenarioId: subscription_payment_not_reflected  confidence: 0.180  status: active' },
                { name: 'الترتيب', summary: 'top: subscription_payment_not_reflected (0.18)', body: 'topScenarioId: subscription_payment_not_reflected\ntopConfidence: 0.180\nisAmbiguous: false' },
                { name: 'القرار', summary: 'ASK_CLARIFYING_QUESTION', body: 'action: ASK_CLARIFYING_QUESTION\ntargetQuestion: { id: payment_confirmation_received }' },
                { name: 'الحوار', summary: 'targeted question', body: 'text: "تمام، تقدر تأكدلي الدفع اتخصم فعلاً من حسابك؟"' }
            ],
            responseText: 'تمام، تقدر تأكدلي الدفع اتخصم فعلاً من حسابك؟ (تم الحل لاحقًا بعد رد العميل)'
        }
    ];

    let selected = null;
    let pendingStatus = {};

    function reasonLabel(r) { return { fallback: 'رد احتياطي', escalated_unknown: 'تصعيد (غير معروف)', low_confidence: 'ثقة منخفضة' }[r] || r; }
    function statusLabel(s) { return (STATUS_OPTIONS.find(o => o.value === s) || {}).label || s; }

    function renderStats() {
        document.getElementById('stat-total').textContent = QUEUE.length;
        document.getElementById('stat-fallback').textContent = QUEUE.filter(q => q.reason === 'fallback').length;
        document.getElementById('stat-escalated').textContent = QUEUE.filter(q => q.reason === 'escalated_unknown').length;
        document.getElementById('stat-resolved').textContent = QUEUE.filter(q => q.status === 'resolved').length;
    }

    function renderQueue() {
        renderStats();
        const body = document.getElementById('queue-body');
        if (QUEUE.length === 0) {
            document.getElementById('empty').style.display = 'block';
            body.innerHTML = '';
            return;
        }
        document.getElementById('empty').style.display = 'none';
        body.innerHTML = QUEUE.map((item, i) => `
            <tr class="${selected === i ? 'selected' : ''}" data-index="${i}">
                <td class="qid">${item.sessionId}</td>
                <td>${item.rawText}<span class="qmsg-sub">الدور ${item.turn}</span></td>
                <td><span class="badge ${item.reason}">${reasonLabel(item.reason)}</span></td>
                <td class="conf">${item.confidence === null ? '—' : item.confidence.toFixed(2)}</td>
                <td><span class="status-badge status-${item.status}">${statusLabel(item.status)}</span></td>
                <td class="conf">#${item.turn}</td>
            </tr>
        `).join('');
        body.querySelectorAll('tr').forEach(row => {
            row.addEventListener('click', () => openDetail(Number(row.dataset.index)));
        });
    }

    function openDetail(i) {
        selected = i;
        renderQueue();
        const item = QUEUE[i];
        const detail = document.getElementById('detail');
        detail.classList.add('open');
        document.getElementById('detail-title').textContent = `الجلسة ${item.sessionId} — الدور ${item.turn}`;
        document.getElementById('detail-meta').textContent = `السبب: ${reasonLabel(item.reason)} · الثقة: ${item.confidence === null ? 'غير متاحة' : item.confidence.toFixed(3)} · "${item.rawText}"`;
        document.getElementById('response-text').textContent = item.responseText;

        document.getElementById('spine').innerHTML = item.trace.map((step, si) => `
            <div class="spine-step" id="spine-step-${si}">
                <div class="spine-dot"></div>
                <button class="spine-toggle" data-si="${si}">
                    <span class="spine-summary">${step.summary}</span>
                    <span><span class="spine-name">${step.name}</span><span class="spine-num">0${si + 1}</span></span>
                </button>
                <div class="spine-body" id="spine-body-${si}">${step.body.replace(/\n/g, '<br>')}</div>
            </div>
        `).join('');
        document.querySelectorAll('.spine-toggle').forEach(btn => {
            btn.addEventListener('click', () => toggleSpine(Number(btn.dataset.si)));
        });

        const scenarioSelect = document.getElementById('correction-scenario');
        scenarioSelect.innerHTML = SCENARIO_OPTIONS.map(s => `<option value="${s}">${s}</option>`).join('');
        document.getElementById('correction-note').value = '';

        pendingStatus[i] = pendingStatus[i] || item.status;
        renderStatusOptions(i);
        document.getElementById('saved-flag').classList.remove('show');

        detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function toggleSpine(si) {
        document.getElementById(`spine-body-${si}`).classList.toggle('open');
        document.getElementById(`spine-step-${si}`).classList.toggle('inactive');
    }

    function renderStatusOptions(i) {
        const wrap = document.getElementById('status-options');
        wrap.innerHTML = STATUS_OPTIONS.map(s => `
            <button class="status-opt ${pendingStatus[i] === s.value ? 'active' : ''}" data-value="${s.value}">${s.label}</button>
        `).join('');
        wrap.querySelectorAll('.status-opt').forEach(btn => {
            btn.addEventListener('click', () => setStatus(i, btn.dataset.value));
        });
    }

    function setStatus(i, s) {
        pendingStatus[i] = s;
        renderStatusOptions(i);
    }

    function saveReview() {
        if (selected === null) return;
        QUEUE[selected].status = pendingStatus[selected];
        renderQueue();
        const flag = document.getElementById('saved-flag');
        flag.classList.add('show');
        setTimeout(() => flag.classList.remove('show'), 2200);
    }

    document.getElementById('closeDetailBtn').addEventListener('click', () => {
        selected = null;
        document.getElementById('detail').classList.remove('open');
        renderQueue();
    });
    document.getElementById('saveReviewBtn').addEventListener('click', saveReview);

    renderQueue();
}
</script>
</body>
</html>
