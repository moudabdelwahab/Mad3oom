<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="/error-tracker.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز المراجعة — محرك الدعم الذكي | لوحة الإدارة</title>
<link rel="icon" type="image/png" href="/assets/images/logo.png">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/robot.css">
<link rel="stylesheet" href="/assets/js/admin/admin-style.css">
<script src="/theme-manager.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="review-center.css">
</head>
<body>
<div id="sidebar-container"></div>

<main class="admin-main">
    <div id="app-root">
        <div style="text-align:center; padding:5rem 1rem; color:var(--color-text-secondary);">جارِ التحقق من الصلاحيات...</div>
    </div>
</main>

<template id="page-template">
    <div class="page-header">
        <div>
            <span class="eyebrow"><span class="dot"></span> محرك الدعم الذكي — Module 9</span>
            <h1 class="gradient-text">مركز المراجعة</h1>
            <p>استعرض قائمة التعلّم — المحادثات اللي المحرك حطّها للمراجعة (ثقة منخفضة، رد احتياطي، أو تصعيد لم يُحل) — وشغّل معمل التحقق قبل نشر أي تعديل على السيناريوهات أو المعرفة.</p>
        </div>
    </div>

    <div class="tabs" id="sectionTabs" data-group="section">
        <button class="tab-btn active" data-target="panel-learning-queue">قائمة التعلّم</button>
        <button class="tab-btn" data-target="panel-validation-lab">معمل التحقق</button>
        <button class="tab-btn" data-target="panel-customers">العملاء</button>
        <button class="tab-btn" data-target="panel-ai-fallback">حالات المراجعة</button>
    </div>

    <section class="tab-panel active" id="panel-learning-queue" data-group="section">

    <div class="page-header" style="margin-bottom:1.25rem;">
        <div>
            <p class="tab-intro" style="margin:0;">المحادثات اللي المحرك حطّها للمراجعة — ثقة منخفضة، رد احتياطي (Fallback)، أو تصعيد لم يُحل. الشاشة دي فلتر على سجل التتبع نفسه، مش تخزين منفصل.</p>
        </div>
        <div class="header-actions">
            <span class="demo-flag" id="dataModeFlag" style="display:none;"></span>
            <span class="last-sync" id="lastSyncLabel"></span>
            <button class="btn btn-ghost btn-sm" id="refreshBtn" title="تحديث القائمة الآن">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                تحديث
            </button>
        </div>
    </div>

    <div class="glass-card pulse-card">
        <div class="pulse-title">نبض محرك SIE — حالة المحرك الفعلية، مش مجرد تأكيد اتصال</div>
        <div class="pulse-grid">
            <div class="pulse-item"><div class="pulse-value" id="pulse-total-traces">—</div><div class="pulse-label">تتبّعات مُسجَّلة (كل الوقت)</div></div>
            <div class="pulse-item"><div class="pulse-value" id="pulse-sessions">—</div><div class="pulse-label">جلسات SIE حقيقية مُسجَّلة</div></div>
            <div class="pulse-item"><div class="pulse-value" id="pulse-last-trace">—</div><div class="pulse-label">آخر تتبّع مسجَّل</div></div>
            <div class="pulse-item"><div class="pulse-value" id="pulse-sie-users">—</div><div class="pulse-label">عملاء مفعّل لهم SIE</div></div>
        </div>
        <div class="pulse-note" id="pulse-note"></div>
    </div>

    <div class="stats-grid">
        <div class="glass-card stat-card">
            <div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
            <div class="stat-info"><div class="stat-label">إجمالي القائمة</div><div class="stat-value" id="stat-total">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon warn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
            <div class="stat-info"><div class="stat-label">رد احتياطي (Fallback)</div><div class="stat-value" id="stat-fallback">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon danger"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
            <div class="stat-info"><div class="stat-label">تصعيد غير معروف</div><div class="stat-value" id="stat-escalated">—</div></div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-icon ok"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
            <div class="stat-info"><div class="stat-label">تم التصحيح</div><div class="stat-value" id="stat-corrected">—</div></div>
        </div>
    </div>

    <div class="glass-card filters-card">
        <div class="filters-row">
            <div class="filter-field">
                <label>السبب</label>
                <select id="filter-reason">
                    <option value="all">الكل</option>
                    <option value="fallback">رد احتياطي</option>
                    <option value="escalated_unknown">تصعيد (غير معروف)</option>
                    <option value="low_confidence">ثقة منخفضة</option>
                </select>
            </div>
            <div class="filter-field">
                <label>الحالة</label>
                <select id="filter-status">
                    <option value="all">الكل</option>
                    <option value="unresolved">غير محلولة</option>
                    <option value="reviewed">تمت المراجعة</option>
                    <option value="corrected">تم التصحيح</option>
                </select>
            </div>
            <div class="filter-field filter-search">
                <label>بحث بمعرّف الجلسة</label>
                <input type="text" id="filter-session" placeholder="مثلاً a1b2c3…" class="ltr-data" autocomplete="off">
            </div>
            <button class="btn btn-ghost btn-sm" id="clearFiltersBtn">مسح الفلاتر</button>
        </div>
    </div>

    <div class="glass-card section-card">
        <div class="table-wrap">
            <table class="queue-table">
                <thead>
                    <tr>
                        <th>الجلسة</th>
                        <th>تفسير القرار</th>
                        <th>السبب</th>
                        <th>الثقة</th>
                        <th>الحالة</th>
                        <th>الدور</th>
                    </tr>
                </thead>
                <tbody id="queue-body"></tbody>
            </table>
        </div>
        <div id="empty" class="empty-state" style="display:none;">مفيش حاجة في قائمة التعلّم دلوقتي.</div>
        <div class="load-more-row" id="loadMoreRow" style="display:none;">
            <button class="btn btn-ghost btn-sm" id="loadMoreBtn">تحميل 200 صف إضافي</button>
        </div>
    </div>

    <section id="detail" class="detail glass-card">
        <div class="detail-head">
            <div>
                <h3 class="detail-title" id="detail-title">—</h3>
                <div class="detail-meta" id="detail-meta">—</div>
            </div>
            <button class="close-btn" id="closeDetailBtn">إغلاق</button>
        </div>

        <div class="detail-grid">
            <div>
                <div class="spine" id="spine"></div>
                <div class="response-card">
                    <div class="label">الرد المُرسل في هذا الدور</div>
                    <div id="response-text">—</div>
                </div>
                <div class="panel-block" style="margin-top:1rem;">
                    <div style="display:flex; align-items:center; justify-content:space-between;">
                        <h4 style="margin:0;">المحادثة الكاملة</h4>
                        <button class="btn btn-ghost btn-sm" id="loadConversationBtn">عرض</button>
                    </div>
                    <p class="hint" style="margin-top:.5rem;">كل رسائل الجلسة دي بالترتيب — مش الدور المُبلَّغ عنه بس — عشان تفهم السياق كامل قبل التصحيح.</p>
                    <div id="conversation-transcript" class="transcript" style="display:none;"></div>
                </div>
            </div>

            <div>
                <div class="panel-block">
                    <h4>تصحيح التشخيص</h4>
                    <p class="hint">لو المحرك اختار السيناريو الغلط، صححه هنا. ده هيتسجل كملاحظة على المراجعة — مش هيغيّر كتالوج السيناريوهات لوحده.</p>
                    <label class="field-label">السيناريو الصحيح</label>
                    <select id="correction-scenario"></select>
                    <label class="field-label">ملاحظة للفريق</label>
                    <textarea id="correction-note" placeholder="مثلاً: العميل كان بيسأل عن إلغاء الاشتراك، مش الفوترة…"></textarea>
                </div>

                <div class="panel-block">
                    <h4>حالة المراجعة</h4>
                    <p class="hint">متسجّلة في جدول chat_engine_conversation_reviews.</p>
                    <div class="status-options" id="status-options"></div>
                </div>

                <div class="save-row">
                    <button class="btn btn-primary" id="saveReviewBtn">حفظ المراجعة</button>
                    <span class="saved-flag" id="saved-flag">تم الحفظ</span>
                </div>
            </div>
        </div>
    </section>

    </section><!-- /#panel-learning-queue -->

    <section class="tab-panel" id="panel-validation-lab" data-group="section">
        <div class="page-header" style="margin-bottom:1.25rem;">
            <div>
                <p class="tab-intro" style="margin:0;">اختبر أي تعديل مقترح على سيناريو أو معرفة على محادثات حقيقية، قبل ما يوصل لأي عميل.</p>
            </div>
            <div class="header-actions">
                <span class="last-sync" id="vl-last-sync"></span>
                <button class="btn btn-ghost btn-sm" id="vl-refresh-btn" title="تحديث القوائم الآن">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    تحديث
                </button>
            </div>
        </div>

        <div class="glass-card filters-card">
            <div class="filters-row">
                <div class="filter-field" style="min-width:280px;">
                    <label>التعديل المطلوب اختباره</label>
                    <select id="vl-target"><option value="">جارِ التحميل…</option></select>
                </div>
            </div>
        </div>
        <p class="hint" id="vl-empty-note" style="display:none; margin:-.6rem 0 1.5rem;">مفيش تعديلات قيد المراجعة دلوقتي — أي تعديل جديد على سيناريو أو معرفة هيظهر هنا تلقائيًا عشان تختبره.</p>

        <div class="tabs sub-tabs" id="vlTabs" data-group="vl">
            <button class="tab-btn active" data-target="vl-panel-sim">محاكاة على محادثة واحدة</button>
            <button class="tab-btn" data-target="vl-panel-shadow">اختبار شامل</button>
            <button class="tab-btn" data-target="vl-panel-gate">النشر</button>
        </div>

        <div class="tab-panel active" id="vl-panel-sim" data-group="vl">
            <p class="tab-intro">شوف هل الرد هيتغيّر أو لأ على محادثة حقيقية واحدة، قبل ما تروح لاختبار شامل.</p>
            <div class="glass-card filters-card">
                <div class="filters-row">
                    <div class="filter-field">
                        <label>محادثة حقيقية نجرّب عليها</label>
                        <select id="vl-sim-conversation"><option value="">جارِ التحميل…</option></select>
                    </div>
                    <button class="btn btn-primary btn-sm" id="vl-run-sim-btn" style="align-self:flex-end;">شغّل المحاكاة</button>
                </div>
            </div>
            <div id="vl-sim-results"></div>
        </div>

        <div class="tab-panel" id="vl-panel-shadow" data-group="vl">
            <p class="tab-intro">هيتم اختبار التعديل على آخر المحادثات الحقيقية من قائمة التعلّم دفعة واحدة، عشان نتأكد إنه مش هيبوّظ حاجة تانية.</p>
            <div class="glass-card filters-card">
                <div class="filters-row">
                    <button class="btn btn-primary btn-sm" id="vl-run-shadow-btn">شغّل الاختبار الشامل</button>
                </div>
            </div>

            <div class="stats-grid" id="vl-shadow-summary" style="display:none;">
                <div class="glass-card stat-card">
                    <div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
                    <div class="stat-info"><div class="stat-label">محادثات اتفحصت</div><div class="stat-value" id="vl-stat-total">—</div></div>
                </div>
                <div class="glass-card stat-card">
                    <div class="stat-icon ok"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                    <div class="stat-info"><div class="stat-label">تمام</div><div class="stat-value" id="vl-stat-pass">—</div></div>
                </div>
                <div class="glass-card stat-card">
                    <div class="stat-icon danger"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
                    <div class="stat-info"><div class="stat-label">فيها مشكلة</div><div class="stat-value" id="vl-stat-fail">—</div></div>
                </div>
                <div class="glass-card stat-card">
                    <div class="stat-icon" id="vl-stat-verdict-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
                    <div class="stat-info"><div class="stat-label">النتيجة العامة</div><div class="stat-value" id="vl-stat-verdict">—</div></div>
                </div>
            </div>

            <div class="glass-card section-card" id="vl-shadow-table" style="display:none;">
                <div class="table-wrap">
                    <table class="queue-table">
                        <thead>
                            <tr><th>المحادثة</th><th>النتيجة</th><th>السبب</th></tr>
                        </thead>
                        <tbody id="vl-shadow-rows"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-panel" id="vl-panel-gate" data-group="vl">
            <div class="panel-block" style="max-width:640px;">
                <div class="gate-status">
                    <span class="gate-dot" id="vl-gate-dot"></span>
                    <h4 style="margin:0;" id="vl-gate-title">اختار تعديل الأول من فوق</h4>
                </div>
                <p class="hint" id="vl-gate-reason" style="margin-bottom:1rem;"></p>

                <label class="field-label" for="vl-override-reason">سبب النشر رغم وجود مشكلة (لازم تكتبه لو عايز تنشر بتجاوز)</label>
                <textarea id="vl-override-reason" placeholder="مثلاً: راجعت المشكلة يدويًا مع فريق الدعم واتأكدت إنها مش مؤثرة."></textarea>

                <div class="save-row" style="margin-top:1.1rem;">
                    <button class="btn btn-primary" id="vl-publish-btn" disabled>نشر التعديل</button>
                    <button class="btn btn-danger" id="vl-override-btn">نشر بتجاوز</button>
                </div>
                <span class="saved-flag" id="vl-published-flag">تم النشر</span>
            </div>
        </div>
    </section>

    <section class="tab-panel" id="panel-customers" data-group="section">
        <div class="page-header" style="margin-bottom:1.25rem;">
            <div>
                <p class="tab-intro" style="margin:0;">تتبّع تفعيل محرك الدعم الذكي (SIE) لكل عميل — فعّل أو عطّل الوصول، وحدّد سقف استخدام (عدد رسائل) أو تاريخ انتهاء لو احتجت. البيانات والتحكم من جدول customer_sie_access عبر sie-entitlement.js — نفس المصدر المُستخدم في صفحة المستخدمين.</p>
            </div>
            <div class="header-actions">
                <span class="demo-flag" id="custDataModeFlag" style="display:none;"></span>
                <span class="last-sync" id="custLastSync"></span>
                <button class="btn btn-ghost btn-sm" id="custRefreshBtn" title="تحديث القائمة الآن">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    تحديث
                </button>
            </div>
        </div>

        <p class="hint" id="cust-not-sie-admin-note" style="display:none; margin:-.6rem 0 1.5rem; color:var(--color-warning);">
            حسابك أدمن، لكن التحكم في SIE لكل عميل مقصور على حساب is_sie_admin() المحدد فقط (نفس القيد الموجود في صفحة المستخدمين). لو القائمة تحت فاضية أو الحفظ بيفشل، الأرجح إن ده السبب — مش إن مفيش عملاء مفعّلين فعليًا.
        </p>

        <div class="stats-grid">
            <div class="glass-card stat-card">
                <div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
                <div class="stat-info"><div class="stat-label">إجمالي العملاء</div><div class="stat-value" id="cust-stat-total">—</div></div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon ok"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                <div class="stat-info"><div class="stat-label">مفعّل SIE</div><div class="stat-value" id="cust-stat-enabled">—</div></div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon danger"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"></line></svg></div>
                <div class="stat-info"><div class="stat-label">غير مفعّل</div><div class="stat-value" id="cust-stat-disabled">—</div></div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon warn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
                <div class="stat-info"><div class="stat-label">بحد استخدام أو تاريخ</div><div class="stat-value" id="cust-stat-limited">—</div></div>
            </div>
        </div>

        <div class="glass-card filters-card">
            <div class="filters-row">
                <div class="filter-field filter-search">
                    <label>بحث بالاسم أو الإيميل</label>
                    <input type="text" id="cust-filter-search" placeholder="مثلاً أحمد أو name@example.com" autocomplete="off">
                </div>
                <div class="filter-field">
                    <label>حالة SIE</label>
                    <select id="cust-filter-status">
                        <option value="all">الكل</option>
                        <option value="enabled">مفعّل</option>
                        <option value="disabled">غير مفعّل</option>
                    </select>
                </div>
                <button class="btn btn-ghost btn-sm" id="cust-clear-filters-btn">مسح الفلاتر</button>
            </div>
        </div>

        <div class="glass-card section-card">
            <div class="table-wrap">
                <table class="queue-table">
                    <thead>
                        <tr>
                            <th>العميل</th>
                            <th>حالة SIE</th>
                            <th>نوع الحد</th>
                            <th>الاستخدام</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="cust-body"></tbody>
                </table>
            </div>
            <div id="cust-empty" class="empty-state" style="display:none;">لا يوجد عملاء مطابقين.</div>
        </div>

        <section id="cust-detail" class="detail glass-card">
            <div class="detail-head">
                <div>
                    <h3 class="detail-title" id="cust-detail-title">—</h3>
                    <div class="detail-meta" id="cust-detail-meta">—</div>
                </div>
                <button class="close-btn" id="custCloseDetailBtn">إغلاق</button>
            </div>

            <div class="panel-block">
                <h4>تفعيل SIE لهذا العميل</h4>
                <p class="hint">متسجّل في جدول customer_sie_access عبر sie_admin_set_access() — نفس الدالة المُستخدمة في صفحة المستخدمين.</p>

                <label class="field-label" style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="cust-enabled-toggle" style="width:auto;">
                    <span>مفعّل لهذا العميل</span>
                </label>

                <label class="field-label">نوع الحد</label>
                <select id="cust-access-mode">
                    <option value="unlimited">بدون حد (طالما مفعّل)</option>
                    <option value="quota">حد رسائل</option>
                    <option value="expiration">تاريخ انتهاء</option>
                </select>

                <div id="cust-quota-row" style="display:none;">
                    <label class="field-label">حد الرسائل</label>
                    <input type="number" id="cust-message-quota" min="1" step="1" placeholder="مثلاً 200">
                </div>

                <div id="cust-expiry-row" style="display:none;">
                    <label class="field-label">تاريخ الانتهاء</label>
                    <input type="datetime-local" id="cust-expires-at">
                </div>

                <label class="field-label">ملاحظة (اختياري)</label>
                <input type="text" id="cust-notes" placeholder="سبب التفعيل مثلاً">

                <p class="hint" id="cust-usage-display" style="margin-top:.9rem;">—</p>

                <div class="save-row">
                    <button class="btn btn-primary" id="cust-save-btn">حفظ إعدادات SIE</button>
                    <button class="btn btn-ghost" id="cust-reset-usage-btn">تصفير الاستخدام</button>
                    <span class="saved-flag" id="cust-saved-flag">تم الحفظ</span>
                </div>
            </div>
        </section>
    </section>

    <!-- ============================================================
         حالات المراجعة — الحالات اللي محرك SIE مقدرش يحسمها بثقة
         كافية أو رجّعلها رد احتياطي من الذكاء الاصطناعي. القسم ده
         بالكامل Mock Data (اتعمل في review-center.js داخل
         initAiFallbackCenter()) — مفيش أي اتصال بـ Supabase أو أي
         Backend حقيقي هنا؛ أي حفظ أو تغيير حالة بيتم محليًا فقط.
         TODO: لما يتوفر جدول حقيقي (مثلاً chat_engine_ai_fallback_cases)
         استبدل المصفوفة المحلية باستدعاءات Supabase حقيقية زي باقي
         الأقسام فوق.
    ============================================================ -->
    <section class="tab-panel" id="panel-ai-fallback" data-group="section">

        <div class="page-header" style="margin-bottom:1.25rem;">
            <div>
                <p class="tab-intro" style="margin:0;">المحادثات اللي محرك SIE مقدرش يحسمها بثقة كافية أو رجّع فيها رد احتياطي (AI Fallback) — رسالة العميل كاملة، اقتراح الذكاء الاصطناعي لو موجود، رد المشرف، وسجل التعديلات والموافقات لكل حالة.</p>
            </div>
            <div class="header-actions">
                <span class="demo-flag" id="aifDataModeFlag">● بيانات تجريبية (Mock)</span>
                <span class="last-sync" id="aifLastSync"></span>
                <button class="btn btn-ghost btn-sm" id="aifRefreshBtn" title="تحديث القائمة">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    تحديث
                </button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="glass-card stat-card">
                <div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>
                <div class="stat-info"><div class="stat-label">إجمالي الحالات</div><div class="stat-value" id="aif-stat-total">—</div></div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon warn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
                <div class="stat-info"><div class="stat-label">قيد الانتظار</div><div class="stat-value" id="aif-stat-pending">—</div></div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
                <div class="stat-info"><div class="stat-label">قيد المراجعة</div><div class="stat-value" id="aif-stat-under-review">—</div></div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon ok"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                <div class="stat-info"><div class="stat-label">مُعتمدة</div><div class="stat-value" id="aif-stat-approved">—</div></div>
            </div>
            <div class="glass-card stat-card">
                <div class="stat-icon danger"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"></line></svg></div>
                <div class="stat-info"><div class="stat-label">مرفوضة</div><div class="stat-value" id="aif-stat-rejected">—</div></div>
            </div>
        </div>

        <div class="glass-card filters-card">
            <div class="filters-row">
                <div class="filter-field">
                    <label>الحالة</label>
                    <select id="aif-filter-status">
                        <option value="all">الكل</option>
                        <option value="pending">قيد الانتظار</option>
                        <option value="under_review">قيد المراجعة</option>
                        <option value="approved">مُعتمدة</option>
                        <option value="rejected">مرفوضة</option>
                        <option value="archived">مؤرشفة</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label>اللغة</label>
                    <select id="aif-filter-language"><option value="all">الكل</option></select>
                </div>
                <div class="filter-field">
                    <label>سبب الفشل</label>
                    <select id="aif-filter-reason">
                        <option value="all">الكل</option>
                        <option value="low_confidence">ثقة منخفضة</option>
                        <option value="no_matching_scenario">مفيش سيناريو مطابق</option>
                        <option value="ambiguous_intent">Intent غامض</option>
                        <option value="unsupported_language">لغة غير مدعومة</option>
                        <option value="timeout">مهلة/صمت</option>
                    </select>
                </div>
                <div class="filter-field filter-search">
                    <label>بحث برسالة العميل أو Keywords</label>
                    <input type="text" id="aif-filter-search" placeholder="مثلاً إلغاء، webhook…" autocomplete="off">
                </div>
                <button class="btn btn-ghost btn-sm" id="aifClearFiltersBtn">مسح الفلاتر</button>
            </div>
        </div>

        <div class="glass-card section-card">
            <div class="table-wrap">
                <table class="queue-table">
                    <thead>
                        <tr>
                            <th>رسالة العميل</th>
                            <th>اللغة</th>
                            <th>Intent المتوقع</th>
                            <th>الثقة</th>
                            <th>سبب الفشل</th>
                            <th>الحالة</th>
                            <th>تاريخ الإنشاء</th>
                        </tr>
                    </thead>
                    <tbody id="aif-body"></tbody>
                </table>
            </div>
            <div id="aif-empty" class="empty-state" style="display:none;"></div>
        </div>

        <section id="aif-detail" class="detail glass-card">
            <div class="detail-head">
                <div>
                    <h3 class="detail-title" id="aif-detail-title">—</h3>
                    <div class="detail-meta" id="aif-detail-meta">—</div>
                </div>
                <button class="close-btn" id="aifCloseDetailBtn">إغلاق</button>
            </div>

            <div class="detail-grid">
                <div>
                    <div class="response-card">
                        <div class="label">رسالة العميل</div>
                        <div id="aif-customer-message">—</div>
                    </div>

                    <div class="response-card" style="margin-top:1rem;">
                        <div class="label">اقتراح الذكاء الاصطناعي (إن وجد)</div>
                        <div id="aif-ai-suggestion">—</div>
                    </div>

                    <div class="panel-block" style="margin-top:1rem;">
                        <h4>رد المشرف</h4>
                        <p class="hint">الرد اللي اتبعت أو المفروض يتبعت للعميل بخصوص الحالة دي.</p>
                        <textarea id="aif-admin-reply" placeholder="اكتب رد المشرف هنا…" style="min-height:110px;"></textarea>
                    </div>

                    <div class="panel-block">
                        <h4>سجل التعديلات والموافقات</h4>
                        <p class="hint">كل تغيير في حالة القضية أو رد المشرف بيتسجل هنا (محليًا فقط في هذا العرض التجريبي).</p>
                        <div class="history-list" id="aif-history-list"></div>
                    </div>
                </div>

                <div>
                    <div class="panel-block">
                        <h4>بيانات الحالة</h4>
                        <div class="fact-row"><span class="k">اللغة</span><span class="v" id="aif-lang">—</span></div>
                        <div class="fact-row"><span class="k">Intent المتوقع</span><span class="v" id="aif-expected-intent">—</span></div>
                        <div class="fact-row"><span class="k">نسبة الثقة</span><span class="v" id="aif-confidence">—</span></div>
                        <div class="fact-row"><span class="k">سبب الفشل</span><span class="v" id="aif-failure-reason">—</span></div>
                        <div class="fact-row"><span class="k">Scenario / Intent</span><span class="v" id="aif-scenario">—</span></div>
                        <label class="field-label">Keywords</label>
                        <div class="keywords-wrap" id="aif-keywords">—</div>
                        <div class="fact-row" style="margin-top:.6rem;"><span class="k">تاريخ الإنشاء</span><span class="v" id="aif-created-at">—</span></div>
                        <div class="fact-row"><span class="k">آخر تعديل</span><span class="v" id="aif-updated-at">—</span></div>
                    </div>

                    <div class="panel-block">
                        <h4>حالة القضية</h4>
                        <p class="hint">تغيير الحالة بيتسجل في سجل التعديلات جنب رد المشرف.</p>
                        <div class="status-options" id="aif-status-options"></div>
                    </div>

                    <div class="save-row">
                        <button class="btn btn-primary" id="aifSaveBtn">حفظ (محليًا)</button>
                        <span class="saved-flag" id="aif-saved-flag">تم الحفظ</span>
                    </div>
                </div>
            </div>
        </section>
    </section><!-- /#panel-ai-fallback -->
</template>

<template id="not-authorized-template">
    <div class="glass-card not-authorized">
        <h2 style="margin:0 0 .6rem;">هذه الصفحة متاحة للأدمن فقط</h2>
        <p style="color:var(--color-text-secondary); font-size:.9rem; line-height:1.7; margin:0;">
            مركز مراجعة محرك الدعم الذكي (قائمة التعلّم ومعمل التحقق) يعرض محادثات حقيقية وتصحيحات على تشخيص المحرك، لذا الوصول مقصور على حسابات الأدمن.
        </p>
    </div>
</template>

<script type="module" src="review-center.js"></script>
</body>
</html>
