<!-- Customer Settings Modal -->
<div id="customerSettingsModal" class="modal">
    <div class="modal-content" style="max-width: 700px; max-height: 85vh; overflow-y: auto;">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1rem;">
            <h2 style="margin: 0; font-size: 1.5rem; font-weight: 700;">الإعدادات</h2>
            <button class="close-modal" id="closeSettingsModal" style="font-size: 2rem; cursor: pointer; background: none; border: none; color: var(--color-text); padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">&times;</button>
        </div>

        <!-- Settings Tabs Navigation -->
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--color-border); overflow-x: auto;">
            <button class="settings-tab-btn active" data-tab="general" style="padding: 0.75rem 1.5rem; border: none; background: none; cursor: pointer; font-weight: 600; color: var(--color-text); border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap;">عام</button>
            <button class="settings-tab-btn" data-tab="chatbot" style="padding: 0.75rem 1.5rem; border: none; background: none; cursor: pointer; font-weight: 600; color: var(--color-text); border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap;">الشات بوت</button>
            <button class="settings-tab-btn" data-tab="security" style="padding: 0.75rem 1.5rem; border: none; background: none; cursor: pointer; font-weight: 600; color: var(--color-text); border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap;">الأمان</button>
        </div>

        <!-- Alert Messages -->
        <div id="settingsAlert" style="display: none; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1.5rem; font-weight: 600;"></div>

        <!-- TAB 1: General Settings -->
        <div class="settings-tab-content active" data-tab="general">
            <!-- Language Setting -->
            <div style="margin-bottom: 2rem;">
                <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--color-text);">اللغة</label>
                <select id="languageSelect" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 0.5rem; background: var(--color-background); color: var(--color-text); font-size: 1rem; cursor: pointer;">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
            </div>

            <!-- Theme Setting -->
            <div style="margin-bottom: 2rem;">
                <label style="display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--color-text);">السمة</label>
                <div style="display: flex; gap: 1rem;">
                    <button class="theme-option-btn" data-theme="light" style="flex: 1; padding: 1rem; border: 2px solid var(--color-border); border-radius: 0.75rem; background: var(--color-background); cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                        <span style="font-size: 0.85rem; font-weight: 600;">فاتح</span>
                    </button>
                    <button class="theme-option-btn" data-theme="dark" style="flex: 1; padding: 1rem; border: 2px solid var(--color-border); border-radius: 0.75rem; background: var(--color-background); cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        <span style="font-size: 0.85rem; font-weight: 600;">داكن</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB 2: Account Settings -->
        <!-- ملاحظة: تبويب "الحساب" (الاسم/النبذة/كلمة المرور) اتشال من هنا عمدًا.
             نفس الحقول موجودة في قسم "الملف الشخصي" داخل لوحة العميل بمنطق
             تحقق واحد فقط. وجود محرِّرين لنفس البيانات كان تكرارًا للمنطق
             وارتباكًا للمستخدم عن مكان تعديل بياناته. -->

        <!-- TAB: Chatbot Mode Settings -->
        <div class="settings-tab-content" data-tab="chatbot" style="display: none;">
            <div style="margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--color-text);">وضع الشات بوت</h3>
                <p style="color: var(--color-text-secondary); margin: 0 0 1.5rem; font-size: 0.9rem;">اختر طريقة رد البوت على رسائلك في المحادثة.</p>
            </div>
            <div id="chatbotModeSettingsContainer">
                <div style="display:flex; align-items:center; justify-content:center; gap:0.6rem; padding: 2rem 1rem; color: var(--color-text-secondary); font-size: 0.9rem;">
                    <span>جاري تحميل الإعدادات...</span>
                </div>
            </div>
        </div>

        <!-- TAB 3: Security — كل إعدادات الأمان في قسم «الأمان» باللوحة (الوحدة الموحّدة) -->
        <div class="settings-tab-content" data-tab="security" style="display: none;">
            <p style="color: var(--color-text-secondary); line-height: 1.8; margin-bottom: 1rem;">كلمة المرور، والتحقق بخطوتين، والجلسات، والأجهزة الموثوقة تُدار من قسم «الأمان» في لوحتك.</p>
            <a href="/customer-dashboard.html#security" id="openSecuritySectionLink" class="btn btn-primary" style="display: inline-block; padding: 0.75rem 1.5rem; background: var(--color-accent); color: white; border-radius: 0.5rem; font-weight: 600; text-decoration: none;">فتح إعدادات الأمان</a>
        </div>

        <!-- Modal Footer -->
        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--color-border); display: flex; justify-content: flex-end; gap: 1rem;">
            <button id="closeSettingsBtn" style="padding: 0.75rem 1.5rem; background: var(--color-muted); color: var(--color-text); border: 1px solid var(--color-border); border-radius: 0.5rem; font-weight: 600; cursor: pointer;">إغلاق</button>
        </div>
    </div>
</div>

<style>
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--modal-overlay);
        backdrop-filter: blur(4px);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }

    .modal.active {
        display: flex;
    }

    .modal-content {
        background: var(--color-surface);
        padding: 2.5rem;
        border-radius: 1.25rem;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        box-shadow: var(--shadow);
        border: 1px solid var(--color-border);
        color: var(--color-text);
    }

    .settings-tab-btn.active {
        color: var(--color-accent);
        border-bottom-color: var(--color-accent);
    }

    .settings-tab-btn:hover {
        color: var(--color-accent);
    }

    .settings-tab-content.active {
        display: block;
        animation: fadeIn 0.3s ease-in-out;
    }

    .theme-option-btn.active {
        border-color: var(--color-accent);
        background: rgba(0, 119, 204, 0.05);
    }

    .alert-success {
        background: rgba(46, 138, 58, 0.1);
        color: var(--color-success);
        border: 1px solid var(--color-success);
    }

    .alert-error {
        background: rgba(217, 83, 79, 0.1);
        color: var(--color-danger);
        border: 1px solid var(--color-danger);
    }

    .recovery-code {
        background: var(--color-muted);
        padding: 0.75rem;
        border-radius: 0.5rem;
        text-align: center;
        font-family: monospace;
        font-weight: 600;
        border: 1px solid var(--color-border);
        word-break: break-all;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 768px) {
        .modal-content {
            padding: 1.5rem;
            max-width: 100%;
        }

        .settings-tab-btn {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }
    }
</style>
