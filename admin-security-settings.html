<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>أمان حسابك - لوحة الإدارة</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/robot.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link rel="stylesheet" href="/assets/css/account-settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .security-container { max-width: 1000px; margin: 0 auto; }
    </style>
  <!-- الأساس المتجاوب: يضمن عمل الصفحة على شاشات الجوال -->
  <link rel="stylesheet" href="/assets/responsive-global.css">
  <script src="/assets/responsive-global.js" defer></script>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <header class="page-header">
            <h1>أمان حسابك</h1>
            <p>كلمة المرور، والتحقق بخطوتين، والجلسات، والأجهزة الموثوقة — لحسابك الشخصي. سياسات أمان المنصة في «الإعدادات».</p>
        </header>

        <div class="security-container">
            <div id="adminAccountSecurity"></div>
        </div>
    </main>

    <!--
        كانت هذه الصفحة تستورد generateSecret / getQRCodeUrl من 2fa-service.js
        وهما غير موجودتين، فتفشل الوحدة كلها ولا يعمل أي زر (PS-15)، وكانت
        تفعّل 2FA دون التحقق من الرمز، وبلا حارس إدارة. الآن: حارس الإدارة
        نفسه في كل صفحات اللوحة، ثم الوحدة الموحّدة المستخدمة في لوحتي
        العميل والشركة.
    -->
    <script type="module">
        import { checkAdminAuth, updateAdminUI } from '/assets/js/admin/auth.js';
        import { initSidebar } from '/assets/js/admin/sidebar.js';
        import { mountAccountSettings } from '/assets/js/account/account-settings.js';

        initSidebar();
        const user = await checkAdminAuth();
        if (user) {
            updateAdminUI(user);
            await mountAccountSettings(document.getElementById('adminAccountSecurity'), {
                section: 'security',
                email: user.email,
                onAccountChanged: (account) => updateAdminUI({ ...user, profile: { ...(user.profile || {}), ...account } })
            });
        }
    </script>
</body>
</html>
