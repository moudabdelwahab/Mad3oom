<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التحقق من الفاتورة — منصة مدعوم</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --navy: #003366;
    --green: #25D366;
    --ink: #16202b;
    --muted: #667487;
    --line: #e3e8ef;
    --bg: #f4f6f9;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 48px;
    line-height: 1.7;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(16, 32, 56, .06);
  }
  .card__head {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 22px;
    border-bottom: 1px solid var(--line);
  }
  .card__head img { width: 44px; height: 44px; object-fit: contain; }
  .brand__name { font-weight: 700; font-size: 1.15rem; color: var(--navy); }
  .brand__sub { font-size: .82rem; color: var(--muted); }

  .verdict {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 22px; font-weight: 600;
  }
  .verdict--ok   { background: #eafaf0; color: #12683a; }
  .verdict--bad  { background: #fdeceb; color: #a3271f; }
  .verdict svg { flex-shrink: 0; }

  .body { padding: 22px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 0; }
  dt { color: var(--muted); font-size: .9rem; }
  dd { margin: 0; font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; text-align: right; unicode-bidi: plaintext; }

  .total {
    margin-top: 20px; padding-top: 16px; border-top: 2px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .total__label { color: var(--muted); }
  .total__value { font-size: 1.5rem; font-weight: 700; color: var(--navy); }

  .foot {
    margin-top: 18px; font-size: .82rem; color: var(--muted);
    text-align: center; line-height: 1.9;
  }
  .foot a { color: var(--navy); }

  .state { padding: 40px 22px; text-align: center; color: var(--muted); }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 12px;
    border: 3px solid var(--line); border-top-color: var(--navy);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
  <!-- الأساس المتجاوب: يضمن عمل الصفحة على شاشات الجوال -->
  <link rel="stylesheet" href="/assets/responsive-global.css">
  <script src="/assets/responsive-global.js" defer></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="card__head">
        <img src="/logo.png" alt="شعار منصة مدعوم">
        <div>
          <div class="brand__name">منصة مدعوم</div>
          <div class="brand__sub">التحقق من صحة الفاتورة</div>
        </div>
      </div>
      <div id="content">
        <div class="state"><div class="spinner"></div>جاري التحقق من الفاتورة...</div>
      </div>
    </div>
    <p class="foot">
      هذه الصفحة تعرض بيانات الفاتورة كما هي مسجّلة لدى منصة مدعوم.<br>
      <a href="https://mad3oom.com">mad3oom.com</a>
    </p>
  </div>

<script type="module">
import { SUPABASE_CONFIG } from './supabase-config.js';

const PLAN_LABELS = {
  support: 'الدعم الفني',
  whatsapp: 'واتساب بيزنس',
  bundle: 'الباقة الشاملة',
  free: 'الخطة المجانية'
};
const CYCLE_LABELS = { monthly: 'شهري', yearly: 'سنوي', none: '—' };
const STATUS_LABELS = {
  draft: 'مسودة', sent: 'صادرة', paid: 'مدفوعة',
  overdue: 'متأخرة', cancelled: 'ملغاة'
};

const content = document.getElementById('content');

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function money(value, currency) {
  const n = Number(value);
  if (!isFinite(n)) return '—';
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    + ' ' + esc(currency || 'USD');
}

function row(label, value) {
  if (value === null || value === undefined || value === '') return '';
  return `<dt>${esc(label)}</dt><dd class="num">${value}</dd>`;
}

function renderInvalid(message) {
  content.innerHTML = `
    <div class="verdict verdict--bad">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle><path d="M15 9l-6 6M9 9l6 6"></path>
      </svg>
      تعذّر التحقق من هذه الفاتورة
    </div>
    <div class="state">${esc(message)}</div>`;
}

function renderInvoice(inv) {
  const plan = PLAN_LABELS[inv.plan] || inv.plan;
  const cycle = CYCLE_LABELS[inv.billing_cycle] || inv.billing_cycle;
  const planLine = plan ? plan + (cycle && cycle !== '—' ? ` — ${cycle}` : '') : null;

  content.innerHTML = `
    <div class="verdict verdict--ok">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9.5"></path>
      </svg>
      فاتورة موثّقة وصادرة عن منصة مدعوم
    </div>
    <div class="body">
      <dl>
        ${row('رقم الفاتورة', esc(inv.invoice_number))}
        ${row('التذكرة', inv.ticket_number ? '#' + esc(inv.ticket_number) : '')}
        ${row('العميل', esc(inv.customer_name))}
        ${row('الباقة', planLine ? esc(planLine) : '')}
        ${row('تاريخ الإصدار', esc(inv.issue_date))}
        ${row('تاريخ الاستحقاق', esc(inv.due_date))}
        ${row('الحالة', esc(STATUS_LABELS[inv.status] || inv.status))}
        ${row('المبلغ قبل الضريبة', money(inv.subtotal, inv.currency))}
        ${Number(inv.tax_amount) ? row('الضريبة', money(inv.tax_amount, inv.currency)) : ''}
      </dl>
      <div class="total">
        <span class="total__label">الإجمالي</span>
        <span class="total__value num">${money(inv.total, inv.currency)}</span>
      </div>
    </div>`;
}

async function verify() {
  const token = new URLSearchParams(location.search).get('t');
  if (!token) {
    renderInvalid('الرابط غير مكتمل. امسح رمز QR الموجود على الفاتورة مرة أخرى.');
    return;
  }

  try {
    const res = await fetch(`${SUPABASE_CONFIG.url}/rest/v1/rpc/get_public_invoice`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_CONFIG.anonKey,
        'Authorization': `Bearer ${SUPABASE_CONFIG.anonKey}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ p_token: token })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data || data.verified !== true) {
      renderInvalid('لا توجد فاتورة بهذا الرمز. تأكد من أن الرابط كامل ولم يُعدَّل.');
      return;
    }
    renderInvoice(data);
  } catch {
    renderInvalid('تعذّر الاتصال بالخادم. حاول مرة أخرى بعد قليل.');
  }
}

verify();
</script>
</body>
</html>
