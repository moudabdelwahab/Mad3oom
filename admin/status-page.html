<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حالة الخدمات - مدعوم</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Fix for the layout based on the screenshot */
        body {
            display: block; /* Override flex if needed */
            background-color: var(--color-background);
        }

        .admin-main {
            padding: 2.5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            min-height: calc(100vh - 70px);
        }

        /* Status Page Specific UI */
        .status-header-section {
            margin-bottom: 2.5rem;
        }

        .global-status-banner {
            background: var(--color-surface);
            border-radius: 1.25rem;
            padding: 2rem;
            border: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 2.5rem;
        }

        .status-icon-wrapper {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .status-icon-wrapper svg {
            width: 35px;
            height: 35px;
        }

        .bg-success-light { background: rgba(46, 138, 58, 0.1); color: var(--color-success); }
        .bg-warning-light { background: rgba(224, 168, 0, 0.1); color: var(--color-warning); }
        .bg-danger-light { background: rgba(217, 83, 79, 0.1); color: var(--color-danger); }

        .services-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .service-status-card {
            background: var(--color-surface);
            border-radius: 1.25rem;
            border: 1px solid var(--color-border);
            padding: 1.75rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .service-status-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .service-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
        }

        .service-title {
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--color-primary);
        }

        .uptime-visual {
            display: flex;
            gap: 3px;
            height: 35px;
            margin: 1.5rem 0;
        }

        .uptime-segment {
            flex: 1;
            background: var(--color-success);
            border-radius: 3px;
            opacity: 0.75;
            transition: opacity 0.2s;
        }

        .uptime-segment:hover { opacity: 1; }
        .uptime-segment.degraded { background: var(--color-warning); }
        .uptime-segment.down { background: var(--color-danger); }

        .service-card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            border-top: 1px solid var(--color-border);
            padding-top: 1rem;
            margin-top: 1rem;
            font-weight: 600;
        }

        .incident-log {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .incident-entry {
            background: var(--color-surface);
            border-radius: 1.25rem;
            padding: 1.75rem;
            border: 1px solid var(--color-border);
            border-right: 6px solid var(--color-accent);
        }

        .incident-entry.resolved { border-right-color: var(--color-success); }
        .incident-entry.active { border-right-color: var(--color-danger); }

        .incident-entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .btn-filter.active {
            background: var(--color-accent) !important;
            color: white !important;
            border-color: var(--color-accent) !important;
        }

        @media (max-width: 768px) {
            .global-status-banner { flex-direction: column; text-align: center; }
            .services-container { grid-template-columns: 1fr; }
            .admin-main { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div class="status-header-section">
            <div class="page-header">
                <h1>حالة الخدمات</h1>
                <p>متابعة فورية لأداء منصة مدعوم</p>
            </div>
        </div>

        <div class="global-status-banner" id="globalBanner">
            <div class="status-icon-wrapper bg-success-light" id="globalIcon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <div>
                <h2 id="globalTitle" style="font-weight: 800; font-size: 1.5rem; margin-bottom: 0.4rem;">جميع الأنظمة تعمل بشكل مثالي</h2>
                <p id="globalDesc" style="color: var(--color-text-secondary); font-weight: 600; font-size: 1.05rem;">نراقب الخدمات باستمرار لضمان أفضل تجربة مستخدم.</p>
            </div>
        </div>

        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <h2 class="section-title">الخدمات الأساسية</h2>
            <div class="filter-group" style="display: flex; gap: 0.5rem; background: var(--color-surface); padding: 0.4rem; border-radius: 0.75rem; border: 1px solid var(--color-border);">
                <button class="btn btn-sm btn-filter active" data-filter="all" style="font-weight: 700; padding: 0.4rem 1rem;">الكل</button>
                <button class="btn btn-sm btn-filter" data-filter="operational" style="font-weight: 700; padding: 0.4rem 1rem;">مستقر</button>
                <button class="btn btn-sm btn-filter" data-filter="issue" style="font-weight: 700; padding: 0.4rem 1rem;">مشاكل</button>
            </div>
        </div>

        <div class="services-container" id="servicesList">
            <!-- Loading state -->
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem;">
                <div class="stat-value" style="font-size: 1.2rem; color: var(--color-text-secondary);">جاري مزامنة البيانات...</div>
            </div>
        </div>

        <div class="section-header">
            <h2 class="section-title">سجل الحوادث والصيانة</h2>
        </div>

        <div class="incident-log" id="incidentsContainer">
            <div class="section-card" style="text-align: center; padding: 4rem;">
                <p style="color: var(--color-text-secondary); font-weight: 600;">لا توجد حوادث مسجلة حالياً</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initSidebar } from '/assets/js/admin/sidebar.js';
        import { serviceStatusManager } from '/service-status.js';

        // Initialize Admin Sidebar
        initSidebar();

        let currentFilter = 'all';

        async function refreshStatus() {
            try {
                const services = await serviceStatusManager.fetchServices();
                const incidents = await serviceStatusManager.fetchIncidents();
                
                renderServices(services);
                renderIncidents(incidents);
                updateGlobalUI(services);
            } catch (err) {
                console.error('Error refreshing status:', err);
            }
        }

        function renderServices(services) {
            const container = document.getElementById('servicesList');
            
            const filtered = services.filter(s => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'operational') return s.status === 'operational';
                if (currentFilter === 'issue') return s.status !== 'operational';
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="section-card" style="grid-column: 1/-1; text-align: center; padding: 3rem;">لا توجد خدمات تطابق الفلتر المختار</div>';
                return;
            }

            container.innerHTML = filtered.map(s => `
                <div class="service-status-card">
                    <div class="service-card-header">
                        <span class="service-title">${s.name}</span>
                        <span class="status-badge status-${s.status === 'operational' ? 'resolved' : s.status === 'degraded' ? 'pending' : 'danger'}">
                            ${getStatusLabel(s.status)}
                        </span>
                    </div>
                    <p style="font-size: 0.95rem; color: var(--color-text-secondary); line-height: 1.5; height: 3rem; overflow: hidden;">${s.description || 'لا يوجد وصف متاح'}</p>
                    <div class="uptime-visual">
                        ${Array(30).fill(0).map(() => `<div class="uptime-segment"></div>`).join('')}
                    </div>
                    <div class="service-card-footer">
                        <span>⏱️ ${s.response_time || '--'}ms</span>
                        <span style="color: var(--color-success);">99.9% متوفر</span>
                    </div>
                </div>
            `).join('');
        }

        function renderIncidents(incidents) {
            const container = document.getElementById('incidentsContainer');
            if (!incidents || incidents.length === 0) return;

            container.innerHTML = incidents.map(inc => `
                <div class="incident-entry ${inc.status === 'resolved' ? 'resolved' : 'active'}">
                    <div class="incident-entry-header">
                        <span style="font-weight: 800; font-size: 1.1rem; color: var(--color-primary);">${inc.title}</span>
                        <span class="status-badge status-${inc.status === 'resolved' ? 'resolved' : 'danger'}">
                            ${inc.status === 'resolved' ? 'تم الحل' : 'نشط'}
                        </span>
                    </div>
                    <p style="font-size: 1rem; color: var(--color-text-secondary); margin-bottom: 1rem; line-height: 1.6;">${inc.description}</p>
                    <div style="font-size: 0.85rem; color: #999; font-weight: 600;">
                        🗓️ ${new Date(inc.created_at).toLocaleString('ar-EG')}
                    </div>
                </div>
            `).join('');
        }

        function updateGlobalUI(services) {
            const summary = serviceStatusManager.getSummary(services);
            const icon = document.getElementById('globalIcon');
            const title = document.getElementById('globalTitle');
            const desc = document.getElementById('globalDesc');

            if (summary.down > 0) {
                icon.className = 'status-icon-wrapper bg-danger-light';
                icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
                title.textContent = 'انقطاع في بعض الخدمات';
                desc.textContent = 'نعمل حالياً على إصلاح المشاكل التقنية واستعادة استقرار النظام.';
            } else if (summary.degraded > 0) {
                icon.className = 'status-icon-wrapper bg-warning-light';
                icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>';
                title.textContent = 'أداء بعض الأنظمة متأثر';
                desc.textContent = 'قد تواجه بعض الخدمات بطئاً في الاستجابة، جاري التحسين.';
            } else {
                icon.className = 'status-icon-wrapper bg-success-light';
                icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
                title.textContent = 'جميع الأنظمة تعمل بشكل مثالي';
                desc.textContent = 'نراقب الخدمات باستمرار لضمان أفضل تجربة مستخدم.';
            }
        }

        function getStatusLabel(status) {
            const labels = { operational: 'مستقر', degraded: 'أداء منخفض', down: 'متوقف' };
            return labels[status] || status;
        }

        // Filter Logic
        document.querySelectorAll('.btn-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.btn-filter').forEach(b => {
                    b.classList.remove('active');
                    b.classList.remove('btn-primary');
                });
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                refreshStatus();
            });
        });

        // Initial fetch
        refreshStatus();

        // Listen for real-time changes
        serviceStatusManager.subscribeToServiceUpdates(() => refreshStatus());
    </script>
</body>
</html>
