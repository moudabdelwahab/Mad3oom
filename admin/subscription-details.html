<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الاشتراك — إدارة</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/assets/js/admin/admin-style.css">
<link rel="stylesheet" href="/admin/styles.css">
<link rel="stylesheet" href="/assets/css/admin-subscription-details.css">
<script>
    (function () {
        try {
            var theme = localStorage.getItem('theme-preference')
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    /* ملاحظة: تجنّب اسم الصنف page لغلاف الصفحة هنا. admin/styles.css
       يعرّفه كأداة تبديل تبويبات (display:none إلا مع active)، فأي غلاف
       بهذا الاسم يختفي تمامًا بلا أي خطأ في الكونسول.

       باقي التنسيق يأتي من assets/css/admin-subscription-details.css، وهو
       نفسه تنسيق النافذة المنبثقة في صفحة الاشتراكات. الصفحة هنا مجرد إطار
       حول نفس المحتوى، فلا يمكن أن تختلف الشاشتان في الشكل ولا في السلوك. */
    .sub-details-page { max-width: 900px; margin: 0 auto; padding: 1.5rem; width: 100%; }
    .page-head { display: flex; align-items: center; justify-content: space-between;
                 gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .page-title { margin: 0; font-size: 1.4rem; font-weight: 800; }
</style>
</head>
<body>
<div class="sub-details-page">
    <div class="page-head">
        <h1 class="page-title">تفاصيل الاشتراك</h1>
        <a class="subd-btn subd-btn--ghost" href="/admin/subscriptions.html">رجوع للاشتراكات</a>
    </div>

    <div class="subd-standalone" id="shell">
        <div class="subd-body" id="root"></div>
        <div class="subd-foot" data-subd-footer></div>
    </div>
</div>

<script type="module">
/**
 * صفحة إدارة اشتراك واحد — الرابط المباشر القابل للمشاركة.
 *
 * المسار المعتاد صار نافذة منبثقة داخل صفحة الاشتراكات، لكن الرابط المباشر
 * لازم يبقى شغّالًا (يُرسَل في التذاكر وفي المتابعات الداخلية).
 *
 * كل منطق العرض والإجراءات في assets/js/admin/subscription-details-view.js،
 * وهذه الصفحة لا تكرّر منه شيئًا. النسخة السابقة كانت تكرّره كاملًا، فأي
 * تحسين في إحدى الشاشتين كان يترك الأخرى خلفه بصمت.
 */
import { supabase } from '/api-config.js';
import { requireAuth } from '/auth-client.js';
import { mountSubscriptionDetails } from '/assets/js/admin/subscription-details-view.js';

const subscriptionId = new URLSearchParams(window.location.search).get('id');
const body = document.getElementById('root');

(async function start() {
    // الصلاحية الحقيقية تُفرض في القاعدة داخل كل دالة RPC؛ هذا فقط يمنع
    // عرض شاشة فاضية لزائر غير مسجّل.
    const user = await requireAuth();
    if (!user) return;

    if (!subscriptionId) {
        body.innerHTML = '<div class="subd-notice subd-notice--error">لا يوجد معرّف اشتراك في الرابط.</div>';
        return;
    }

    mountSubscriptionDetails({
        client: supabase,
        subscriptionId,
        body,
        footer: document.querySelector('[data-subd-footer]'),
        root: document.getElementById('shell'),
        closeLabel: 'رجوع للاشتراكات',
        onClose: () => { window.location.href = '/admin/subscriptions.html'; }
    });
})();
</script>
</body>
</html>
