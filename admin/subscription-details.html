<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الاشتراك</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f7fb;padding:20px}
.header{background:#0d47a1;color:#fff;padding:20px;border-radius:16px;margin-bottom:20px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.label{color:#777;font-size:14px;margin-bottom:5px}
.value{font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>تفاصيل اشتراك واتساب</h1>
<p>عرض تفاصيل العميل والتذكرة والاشتراك</p>
</div>
<div id="details"></div>
<script>
const supabaseUrl='https://srnelrdpqkcntbgudyto.supabase.co';
const supabaseKey='sb_publishable_0pvB8_xD0txjdJBkYqXMyg__jKMw71W';
const client=supabase.createClient(supabaseUrl,supabaseKey);
const params=new URLSearchParams(window.location.search);
const id=params.get('id');
async function load(){
const container=document.getElementById('details');
container.innerHTML='<div class="card">جاري التحميل...</div>';
const {data,error}=await client.from('whatsapp_subscriptions').select(`*,tickets(ticket_number,title,description,status),profiles(full_name,username,phone,email)`).eq('id',id).single();
if(error){container.innerHTML=`<div class="card">${error.message}</div>`;return;}
container.innerHTML=`
<div class="grid">
<div class="card"><div class="label">اسم العميل</div><div class="value">${data.profiles?.full_name||'-'}</div></div>
<div class="card"><div class="label">اسم المستخدم</div><div class="value">${data.profiles?.username||'-'}</div></div>
<div class="card"><div class="label">رقم الهاتف</div><div class="value">${data.profiles?.phone||'-'}</div></div>
<div class="card"><div class="label">البريد الإلكتروني</div><div class="value">${data.profiles?.email||'-'}</div></div>
<div class="card"><div class="label">رقم التذكرة</div><div class="value">#${data.tickets?.ticket_number||'-'}</div></div>
<div class="card"><div class="label">حالة الاشتراك</div><div class="value">${data.status}</div></div>
<div class="card"><div class="label">نوع الباقة</div><div class="value">${data.plan_type||'-'}</div></div>
<div class="card"><div class="label">تاريخ البداية</div><div class="value">${data.start_date||'-'}</div></div>
<div class="card"><div class="label">تاريخ الانتهاء</div><div class="value">${data.end_date||'-'}</div></div>
</div>`;
}
load();
</script>
</body>
</html>
