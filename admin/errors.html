<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة أخطاء الموقع - مدعوم</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/robot.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .errors-container { max-width: 1400px; margin: 0 auto; padding: 0.5rem 0 2rem; }

        /* ---------- Header ---------- */
        .errors-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;
        }
        .errors-header h1 { display: flex; align-items: center; gap: 0.65rem; }
        .errors-header h1 svg { width: 1.6rem; height: 1.6rem; color: var(--color-accent); flex-shrink: 0; }

        .realtime-badge {
            background: var(--color-success);
            color: white;
            padding: 0.45rem 1.1rem;
            border-radius: 2rem;
            font-size: 0.82rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.3s ease;
            box-shadow: var(--shadow-sm);
        }
        .realtime-badge svg { width: 16px; height: 16px; }
        .pulse-dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: pulse 1.5s infinite; flex-shrink: 0; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

        /* ---------- Stats ---------- */
        .error-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.1rem;
            margin-bottom: 1.75rem;
        }
        @media (max-width: 900px) { .error-stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .estat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 1rem;
            padding: 1.1rem 1.25rem;
            display: flex; align-items: center; gap: 0.9rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .estat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
        .estat-icon {
            width: 46px; height: 46px; min-width: 46px; border-radius: 0.8rem;
            display: flex; align-items: center; justify-content: center;
        }
        .estat-icon svg { width: 22px; height: 22px; }
        .estat-info .estat-label { font-size: 0.8rem; color: var(--color-text-secondary); font-weight: 600; margin: 0; }
        .estat-info .estat-value { font-size: 1.55rem; font-weight: 800; margin: 0.15rem 0 0; color: var(--color-text); line-height: 1; }

        /* ---------- Filters ---------- */
        .filters-bar {
            background: var(--color-surface);
            padding: 1.25rem 1.5rem;
            border-radius: 1rem;
            margin-bottom: 1.75rem;
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            align-items: flex-end;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
        }
        .filter-group { display: flex; flex-direction: column; gap: 0.45rem; }
        .filter-group label { font-size: 0.8rem; font-weight: 700; color: var(--color-text-secondary); }
        .filter-group select {
            padding: 0.6rem 1rem;
            border-radius: 0.6rem;
            border: 1px solid var(--color-border);
            background: var(--input-bg, var(--color-bg));
            color: var(--color-text);
            min-width: 160px;
            font-family: inherit;
            font-weight: 600;
        }
        .search-wrap { position: relative; flex-grow: 1; min-width: 220px; }
        .search-wrap svg {
            position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%);
            width: 17px; height: 17px; color: var(--color-text-secondary); pointer-events: none;
        }
        .search-wrap input {
            width: 100%; box-sizing: border-box;
            padding: 0.65rem 2.5rem 0.65rem 1rem;
            border-radius: 0.6rem;
            border: 1px solid var(--color-border);
            background: var(--input-bg, var(--color-bg));
            color: var(--color-text);
            font-family: inherit;
        }

        /* status segmented tabs */
        .status-tabs {
            display: flex; background: var(--color-muted); border-radius: 0.7rem; padding: 0.3rem; gap: 0.2rem;
        }
        .status-tab {
            border: none; background: transparent; cursor: pointer;
            padding: 0.55rem 0.95rem; border-radius: 0.5rem;
            font-family: inherit; font-weight: 700; font-size: 0.84rem;
            color: var(--color-text-secondary);
            display: flex; align-items: center; gap: 0.4rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .status-tab svg { width: 15px; height: 15px; }
        .status-tab:hover { color: var(--color-text); }
        .status-tab.active { background: var(--color-surface); color: var(--color-accent); box-shadow: var(--shadow-sm); }

        .filter-actions { display: flex; gap: 0.5rem; margin-right: auto; }
        .icon-btn {
            display: inline-flex; align-items: center; gap: 0.45rem;
            padding: 0.6rem 1rem; font-size: 0.85rem; border-radius: 0.6rem;
            cursor: pointer; border: 1px solid var(--color-border); font-weight: 700;
            background: var(--color-muted); color: var(--color-text);
            transition: all 0.2s; font-family: inherit; height: 42px; box-sizing: border-box;
        }
        .icon-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
        .icon-btn:hover { background: var(--color-border); }
        .icon-btn.primary { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
        .icon-btn.primary:hover { background: var(--color-accent-hover); }

        .group-toggle {
            display: flex; align-items: center; gap: 0.6rem; cursor: pointer;
            font-size: 0.85rem; font-weight: 700; color: var(--color-text-secondary);
            user-select: none;
        }
        .group-toggle svg { width: 16px; height: 16px; }
        .switch { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch-track {
            position: absolute; inset: 0; background: var(--color-border); border-radius: 2rem; transition: 0.2s;
        }
        .switch-track::before {
            content: ""; position: absolute; height: 15px; width: 15px; right: 3px; top: 3px;
            background: white; border-radius: 50%; transition: 0.2s;
        }
        .switch input:checked + .switch-track { background: var(--color-accent); }
        .switch input:checked + .switch-track::before { transform: translateX(-17px); }

        /* ---------- Error Card ---------- */
        .error-card {
            background: var(--color-surface);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-right: 5px solid var(--color-danger);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            border: 1px solid var(--color-border);
            border-right-width: 5px;
            animation: slideIn 0.35s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .error-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .error-card.resolved { border-right-color: var(--color-success); opacity: 0.85; }
        .error-card.archived { border-right-color: var(--color-text-secondary); opacity: 0.65; }

        .error-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
        .error-header-right { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

        .error-type {
            padding: 0.3rem 0.75rem 0.3rem 0.6rem;
            border-radius: 2rem;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 0.35rem;
        }
        .error-type svg { width: 13px; height: 13px; }
        .type-js { background: #fef3c7; color: #92400e; }
        .type-promise { background: #e0e7ff; color: #3730a3; }
        .type-network { background: #fee2e2; color: #991b1b; }

        .error-badge-new {
            background: var(--color-danger); color: white; padding: 0.2rem 0.6rem;
            border-radius: 0.4rem; font-size: 0.68rem; font-weight: 800;
        }
        .error-count-badge {
            background: var(--color-accent); color: white; padding: 0.2rem 0.6rem;
            border-radius: 0.4rem; font-size: 0.7rem; font-weight: 800;
            display: inline-flex; align-items: center; gap: 0.25rem;
        }
        .error-count-badge svg { width: 11px; height: 11px; }

        .error-timestamp {
            font-size: 0.82rem; color: var(--color-text-secondary); font-weight: 600;
            display: flex; align-items: center; gap: 0.3rem; cursor: help;
        }
        .error-timestamp svg { width: 13px; height: 13px; }

        .error-message { font-weight: 700; font-size: 1.08rem; margin: 0.5rem 0; color: var(--color-text); word-break: break-word; }

        .error-meta { font-size: 0.85rem; color: var(--color-text-secondary); display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 0.6rem; }
        .error-meta span { display: flex; align-items: center; gap: 0.4rem; }
        .error-meta svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--color-text-secondary); }
        .error-meta code { background: var(--color-muted); padding: 2px 6px; border-radius: 4px; }

        .stack-trace {
            background: #1e293b;
            color: #f1f5f9;
            padding: 1rem;
            border-radius: 0.6rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            margin-top: 1rem;
            max-height: 300px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            display: none;
            border: 1px solid #334155;
        }

        .actions { display: flex; gap: 0.5rem; margin-top: 1.4rem; border-top: 1px solid var(--color-border); padding-top: 1rem; flex-wrap: wrap; }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.83rem; border-radius: 0.55rem; cursor: pointer; border: none; font-weight: 700; transition: all 0.2s; font-family: inherit; display: inline-flex; align-items: center; gap: 0.4rem; }
        .btn-sm svg { width: 14px; height: 14px; flex-shrink: 0; }
        .btn-resolve { background: var(--color-success); color: white; }
        .btn-resolve:hover { background: #16a34a; }
        .btn-archive { background: var(--color-text-secondary); color: white; }
        .btn-archive:hover { background: #4b5563; }
        .btn-toggle-stack { background: var(--color-accent); color: white; }
        .btn-toggle-stack:hover { background: #2563eb; }
        .btn-toggle-stack svg { transition: transform 0.2s; }
        .btn-toggle-stack.open svg { transform: rotate(180deg); }
        .btn-copy { background: var(--color-muted); color: var(--color-text); border: 1px solid var(--color-border); margin-right: auto; }
        .btn-copy:hover { background: var(--color-border); }

        /* New Error Highlight */
        .new-error-highlight { animation: highlight 2s ease-out; }
        @keyframes highlight {
            0% { background: rgba(239, 68, 68, 0.18); }
            100% { background: var(--color-surface); }
        }

        /* ---------- Skeleton loading ---------- */
        .skeleton-card {
            background: var(--color-surface); border: 1px solid var(--color-border);
            border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem;
        }
        .skeleton-line { height: 12px; border-radius: 6px; margin-bottom: 0.6rem; background: linear-gradient(90deg, var(--color-muted) 25%, var(--color-border) 37%, var(--color-muted) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        .skeleton-line.w40 { width: 40%; }
        .skeleton-line.w70 { width: 70%; }
        .skeleton-line.w25 { width: 25%; height: 20px; border-radius: 2rem; }

        /* ---------- Empty state ---------- */
        .empty-state {
            text-align: center; padding: 4.5rem 2rem; background: var(--color-surface);
            border-radius: 1rem; border: 1px solid var(--color-border);
        }
        .empty-state svg { width: 56px; height: 56px; color: var(--color-success); margin-bottom: 1rem; }
        .empty-state.error-state svg { color: var(--color-danger); }
        .empty-state p { color: var(--color-text-secondary); font-size: 1.05rem; margin: 0.25rem 0; }
        .empty-state h3 { margin: 0 0 0.4rem; color: var(--color-text); }

        /* ---------- Toasts ---------- */
        .toast-stack {
            position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 5000;
            display: flex; flex-direction: column; gap: 0.6rem; max-width: 340px;
        }
        .toast {
            background: var(--color-surface); border: 1px solid var(--color-border);
            border-right: 4px solid var(--color-accent);
            border-radius: 0.7rem; padding: 0.85rem 1rem;
            box-shadow: var(--shadow-lg);
            display: flex; align-items: flex-start; gap: 0.6rem;
            font-size: 0.87rem; font-weight: 600; color: var(--color-text);
            animation: toastIn 0.25s ease-out;
        }
        .toast.success { border-right-color: var(--color-success); }
        .toast.error { border-right-color: var(--color-danger); }
        .toast.info { border-right-color: var(--color-accent); }
        .toast svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
        .toast.success svg { color: var(--color-success); }
        .toast.error svg { color: var(--color-danger); }
        .toast.info svg { color: var(--color-accent); }
        .toast-close { margin-right: auto; cursor: pointer; color: var(--color-text-secondary); background: none; border: none; padding: 0; display: flex; }
        .toast-close svg { width: 14px; height: 14px; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(6px); } }

        @media (max-width: 640px) {
            .toast-stack { left: 0.75rem; right: 0.75rem; max-width: none; }
            .filter-actions { margin-right: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div class="errors-container">
            <div class="errors-header">
                <div>
                    <h1 style="font-size: 2.1rem; font-weight: 800; margin: 0;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                        تتبع أخطاء الموقع
                    </h1>
                    <p style="color: var(--color-text-secondary); margin-top: 0.4rem; font-size: 1.05rem;">مراقبة وتحليل الأخطاء البرمجية والشبكية في الوقت الفعلي</p>
                </div>
                <div id="realtimeStatus" class="realtime-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                    <div class="pulse-dot"></div>
                    <span>متصل بالبث المباشر</span>
                </div>
            </div>

            <div class="error-stats-grid">
                <div class="estat-card">
                    <div class="estat-icon" style="background:#E3F2FD; color:#1976D2;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    </div>
                    <div class="estat-info">
                        <p class="estat-label">إجمالي الأخطاء</p>
                        <div class="estat-value" id="statTotal">—</div>
                    </div>
                </div>
                <div class="estat-card">
                    <div class="estat-icon" style="background:#FEE2E2; color:#991B1B;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    </div>
                    <div class="estat-info">
                        <p class="estat-label">أخطاء نشطة</p>
                        <div class="estat-value" id="statNew">—</div>
                    </div>
                </div>
                <div class="estat-card">
                    <div class="estat-icon" style="background:#E8F5E9; color:#2E7D32;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                    <div class="estat-info">
                        <p class="estat-label">تم حلها</p>
                        <div class="estat-value" id="statResolved">—</div>
                    </div>
                </div>
                <div class="estat-card">
                    <div class="estat-icon" style="background:#EEEEEE; color:#555555;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                    </div>
                    <div class="estat-info">
                        <p class="estat-label">مؤرشفة</p>
                        <div class="estat-value" id="statArchived">—</div>
                    </div>
                </div>
            </div>

            <div class="filters-bar">
                <div class="filter-group">
                    <label>الحالة</label>
                    <div class="status-tabs" id="statusTabs">
                        <button type="button" class="status-tab active" data-status="new">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            الحالية
                        </button>
                        <button type="button" class="status-tab" data-status="all">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                            الكل
                        </button>
                        <button type="button" class="status-tab" data-status="resolved">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                            محلولة
                        </button>
                        <button type="button" class="status-tab" data-status="archived">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
                            مؤرشفة
                        </button>
                    </div>
                </div>

                <div class="filter-group">
                    <label>نوع الخطأ</label>
                    <select id="filterType">
                        <option value="all">كل الأنواع</option>
                        <option value="js">JavaScript / Console</option>
                        <option value="promise">Promises</option>
                        <option value="network">Network / API</option>
                    </select>
                </div>

                <div class="filter-group" style="flex-grow: 1;">
                    <label>بحث</label>
                    <div class="search-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="searchInput" placeholder="بحث في الرسالة، الرابط، أو الـ Stack Trace...">
                    </div>
                </div>

                <div class="filter-group">
                    <label>&nbsp;</label>
                    <label class="group-toggle">
                        <span class="switch">
                            <input type="checkbox" id="groupToggle">
                            <span class="switch-track"></span>
                        </span>
                        تجميع المتشابه
                    </label>
                </div>

                <div class="filter-actions">
                    <button class="icon-btn" id="collapseAllBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        عرض كل التفاصيل
                    </button>
                    <button class="icon-btn primary" id="refreshBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                        تحديث
                    </button>
                </div>
            </div>

            <div id="errorsList">
                <div class="skeleton-card"><div class="skeleton-line w25"></div><div class="skeleton-line w70" style="margin-top:1rem;"></div><div class="skeleton-line w40"></div></div>
                <div class="skeleton-card"><div class="skeleton-line w25"></div><div class="skeleton-line w70" style="margin-top:1rem;"></div><div class="skeleton-line w40"></div></div>
                <div class="skeleton-card"><div class="skeleton-line w25"></div><div class="skeleton-line w70" style="margin-top:1rem;"></div><div class="skeleton-line w40"></div></div>
            </div>
        </div>
    </main>

    <div class="toast-stack" id="toastStack"></div>

    <script type="module">
        import { initSidebar } from '/assets/js/admin/sidebar.js';
        import { errorService } from '/error-service.js';

        let currentErrors = [];
        let stackAllOpen = false;
        const stats = { total: 0, new: 0, resolved: 0, archived: 0 };

        const ICONS = {
            js: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
            promise: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
            network: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>',
            location: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
            file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
            user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
            check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
            archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>',
            reopen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>',
            chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
            copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
            layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
            bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>',
            close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
            errorIcon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
        };

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function timeAgo(dateStr) {
            const date = new Date(dateStr);
            const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
            if (seconds < 60) return 'منذ لحظات';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `منذ ${minutes} ${minutes === 1 ? 'دقيقة' : 'دقائق'}`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `منذ ${hours} ${hours === 1 ? 'ساعة' : 'ساعات'}`;
            const days = Math.floor(hours / 24);
            if (days < 30) return `منذ ${days} ${days === 1 ? 'يوم' : 'أيام'}`;
            return date.toLocaleDateString('ar-EG');
        }

        // -------------------- Toasts --------------------
        function showToast(message, type = 'info') {
            const stack = document.getElementById('toastStack');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const icon = type === 'success' ? ICONS.check : (type === 'error' ? ICONS.errorIcon : ICONS.bell);
            el.innerHTML = `${icon}<span>${escapeHtml(message)}</span><button class="toast-close" type="button">${ICONS.close}</button>`;
            el.querySelector('.toast-close').onclick = () => el.remove();
            stack.appendChild(el);
            setTimeout(() => {
                el.style.animation = 'toastOut 0.25s ease-in forwards';
                setTimeout(() => el.remove(), 250);
            }, 5000);
        }

        // -------------------- Stats --------------------
        function renderStats() {
            document.getElementById('statTotal').textContent = stats.total;
            document.getElementById('statNew').textContent = stats.new;
            document.getElementById('statResolved').textContent = stats.resolved;
            document.getElementById('statArchived').textContent = stats.archived;
        }

        async function loadStats() {
            try {
                const data = await errorService.getStats();
                Object.assign(stats, data);
                renderStats();
            } catch (err) {
                // Non-critical; leave placeholders
            }
        }

        // -------------------- Loading & rendering --------------------
        function getActiveStatus() {
            return document.querySelector('.status-tab.active').dataset.status;
        }

        async function loadErrors() {
            const filters = {
                type: document.getElementById('filterType').value,
                status: getActiveStatus(),
                search: document.getElementById('searchInput').value
            };

            try {
                const { data } = await errorService.fetchErrors(filters);
                currentErrors = data;
                renderErrors(currentErrors);
            } catch (err) {
                document.getElementById('errorsList').innerHTML = `
                    <div class="empty-state error-state">
                        ${ICONS.errorIcon}
                        <h3>فشل تحميل البيانات</h3>
                        <p>${escapeHtml(err.message)}</p>
                        <button class="icon-btn primary" id="retryBtn" style="margin-top: 1.25rem;">${ICONS.reopen} إعادة المحاولة</button>
                    </div>`;
                const retryBtn = document.getElementById('retryBtn');
                if (retryBtn) retryBtn.onclick = () => loadErrors();
            }
        }

        function groupErrors(errors) {
            const map = new Map();
            errors.forEach(err => {
                const key = `${err.type}|${err.status}|${err.message}`;
                if (!map.has(key)) {
                    map.set(key, { ...err, ids: [err.id], count: 1, occurrences: [err.created_at] });
                } else {
                    const group = map.get(key);
                    group.ids.push(err.id);
                    group.count++;
                    group.occurrences.push(err.created_at);
                    if (new Date(err.created_at) > new Date(group.created_at)) {
                        group.created_at = err.created_at;
                        group.stack_trace = err.stack_trace;
                        group.page_url = err.page_url;
                    }
                }
            });
            return Array.from(map.values()).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        }

        function cardHtml(err, highlight) {
            const idsCsv = (err.ids || [err.id]).join(',');
            const cardId = err.ids ? err.ids[0] : err.id;
            const isGroup = err.count && err.count > 1;
            return `
                <div class="error-card ${err.status} ${highlight ? 'new-error-highlight' : ''}" id="error-${cardId}">
                    <div class="error-header">
                        <div class="error-header-right">
                            <span class="error-type type-${err.type}">${ICONS[err.type] || ''}${err.type}</span>
                            ${err.status === 'new' ? `<span class="error-badge-new">جديد</span>` : ''}
                            ${isGroup ? `<span class="error-count-badge">${ICONS.layers}×${err.count}</span>` : ''}
                        </div>
                        <span class="error-timestamp" title="${new Date(err.created_at).toLocaleString('ar-EG')}">
                            ${ICONS.clock}${timeAgo(err.created_at)}
                        </span>
                    </div>
                    <div class="error-message">${escapeHtml(err.message)}</div>
                    <div class="error-meta">
                        <span>${ICONS.location}<b>الرابط:</b> <a href="${escapeHtml(err.page_url)}" target="_blank" style="color: var(--color-accent); text-decoration: none;">${escapeHtml(err.page_url)}</a></span>
                        ${err.file_name ? `<span>${ICONS.file}<b>المصدر:</b> ${escapeHtml(err.file_name)}${err.line_number ? `:${err.line_number}:${err.column_number}` : ''}</span>` : ''}
                        <span>${ICONS.user}<b>المستخدم:</b> ${err.user_id ? `<code>${escapeHtml(err.user_id)}</code>` : 'زائر'}</span>
                    </div>
                    <div class="stack-trace" id="stack-${cardId}">${escapeHtml(err.stack_trace) || 'لا توجد تفاصيل إضافية (Stack Trace)'}</div>
                    <div class="actions">
                        <button class="btn-sm btn-toggle-stack" id="toggle-${cardId}" onclick="window.toggleStack('${cardId}')">${ICONS.chevron} عرض التفاصيل</button>
                        <button class="btn-sm btn-copy" onclick="window.copyError('${cardId}')">${ICONS.copy} نسخ</button>
                        ${err.status === 'new' ? `
                            <button class="btn-sm btn-resolve" onclick="window.updateStatus('${idsCsv}', 'resolved')">${ICONS.check} تم الحل</button>
                            <button class="btn-sm btn-archive" onclick="window.updateStatus('${idsCsv}', 'archived')">${ICONS.archive} أرشفة</button>
                        ` : `
                            <button class="btn-sm btn-archive" onclick="window.updateStatus('${idsCsv}', 'new')">${ICONS.reopen} إعادة فتح</button>
                        `}
                    </div>
                </div>
            `;
        }

        function renderErrors(errors, isNew = false) {
            const container = document.getElementById('errorsList');
            if (!errors || errors.length === 0) {
                const active = getActiveStatus();
                const friendly = active === 'new';
                container.innerHTML = `
                    <div class="empty-state">
                        ${friendly
                            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
                            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'}
                        <h3>${friendly ? 'لا توجد أخطاء نشطة حالياً' : 'لا توجد نتائج'}</h3>
                        <p>${friendly ? 'الموقع يعمل بدون أي أخطاء مسجّلة في الوقت الحالي.' : 'لا توجد أخطاء تطابق الفلاتر المختارة.'}</p>
                    </div>`;
                return;
            }

            const grouped = document.getElementById('groupToggle').checked ? groupErrors(errors) : errors;
            const html = grouped.map((err, i) => cardHtml(err, isNew && i === 0)).join('');
            container.innerHTML = html;
            stackAllOpen = false;
            updateCollapseBtnLabel();
        }

        function updateCollapseBtnLabel() {
            const btn = document.getElementById('collapseAllBtn');
            btn.innerHTML = stackAllOpen
                ? `${ICONS.chevron} إخفاء كل التفاصيل`
                : `${ICONS.chevron} عرض كل التفاصيل`;
        }

        // -------------------- Realtime --------------------
        function setupRealtime() {
            errorService.subscribeToErrors(
                (newError) => {
                    const statusBadge = document.getElementById('realtimeStatus');
                    const statusText = statusBadge.querySelector('span');
                    statusBadge.style.background = 'var(--color-danger)';
                    statusText.textContent = 'خطأ جديد تم رصده!';
                    showToast('تم رصد خطأ جديد في الموقع', 'info');

                    stats.total++;
                    stats[newError.status] = (stats[newError.status] || 0) + 1;
                    renderStats();

                    const currentType = document.getElementById('filterType').value;
                    const currentStatus = getActiveStatus();

                    if ((currentType === 'all' || currentType === newError.type) &&
                        (currentStatus === 'all' || currentStatus === newError.status)) {
                        currentErrors.unshift(newError);
                        if (currentErrors.length > 50) currentErrors.pop();
                        renderErrors(currentErrors, true);
                    }

                    setTimeout(() => {
                        statusBadge.style.background = 'var(--color-success)';
                        statusText.textContent = 'متصل بالبث المباشر';
                    }, 5000);
                },
                (updatedError, oldError) => {
                    if (oldError && oldError.status && oldError.status !== updatedError.status) {
                        stats[oldError.status] = Math.max(0, (stats[oldError.status] || 0) - 1);
                        stats[updatedError.status] = (stats[updatedError.status] || 0) + 1;
                        renderStats();
                    }

                    const currentStatus = getActiveStatus();
                    const currentType = document.getElementById('filterType').value;
                    const errorIndex = currentErrors.findIndex(e => e.id === updatedError.id);

                    const matchesFilters =
                        (currentType === 'all' || currentType === updatedError.type) &&
                        (currentStatus === 'all' || currentStatus === updatedError.status);

                    if (matchesFilters) {
                        if (errorIndex !== -1) currentErrors[errorIndex] = updatedError;
                        else currentErrors.unshift(updatedError);
                    } else if (errorIndex !== -1) {
                        currentErrors.splice(errorIndex, 1);
                    }

                    renderErrors(currentErrors);
                }
            );
        }

        // -------------------- Global window handlers --------------------
        window.toggleStack = (id) => {
            const el = document.getElementById(`stack-${id}`);
            const btn = document.getElementById(`toggle-${id}`);
            if (!el) return;
            const open = el.style.display === 'block';
            el.style.display = open ? 'none' : 'block';
            if (btn) btn.classList.toggle('open', !open);
        };

        window.copyError = async (id) => {
            const err = currentErrors.find(e => e.id === id) || {};
            const text = [
                `النوع: ${err.type || ''}`,
                `الرسالة: ${err.message || ''}`,
                `الرابط: ${err.page_url || ''}`,
                err.file_name ? `المصدر: ${err.file_name}${err.line_number ? `:${err.line_number}:${err.column_number}` : ''}` : '',
                `التوقيت: ${err.created_at ? new Date(err.created_at).toLocaleString('ar-EG') : ''}`,
                err.stack_trace ? `\nStack Trace:\n${err.stack_trace}` : ''
            ].filter(Boolean).join('\n');

            try {
                await navigator.clipboard.writeText(text);
                showToast('تم نسخ تفاصيل الخطأ', 'success');
            } catch (e) {
                showToast('تعذر نسخ التفاصيل', 'error');
            }
        };

        window.updateStatus = async (idsCsv, status) => {
            const ids = idsCsv.split(',');
            try {
                await Promise.all(ids.map(id => errorService.updateStatus(id, status)));
                const filterStatus = getActiveStatus();
                ids.forEach(id => {
                    const idx = currentErrors.findIndex(e => e.id === id);
                    if (idx !== -1) {
                        if (filterStatus !== 'all' && status !== filterStatus) currentErrors.splice(idx, 1);
                        else currentErrors[idx].status = status;
                    }
                });
                renderErrors(currentErrors);
                showToast(ids.length > 1 ? `تم تحديث ${ids.length} أخطاء متطابقة` : 'تم تحديث حالة الخطأ', 'success');
            } catch (err) {
                showToast('فشل تحديث الحالة: ' + err.message, 'error');
            }
        };

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func(...args), wait);
            };
        }

        // -------------------- Init --------------------
        document.addEventListener('DOMContentLoaded', () => {
            initSidebar();
            loadStats();
            loadErrors();
            setupRealtime();

            document.getElementById('statusTabs').addEventListener('click', (e) => {
                const btn = e.target.closest('.status-tab');
                if (!btn) return;
                document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                loadErrors();
            });

            document.getElementById('filterType').addEventListener('change', loadErrors);
            document.getElementById('searchInput').addEventListener('input', debounce(loadErrors, 500));
            document.getElementById('refreshBtn').addEventListener('click', () => { loadErrors(); loadStats(); });
            document.getElementById('groupToggle').addEventListener('change', () => renderErrors(currentErrors));

            document.getElementById('collapseAllBtn').addEventListener('click', () => {
                stackAllOpen = !stackAllOpen;
                document.querySelectorAll('.stack-trace').forEach(el => el.style.display = stackAllOpen ? 'block' : 'none');
                document.querySelectorAll('.btn-toggle-stack').forEach(btn => btn.classList.toggle('open', stackAllOpen));
                updateCollapseBtnLabel();
            });
        });
    </script>
</body>
</html>
