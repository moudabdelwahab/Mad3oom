<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصمم الأتمتة — مركز المساعدة</title>
<style>
:root{
  /* ===== Design Tokens — elevated SaaS identity ===== */
  --bg-canvas: #FAFAFB;
  --bg-surface: #FFFFFF;
  --bg-sidebar: #FFFFFF;
  --border-soft: #EBECEF;
  --border-strong: #DBDDE3;

  --text-primary: #14151A;
  --text-secondary: #6B7080;
  --text-tertiary: #9CA0AC;

  --accent-primary: #4F46E5;
  --accent-primary-hover: #4338CA;
  --accent-primary-soft: #EEF0FF;
  --accent-ring: rgba(79,70,229,.14);

  --cat-trigger: #0EA05A;      --cat-trigger-soft: #E7F8EF;
  --cat-condition: #3B5BFB;    --cat-condition-soft: #EEF1FF;
  --cat-comm: #2563EB;         --cat-comm-soft: #EAF1FF;
  --cat-notify: #D97706;       --cat-notify-soft: #FEF3E1;
  --cat-ticket: #DB2777;       --cat-ticket-soft: #FDEAF3;
  --cat-flow: #F97316;         --cat-flow-soft: #FFF1E7;
  --cat-ai: #9333EA;           --cat-ai-soft: #F5EBFE;
  --cat-integration: #4F46E5;  --cat-integration-soft: #EEF0FF;
  --cat-database: #0D9488;     --cat-database-soft: #E4F7F5;

  --radius-sm: 9px;
  --radius-md: 13px;
  --radius-lg: 18px;

  --shadow-xs: 0 1px 2px rgba(16,17,25,.04);
  --shadow-card: 0 1px 2px rgba(16,17,25,.05), 0 1px 1px rgba(16,17,25,.03);
  --shadow-card-hover: 0 8px 24px rgba(16,17,25,.08), 0 2px 6px rgba(16,17,25,.04);
  --shadow-panel: -12px 0 32px rgba(16,17,25,.04);
  --shadow-popover: 0 16px 40px rgba(16,17,25,.14), 0 2px 8px rgba(16,17,25,.06);

  --ease: cubic-bezier(.2,.7,.3,1);
  --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family: var(--font);
  background: var(--bg-canvas);
  color: var(--text-primary);
  overflow:hidden;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
button, .icon-btn, .node, .lib-item, .choice-card, .chip-option, .select-row, .unit-btn { transition: background-color .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease), transform .15s var(--ease), color .15s var(--ease); }

.icon{ width:20px; height:20px; stroke-width:1.8; stroke:currentColor; fill:none; stroke-linecap:round; stroke-linejoin:round; display:block; flex-shrink:0; }
.icon-sm{ width:16px; height:16px; }
.icon-lg{ width:22px; height:22px; }

@keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }
@keyframes popIn{ from{ opacity:0; transform:scale(.97) translateY(-4px);} to{ opacity:1; transform:scale(1) translateY(0);} }
@keyframes pulseDot{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
@keyframes shimmer{ 0%{ background-position: -200px 0; } 100%{ background-position: calc(200px + 100%) 0; } }

/* ===================== APP SHELL ===================== */
.app{ height:100vh; display:flex; flex-direction:column; }

/* ---------- Top bar ---------- */
.topbar{
  height:58px;
  background:var(--bg-surface);
  border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; flex-shrink:0; z-index:20;
}
.topbar-right, .topbar-left{ display:flex; align-items:center; gap:10px; }
.topbar-breadcrumb{ display:flex; align-items:center; gap:7px; color:var(--text-tertiary); font-size:12.5px; }
.topbar-breadcrumb .sep{ width:14px; height:14px; color:var(--border-strong); }
.topbar-breadcrumb .current{ color:var(--text-primary); font-weight:700; font-size:14.5px; letter-spacing:-.01em; }
.icon-btn{
  width:32px; height:32px; border-radius:var(--radius-sm);
  border:1px solid transparent; background:transparent;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary);
}
.icon-btn:hover{ background:#F4F4F6; color:var(--text-primary); }
.status-pill{
  display:flex; align-items:center; gap:6px;
  background:var(--cat-trigger-soft); color:var(--cat-trigger);
  padding:5px 11px 5px 12px; border-radius:20px; font-size:12px; font-weight:700;
  border:1px solid rgba(14,160,90,.15);
}
.status-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--cat-trigger); animation:pulseDot 2s ease-in-out infinite; }

.btn{
  height:34px; padding:0 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border-soft); background:var(--bg-surface);
  font-size:13px; font-weight:600; color:var(--text-primary);
  display:flex; align-items:center; gap:6px;
}
.btn:hover{ background:#F7F7F8; border-color:var(--border-strong); }
.btn-primary{ background:var(--accent-primary); color:#fff; border-color:var(--accent-primary); box-shadow:0 1px 2px rgba(79,70,229,.25); }
.btn-primary:hover{ background:var(--accent-primary-hover); border-color:var(--accent-primary-hover); }
.btn-primary:active{ transform:translateY(1px); }

/* connection badge */
.conn-badge{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-tertiary); padding:4px 9px; border-radius:20px; border:1px solid var(--border-soft); }
.conn-badge .dot{ width:6px; height:6px; border-radius:50%; }
.conn-badge.live .dot{ background:var(--cat-trigger); animation:pulseDot 2s ease-in-out infinite; }
.conn-badge.live{ color:var(--cat-trigger); border-color:rgba(14,160,90,.18); background:var(--cat-trigger-soft); }
.conn-badge.loading .dot{ background:var(--text-tertiary); }

/* ---------- Body layout: fixed 3-column flex, footer belongs to canvas column ---------- */
.body-layout{ flex:1; display:flex; overflow:hidden; position:relative; min-height:0; }

.canvas-col{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }

.canvas-wrap{
  flex:1; min-height:0;
  position:relative; overflow:auto;
  background-image: radial-gradient(circle, #E5E7EB 1.3px, transparent 1.3px);
  background-size: 24px 24px;
}
.canvas-inner{
  min-height:100%; width:100%;
  display:flex; flex-direction:column; align-items:center;
  padding:44px 40px 64px;
}

.flow-summary{
  max-width:580px; width:100%;
  background:linear-gradient(180deg,#FFFFFF, #FCFCFE);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-md);
  padding:14px 18px; margin-bottom:32px;
  display:flex; gap:12px; align-items:flex-start;
  box-shadow:var(--shadow-card);
  animation:fadeSlideIn .4s var(--ease);
}
.flow-summary .icon-wrap{
  width:28px; height:28px; border-radius:8px; flex-shrink:0;
  background:var(--accent-primary-soft); color:var(--accent-primary);
  display:flex; align-items:center; justify-content:center;
}
.flow-summary .icon{ width:16px; height:16px; }
.flow-summary p{ font-size:13.5px; line-height:1.75; color:var(--text-secondary); padding-top:3px; }
.flow-summary b{ color:var(--text-primary); font-weight:700; }

.node{
  width:426px;
  background:var(--bg-surface);
  border:1.5px solid var(--border-soft);
  border-radius:var(--radius-md);
  padding:16px 18px;
  cursor:pointer;
  position:relative;
  box-shadow:var(--shadow-card);
  animation:fadeSlideIn .35s var(--ease) backwards;
}
.node:hover{ box-shadow:var(--shadow-card-hover); border-color:var(--border-strong); transform:translateY(-1px); }
.node.selected{ border-color:var(--node-color, var(--accent-primary)); box-shadow:0 0 0 4px var(--node-color-soft, var(--accent-ring)); transform:none; }

.node-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.node-kicker{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:var(--node-color); text-transform:uppercase; letter-spacing:.04em; }
.node-menu-btn{ width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); }
.node-menu-btn:hover{ background:#F2F2F5; color:var(--text-secondary); }

.node-main{ display:flex; align-items:flex-start; gap:12px; }
.node-icon{
  width:38px; height:38px; border-radius:11px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--node-color-soft); color:var(--node-color);
}
.node-text{ flex:1; min-width:0; }
.node-title{ font-size:15px; font-weight:700; color:var(--text-primary); margin-bottom:3px; letter-spacing:-.01em; }
.node-sub{ font-size:12.5px; color:var(--text-secondary); line-height:1.55; }
.node-sub .chip{
  display:inline-flex; align-items:center; background:#F2F2F5; color:var(--text-primary);
  border-radius:6px; padding:1.5px 7px; font-weight:700; font-size:11.5px; margin:0 2px;
}

.branch-hint{ display:flex; gap:6px; margin-top:10px; }

.connector{ width:2px; height:26px; background:var(--border-strong); }
.add-step-btn{
  width:26px; height:26px; border-radius:50%;
  background:var(--bg-surface); border:1.5px dashed var(--border-strong);
  display:flex; align-items:center; justify-content:center;
  color:var(--text-tertiary); margin:6px 0; position:relative; z-index:2;
}
.add-step-btn:hover{ border-color:var(--accent-primary); border-style:solid; color:var(--accent-primary); background:var(--accent-primary-soft); transform:scale(1.08); }

.branch-wrap{ display:flex; width:426px; justify-content:space-between; gap:16px; }
.branch-col{ display:flex; flex-direction:column; align-items:center; width:100%; }
.branch-label{ font-size:11px; font-weight:800; padding:4px 11px; border-radius:20px; margin-bottom:8px; letter-spacing:.02em; }
.branch-yes{ background:var(--cat-trigger-soft); color:var(--cat-trigger); }
.branch-no{ background:#FBEAEA; color:#DC2626; }

.flow-end{
  display:flex; align-items:center; gap:7px;
  color:var(--text-tertiary); font-size:12px; font-weight:700;
  padding:7px 14px; border:1.5px dashed var(--border-soft); border-radius:20px;
  margin-top:6px; background:#fff;
}

/* zoom controls — anchored to canvas column, not floating over content flow */
.zoom-controls{
  position:absolute; bottom:16px; left:20px; z-index:10;
  display:flex; align-items:center; gap:1px;
  background:var(--bg-surface); border:1px solid var(--border-soft); border-radius:11px;
  padding:4px; box-shadow:var(--shadow-card-hover);
}
.zoom-controls .icon-btn{ width:29px; height:29px; }
.zoom-level{ font-size:11.5px; color:var(--text-secondary); font-weight:700; padding:0 8px; min-width:40px; text-align:center; }

/* footer trust bar — belongs to canvas column flex flow, never overlaps content */
.trust-bar{
  flex-shrink:0;
  background:var(--bg-surface); border-top:1px solid var(--border-soft);
  display:flex; gap:32px; align-items:center; justify-content:center;
  padding:10px; font-size:11.5px; color:var(--text-tertiary);
}
.trust-item{ display:flex; align-items:center; gap:7px; }
.trust-item .icon{ color:var(--text-tertiary); width:15px; height:15px; }

/* ===================== RIGHT PANEL — Library ===================== */
.library-panel{
  width:336px; flex-shrink:0;
  background:var(--bg-sidebar);
  border-left:1px solid var(--border-soft);
  display:flex; flex-direction:column; overflow:hidden;
}
.panel-tabs{ display:flex; padding:10px 16px 0; gap:4px; border-bottom:1px solid var(--border-soft); flex-shrink:0; }
.panel-tab{
  flex:1; text-align:center; padding:10px 0 11px; font-size:13px; font-weight:700;
  color:var(--text-tertiary); border-bottom:2px solid transparent; margin-bottom:-1px;
}
.panel-tab.active{ color:var(--accent-primary); border-color:var(--accent-primary); }

.library-search{ padding:12px 16px 4px; flex-shrink:0; }
.search-box{
  display:flex; align-items:center; gap:8px;
  background:#F4F4F6; border-radius:var(--radius-sm); padding:8px 11px;
  color:var(--text-tertiary); border:1px solid transparent;
}
.search-box:focus-within{ border-color:var(--accent-primary); background:#fff; box-shadow:0 0 0 3px var(--accent-ring); }
.search-box input{ border:none; background:none; outline:none; flex:1; font-size:13px; color:var(--text-primary); }

.library-scroll{ flex:1; overflow-y:auto; padding:6px 14px 20px; min-height:0; }

.lib-section{ margin-top:12px; }
.lib-section-head{ padding:8px 6px 6px; }
.lib-section-head h4{ font-size:11px; font-weight:800; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.04em; }

.lib-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 9px; border-radius:var(--radius-sm);
  border:1px solid transparent; margin-bottom:2px;
}
.lib-item:not(.soon):hover{ background:#F7F7F9; border-color:var(--border-soft); }
.lib-item:not(.soon):active{ background:#F0F0F3; }
.lib-item-icon{
  width:32px; height:32px; border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.lib-item-icon .icon{ width:17px; height:17px; }
.lib-item-text{ flex:1; min-width:0; }
.lib-item-title{ font-size:13px; font-weight:600; color:var(--text-primary); }
.lib-item-desc{ font-size:11px; color:var(--text-tertiary); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lib-item .icon-plus{ color:var(--text-tertiary); width:15px; height:15px; }

.lib-item.soon{ opacity:.5; }
.soon-badge{
  font-size:9.5px; font-weight:800; background:#F2F2F5; color:var(--text-tertiary);
  padding:2px 6px; border-radius:5px; flex-shrink:0; letter-spacing:.02em;
}

/* ===================== LEFT PANEL — Inspector ===================== */
.inspector-panel{
  width:384px; flex-shrink:0;
  background:var(--bg-sidebar);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  box-shadow:var(--shadow-panel);
  overflow:hidden;
}
.inspector-head{
  padding:16px 18px; border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; gap:11px; flex-shrink:0;
}
.inspector-head .back-btn{
  width:29px; height:29px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); flex-shrink:0;
}
.inspector-head .back-btn:hover{ background:#F2F2F5; }
.inspector-head-icon{
  width:36px; height:36px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--node-color-soft); color:var(--node-color);
}
.inspector-head-text h3{ font-size:14.5px; font-weight:700; letter-spacing:-.01em; }
.inspector-head-text p{ font-size:11.5px; color:var(--text-tertiary); margin-top:1px; }

.inspector-scroll{ flex:1; overflow-y:auto; padding:16px; min-height:0; }

.qstep{ margin-bottom:9px; border-radius:var(--radius-md); }
.qstep.done{
  background:#FAFAFB; border:1px solid var(--border-soft);
  padding:11px 13px; display:flex; align-items:center; gap:10px;
  animation:fadeSlideIn .25s var(--ease) backwards;
}
.qstep.done .qdone-row{ flex:1; display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:0; }
.qstep.done .qdone-label{ font-size:11px; color:var(--text-tertiary); font-weight:600; margin-bottom:3px; }
.qstep.done .qdone-value{ font-size:13px; font-weight:700; color:var(--text-primary); display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
.qstep.done .qdone-value .chip{ background:#EFEFF2; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:600; }
.edit-link{ font-size:11.5px; font-weight:700; color:var(--accent-primary); display:flex; align-items:center; gap:3px; flex-shrink:0; padding:4px 2px; }
.edit-link:hover{ color:var(--accent-primary-hover); }
.check-dot{ width:17px; height:17px; border-radius:50%; background:var(--cat-trigger); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.check-dot .icon{ width:11px; height:11px; stroke-width:3; }

.qstep.active{
  border:1.5px solid var(--node-color); border-radius:var(--radius-md);
  padding:15px; background:#fff;
  box-shadow:0 3px 14px rgba(20,20,30,.06);
  animation:popIn .25s var(--ease);
}
.qnum{
  display:inline-flex; align-items:center; justify-content:center;
  width:19px; height:19px; border-radius:50%; background:var(--node-color-soft); color:var(--node-color);
  font-size:10.5px; font-weight:800; margin-left:8px; flex-shrink:0;
}
.qtitle{ font-size:14px; font-weight:700; color:var(--text-primary); display:flex; align-items:center; margin-bottom:4px; letter-spacing:-.01em; }
.qhelp{ font-size:11.5px; color:var(--text-tertiary); margin-bottom:13px; line-height:1.6; padding-right:27px; }

.qstep.pending{ opacity:.38; padding:9px 13px; }
.qstep.pending .qtitle{ font-size:13px; margin-bottom:0; }

.field-group{ padding-right:27px; }

.choice-grid{ display:flex; flex-wrap:wrap; gap:7px; }
.choice-card{
  flex:1; min-width:118px;
  border:1.5px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:11px 9px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;
}
.choice-card:hover{ border-color:var(--border-strong); background:#FAFAFB; }
.choice-card.picked{ border-color:var(--node-color); background:var(--node-color-soft); }
.choice-card .icon{ color:var(--node-color); width:19px; height:19px; }
.choice-card span{ font-size:12px; font-weight:600; }

.chip-select{ display:flex; flex-wrap:wrap; gap:7px; }
.chip-option{
  padding:7px 13px; border-radius:20px; border:1.5px solid var(--border-soft);
  font-size:12.5px; font-weight:600; color:var(--text-secondary);
  display:flex; align-items:center; gap:6px;
}
.chip-option .dot{ width:7px; height:7px; border-radius:50%; }
.chip-option:hover{ border-color:var(--border-strong); }
.chip-option.picked{ border-color:var(--node-color); background:var(--node-color-soft); color:var(--node-color); }

.select-list{ display:flex; flex-direction:column; gap:6px; }
.select-row{
  display:flex; align-items:center; gap:10px;
  border:1.5px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:9px 11px;
}
.select-row:hover{ border-color:var(--border-strong); background:#FAFAFB; }
.select-row.picked{ border-color:var(--node-color); background:var(--node-color-soft); }
.select-row .radio{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--border-strong); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.select-row.picked .radio{ border-color:var(--node-color); }
.select-row.picked .radio::after{ content:''; width:8px; height:8px; border-radius:50%; background:var(--node-color); }
.select-row-text{ flex:1; min-width:0; }
.select-row-title{ font-size:12.5px; font-weight:600; }
.select-row-sub{ font-size:11px; color:var(--text-tertiary); margin-top:1px; }

.text-input, .number-input, textarea.textarea-input{
  width:100%; border:1.5px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:9px 11px; font-size:13px; color:var(--text-primary); outline:none;
}
.text-input:focus, .number-input:focus, textarea.textarea-input:focus{ border-color:var(--node-color); box-shadow:0 0 0 3px var(--node-color-soft); }
textarea.textarea-input{ min-height:88px; resize:vertical; line-height:1.7; font-family:inherit; }

.number-unit-row{ display:flex; gap:7px; }
.number-unit-row .number-input{ width:84px; text-align:center; font-weight:700; }
.unit-toggle{ flex:1; display:flex; gap:5px; }
.unit-btn{
  flex:1; border:1.5px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:8px 0; text-align:center; font-size:12px; font-weight:600; color:var(--text-secondary);
}
.unit-btn:hover{ border-color:var(--border-strong); }
.unit-btn.picked{ border-color:var(--node-color); background:var(--node-color-soft); color:var(--node-color); }

.field-with-insert{ position:relative; }
.insert-btn{
  display:flex; align-items:center; gap:5px;
  font-size:11px; font-weight:700; color:var(--accent-primary);
  margin-top:7px; padding:4px 2px; width:fit-content;
}
.insert-btn:hover{ color:var(--accent-primary-hover); }

.rich-toolbar{ display:flex; gap:4px; margin-top:7px; }
.rich-toolbar button{
  width:27px; height:27px; border-radius:6px; border:1px solid var(--border-soft);
  display:flex; align-items:center; justify-content:center; color:var(--text-secondary); background:#fff;
}
.rich-toolbar button:hover{ background:#F7F7F9; }

.insert-popover{
  position:absolute; top:0; left:0; z-index:50;
  width:272px; background:#fff; border:1px solid var(--border-soft); border-radius:var(--radius-md);
  box-shadow:var(--shadow-popover); padding:9px;
  animation:popIn .15s var(--ease);
}
.insert-popover .search-box{ margin-bottom:7px; }
.insert-group{ margin-bottom:3px; }
.insert-group-title{
  font-size:10.5px; font-weight:800; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.03em;
  padding:6px 8px 4px; display:flex; align-items:center; gap:6px;
}
.insert-option{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:7px; font-size:12.5px; font-weight:600; }
.insert-option:hover{ background:#F5F5F7; }
.insert-option .icon{ width:15px; height:15px; color:var(--text-tertiary); }

.cond-row{ display:flex; align-items:center; gap:7px; margin-bottom:9px; flex-wrap:wrap; }
.cond-select{
  border:1.5px solid var(--border-soft); border-radius:var(--radius-sm); padding:8px 9px;
  font-size:12.5px; font-weight:600; color:var(--text-primary); background:#fff; outline:none; flex:1; min-width:110px;
}
.cond-select:focus{ border-color:var(--node-color); }
.cond-logic-toggle{ display:flex; background:#F2F2F5; border-radius:20px; padding:3px; margin:11px 0; width:fit-content; }
.cond-logic-toggle button{ border:none; background:none; padding:6px 13px; border-radius:16px; font-size:12px; font-weight:700; color:var(--text-tertiary); }
.cond-logic-toggle button.active{ background:#fff; color:var(--text-primary); box-shadow:var(--shadow-card); }
.add-cond-link{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--accent-primary); margin-top:5px; width:fit-content; }
.add-cond-link:hover{ color:var(--accent-primary-hover); }

.inspector-footer{ padding:13px 18px; border-top:1px solid var(--border-soft); display:flex; gap:8px; flex-shrink:0; }
.inspector-footer .btn{ flex:1; justify-content:center; }

.inspector-empty{
  display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;
  padding:40px; text-align:center; color:var(--text-tertiary); gap:12px;
}
.inspector-empty .icon-wrap{ width:44px; height:44px; border-radius:12px; background:#F4F4F6; display:flex; align-items:center; justify-content:center; }
.inspector-empty p{ font-size:12.5px; line-height:1.7; }

/* skeleton loading state */
.skeleton{ background:linear-gradient(90deg, #F0F0F3 0px, #F7F7F9 40px, #F0F0F3 80px); background-size:200px 100%; animation:shimmer 1.3s linear infinite; border-radius:8px; }

::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:#DBDDE3; border-radius:10px; }
::-webkit-scrollbar-thumb:hover{ background:#C6C9D1; }
::-webkit-scrollbar-track{ background:transparent; }
</style>

/* =========================================================================

   wf_workflows row via a narrow read-only RPC (wf_demo_get_showcase).
   This is the same project/schema the real "مدعوم" Help Desk platform
   uses; RLS keeps staff-only tables staff-only, this page only calls the
   one RPC scoped for public showcase rendering (no ticket/customer data).
   ========================================================================= */
const SUPABASE_URL = 'https://srnelrdpqkcntbgudyto.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNybmVscmRwcWtjbnRiZ3VkeXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMxNDYwNDcsImV4cCI6MjA3ODcyMjA0N30.Ox7wWQPu7GjYnjpx1w3gNYnDIykfANN4ott6narxdZI';

async function fetchShowcase(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/wf_demo_get_showcase`, {
    method:'POST',
    headers:{
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type':'application/json'
    },
    body: JSON.stringify({})
  });
  if(!res.ok) throw new Error('supabase_error_'+res.status);
  return res.json();
}

/* Icon mapping: DB node_types.key -> local SVG symbol id.
   (DB stores an emoji per node type for its own admin UI; this front-end
   deliberately never renders that emoji — every key is mapped to a
   Lucide-style SVG symbol here, per the no-emoji requirement.) */
const KEY_ICON = {
  'trigger.ticket_created':'i-ticket', 'trigger.ticket_status_changed':'i-refresh',
  'trigger.ticket_closed':'i-check', 'trigger.whatsapp_message_received':'i-whatsapp',
  'trigger.subscription_expiring':'i-clock', 'trigger.subscription_expired':'i-lock',
  'trigger.webhook_inbound':'i-plug', 'trigger.schedule_cron':'i-clock',
  'condition.if_else':'i-git-branch', 'condition.switch':'i-git-branch',

  'control.stop':'i-x', 'data.query_database':'i-database', 'data.set_variable':'i-tag',

const CATEGORY_META = {
  trigger:     { label:'متى يبدأ التدفق' },
  condition:   { label:'التحكم بمسار التدفق' },
  delay:       { label:'التحكم بمسار التدفق' },

  api:         { label:'الأنظمة والتكاملات' },

};
// order sections should render in
const SECTION_ORDER = ['trigger','condition','delay','loop','control','action','ai','database','api'];

const DATA_FIELDS = [
  { group:'التذكرة', icon:'i-ticket', items:['رقم التذكرة','عنوان التذكرة','وصف التذكرة','الأولوية','القسم'] },

  { group:'الموظف', icon:'i-user', items:['اسم الموظف المسؤول'] },
];

let NODE_TYPES = {};        // key -> {key,category,name_ar,description,color}
let WORKFLOW = null;        // {id,name,description,definition:{nodes,edges}}
let currentNodeId = null;
let liveAnswers = {};       // nodeId -> {stepId:value}
let connStatus = 'loading'; // loading | live | error

function colorSoft(hex){
  // convert #RRGGBB to a light tinted background consistently
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},0.11)`;
}

function setConnBadge(status, label){
  connStatus = status;
  const el = document.getElementById('connBadge');
  el.className = 'conn-badge ' + (status==='live'?'live':status==='error'?'':'loading');
  document.getElementById('connLabel').textContent = label;
}

/* =========================================================================
   BOOT — fetch live data, then render library + canvas + inspector
   ========================================================================= */
async function boot(){
  setConnBadge('loading', 'جارِ الاتصال بقاعدة البيانات…');
  try{
    const data = await fetchShowcase();
    NODE_TYPES = {};
    (data.node_types||[]).forEach(nt=>{ NODE_TYPES[nt.key] = nt; });
    WORKFLOW = data.workflow;

    setConnBadge('live', `متصل — Supabase مباشر`);
    document.getElementById('flowTitle').textContent = WORKFLOW ? WORKFLOW.name.replace('[عرض توضيحي] ','') : 'تدفق جديد';

    renderLibrary();
    renderCanvas();
    closeInspector();
  } catch(err){
    setConnBadge('error', 'تعذّر الاتصال — جرّب لاحقًا');
    document.getElementById('flowTitle').textContent = 'تعذّر تحميل التدفق';
    document.getElementById('canvasInner').innerHTML = `
      <div class="flow-summary" style="border-color:#F3D6D6">
        <div class="icon-wrap" style="background:#FBEAEA; color:#DC2626"><svg class="icon"><use href="#i-triangle-alert"/></svg></div>
        <p>تعذّر الاتصال بقاعدة البيانات الآن. تحقق من اتصال الشبكة وحاول تحديث الصفحة.</p>
      </div>`;
  }
}

/* =========================================================================
   LIBRARY (right panel) — built live from NODE_TYPES grouped by category
   ========================================================================= */
function renderLibrary(){
  const el = document.getElementById('libraryScroll');
  const byCat = {};
  Object.values(NODE_TYPES).forEach(nt=>{
    const catKey = ['delay','loop','control'].includes(nt.category) ? nt.category : nt.category;
    if(!byCat[nt.category]) byCat[nt.category] = [];
    byCat[nt.category].push(nt);
  });
  // merge condition/delay/loop/control under one visual section per SECTION_ORDER label grouping
  const merged = {}; // label -> items
  SECTION_ORDER.forEach(cat=>{
    const label = (CATEGORY_META[cat]||{label:cat}).label;
    if(!byCat[cat]) return;
    if(!merged[label]) merged[label] = [];
    merged[label].push(...byCat[cat]);
  });

  el.innerHTML = Object.entries(merged).map(([label, items])=>{
    items.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    const rows = items.map(nt=>{
      const icon = KEY_ICON[nt.key] || 'i-zap';
      const soft = colorSoft(nt.color||'#4F46E5');
      return `
        <div class="lib-item" onclick="addNodeFromLibrary('${nt.key}')" data-search="${(nt.name_ar+' '+(nt.description||'')).toLowerCase()}">
          <div class="lib-item-icon" style="background:${soft}; color:${nt.color}">
            <svg class="icon"><use href="#${icon}"/></svg>
          </div>
          <div class="lib-item-text">
            <div class="lib-item-title">${nt.name_ar}</div>
            <div class="lib-item-desc">${nt.description||''}</div>
          </div>
          <svg class="icon icon-plus"><use href="#i-plus"/></svg>
        </div>`;
    }).join('');
    return `<div class="lib-section"><div class="lib-section-head"><h4>${label}</h4></div>${rows}</div>`;
  }).join('');
}

document.getElementById('librarySearchInput').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.lib-item[data-search]').forEach(item=>{
    item.style.display = !q || item.dataset.search.includes(q) ? 'flex' : 'none';
  });
});

/* =========================================================================
   CANVAS — renders WORKFLOW.definition.nodes/edges as a linear story
   (kept intentionally readable/linear for the mockup rather than a full
   free-form graph renderer)
   ========================================================================= */
function nodeById(id){ return (WORKFLOW.definition.nodes||[]).find(n=>n.id===id); }
function edgesFrom(id){ return (WORKFLOW.definition.edges||[]).filter(e=>e.source===id); }

function nodeSummaryLine(node){
  const nt = NODE_TYPES[node.type];
  if(!nt) return '';
  const c = node.config || {};
  switch(node.type){
    case 'trigger.ticket_created':
      return c.priority && c.priority!=='any' ? `بأولوية <span class="chip">${priorityLabel(c.priority)}</span> فقط` : 'في أي وقت، من أي عميل';
    case 'condition.if_else':
      return `إذا كانت <span class="chip">${fieldLabel(c.variable)}</span> ${opLabel(c.operator)} <span class="chip">${valueLabel(c.value)}</span>`;
    case 'action.send_email':
      return `من ${c.from||'—'} إلى <span class="chip">${recipientLabel(c.to)}</span>`;
    case 'delay.wait':
      return `${c.duration_value||'—'} ${unitLabel(c.duration_unit)} ثم متابعة الخطوة التالية`;
    case 'action.send_notification':
      return `إلى <span class="chip">${recipientLabel(c.user_id)}</span>`;
    default:
      return nt.description || '';
  }
}
function priorityLabel(v){ return {low:'منخفضة',medium:'متوسطة',high:'عالية',urgent:'عاجلة',any:'أي أولوية'}[v]||v; }
function fieldLabel(v){ return {'ticket.priority':'الأولوية','ticket.category':'نوع التذكرة','ticket.department':'القسم','ticket.status':'الحالة'}[v]||v; }
function opLabel(v){ return {equals:'تساوي',not_equals:'لا تساوي',contains:'تحتوي على',greater_than:'أكبر من',less_than:'أصغر من'}[v]||v; }
function valueLabel(v){ return v==='urgent'?'عاجلة':v; }
function recipientLabel(v){ return {ticket_owner:'صاحب التذكرة',customer:'العميل',admin_team:'لوحة الإدارة',customer_portal:'لوحة العميل'}[v]||v; }
function unitLabel(v){ return {minutes:'دقيقة',hours:'ساعة',days:'يوم'}[v]||v; }

function renderNodeCard(node, opts={}){
  const nt = NODE_TYPES[node.type];
  if(!nt) return '';
  const icon = KEY_ICON[node.type] || 'i-zap';
  const soft = colorSoft(nt.color);
  const style = `--node-color:${nt.color}; --node-color-soft:${soft}`;
  const selected = currentNodeId===node.id ? 'selected' : '';
  const delay = (opts.delayIndex||0) * 40;
  return `
    <div class="node ${selected}" style="${style}; animation-delay:${delay}ms" onclick="selectNode('${node.id}')" id="canvasnode-${node.id}">
      <div class="node-top">
        <span class="node-kicker"><svg class="icon icon-sm"><use href="#${icon}"/></svg> ${CATEGORY_META[nt.category]?.label || nt.category}</span>
        <button class="node-menu-btn" onclick="event.stopPropagation()"><svg class="icon icon-sm"><use href="#i-more-vertical"/></svg></button>
      </div>
      <div class="node-main">
        <div class="node-icon"><svg class="icon"><use href="#${icon}"/></svg></div>
        <div class="node-text">
          <div class="node-title">${nt.name_ar}</div>
          <div class="node-sub">${nodeSummaryLine(node)}</div>
        </div>
      </div>
    </div>`;
}

function buildSummaryText(){
  const nodes = WORKFLOW.definition.nodes||[];
  const trigger = nodes.find(n=>n.type.startsWith('trigger.'));
  const cond = nodes.find(n=>n.type.startsWith('condition.'));
  const email = nodes.find(n=>n.type==='action.send_email');
  const wait = nodes.find(n=>n.type==='delay.wait');
  const notify = nodes.find(n=>n.type==='action.send_notification');
  let s = `هذا التدفق يعمل عند <b>${trigger?NODE_TYPES[trigger.type]?.name_ar:'—'}</b>`;
  if(cond) s += `، وإن كانت ${fieldLabel(cond.config.variable)} <b>${valueLabel(cond.config.value)}</b>`;
  if(email) s += ` فإنه يرسل بريدًا إلكترونيًا لـ<b>${recipientLabel(email.config.to)}</b>`;
  if(wait) s += `، وينتظر <b>${wait.config.duration_value} ${unitLabel(wait.config.duration_unit)}</b>`;
  if(notify) s += `، ثم ينبّه <b>${recipientLabel(notify.config.user_id)}</b>`;
  return s + '.';
}

function renderCanvas(){
  const nodes = WORKFLOW.definition.nodes||[];
  const trigger = nodes.find(n=>n.type.startsWith('trigger.'));
  const cond = nodes.find(n=>n.type.startsWith('condition.'));
  const yesChain = [];
  if(cond){
    let cur = edgesFrom(cond.id).find(e=>e.branch==='yes');
    while(cur){
      const n = nodeById(cur.target);
      if(!n) break;
      yesChain.push(n);
      const next = edgesFrom(n.id)[0];
      cur = next;
    }
  }

  let html = `
    <div class="flow-summary">
      <div class="icon-wrap"><svg class="icon"><use href="#i-info"/></svg></div>
      <p>${buildSummaryText()}</p>
    </div>`;

  if(trigger){
    html += renderNodeCard(trigger, {delayIndex:0});
    html += `<div class="connector"></div><div class="add-step-btn"><svg class="icon icon-sm"><use href="#i-plus"/></svg></div><div class="connector"></div>`;
  }
  if(cond){
    html += renderNodeCard(cond, {delayIndex:1});
    html += `<div class="connector"></div>`;
    html += `<div class="branch-wrap">`;
    html += `<div class="branch-col"><span class="branch-label branch-yes">نعم، تنطبق</span><div class="connector"></div>`;
    yesChain.forEach((n,i)=>{
      html += renderNodeCard(n, {delayIndex:2+i});
      html += `<div class="connector"></div>`;
    });
    html += `<div class="flow-end"><svg class="icon icon-sm"><use href="#i-check"/></svg> نهاية المسار</div></div>`;
    html += `<div class="branch-col"><span class="branch-label branch-no">لا، لا تنطبق</span><div class="connector"></div>`;
    html += `<div class="flow-end"><svg class="icon icon-sm"><use href="#i-check"/></svg> إيقاف التدفق</div></div>`;
    html += `</div>`;
  }

  document.getElementById('canvasInner').innerHTML = html;
}

function getStepsFor(node){
  if(node.type === 'delay.wait') return UI_STEPS['delay.wait'];
  return UI_STEPS[node.type] || null;
}

function selectNode(id){
  currentNodeId = id;
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));
  const el = document.getElementById('canvasnode-'+id);
  if(el) el.classList.add('selected');
  window.__editingIdx = null;
  renderInspector();
}

function getAnsweredCount(node, steps){
  const c = node.config || {};
  let count = 0;
  for(const s of steps){
    const val = s.id==='__duration' ? (c.duration_value!==undefined) : (c[s.id] !== undefined && c[s.id] !== '');
    if(val) count++; else break;
  }
  return count;
}

function renderInspector(){
  const node = nodeById(currentNodeId);
  if(!node){ closeInspector(); return; }
  const nt = NODE_TYPES[node.type];
  const icon = KEY_ICON[node.type] || 'i-zap';
  const soft = colorSoft(nt.color);
  const panel = document.getElementById('inspectorPanel');

  let bodyHtml;
  if(node.type === 'condition.if_else'){
    bodyHtml = renderConditionBuilder(node, nt);
  } else {
    const steps = getStepsFor(node) || [];
    const answeredCount = window.__editingIdx!=null ? window.__editingIdx : getAnsweredCount(node, steps);
    bodyHtml = steps.map((step, idx)=>{
      if(window.__editingIdx===idx) return renderActiveStep(node, step, idx, nt);
      if(idx < answeredCount) return renderDoneStep(node, step, idx);
      if(window.__editingIdx==null && idx===answeredCount) return renderActiveStep(node, step, idx, nt);
      return `<div class="qstep pending"><div class="qtitle"><span class="qnum" style="background:${soft};color:${nt.color}">${idx+1}</span>${step.question}</div></div>`;
    }).join('');
  }

  panel.innerHTML = `
    <div class="inspector-head">
      <button class="back-btn" onclick="closeInspector()"><svg class="icon icon-sm"><use href="#i-chevron-right"/></svg></button>
      <div class="inspector-head-icon" style="background:${soft}; color:${nt.color}"><svg class="icon"><use href="#${icon}"/></svg></div>
      <div class="inspector-head-text">
        <h3>${nt.name_ar}</h3>
        <p>${CATEGORY_META[nt.category]?.label || nt.category}</p>
      </div>
    </div>
    <div class="inspector-scroll">${bodyHtml}</div>
    <div class="inspector-footer">
      <button class="btn" onclick="closeInspector()">إلغاء</button>
      <button class="btn btn-primary" onclick="closeInspector()"><svg class="icon icon-sm"><use href="#i-check"/></svg> تم</button>
    </div>`;
}

function renderDoneStep(node, step, idx){
  const c = node.config || {};
  let displayVal;
  if(step.type==='select-list'){ const o=step.options.find(o=>o.value===c[step.id]); displayVal=o?o.title:c[step.id]; }
  else if(step.type==='choice-grid'){ const o=step.options.find(o=>o.value===c[step.id]); displayVal=o?o.title:c[step.id]; }
  else if(step.type==='chip-select'){ const o=step.options.find(o=>o.value===c[step.id]); displayVal=o?o.label:c[step.id]; }
  else if(step.type==='number-unit'){ displayVal = `${c.duration_value} ${unitLabel(c.duration_unit)}`; }
  else if(step.type==='richtext'){ displayVal = c[step.id] ? (c[step.id].length>34? c[step.id].slice(0,34)+'…' : c[step.id]) : 'بدون نص بعد'; }
  else displayVal = c[step.id];

  return `
    <div class="qstep done">
      <div class="qdone-row">
        <div><div class="qdone-label">${step.question}</div><div class="qdone-value">${displayVal||'—'}</div></div>
        <span class="edit-link" onclick="window.__editingIdx=${idx}; renderInspector()"><svg class="icon icon-sm"><use href="#i-pencil"/></svg> تعديل</span>
      </div>
    </div>`;
}

function renderActiveStep(node, step, idx, nt){
  const c = node.config || (node.config = {});
  let inputHtml = '';

  if(step.type === 'select-list'){
    inputHtml = `<div class="select-list">${step.options.map(o=>`
      <div class="select-row ${c[step.id]===o.value?'picked':''}" onclick="setAnswer('${step.id}','${o.value}')">
        <div class="radio"></div>
        <div class="select-row-text"><div class="select-row-title">${o.title}</div>${o.sub?`<div class="select-row-sub">${o.sub}</div>`:''}</div>
      </div>`).join('')}</div>`;
  } else if(step.type === 'choice-grid'){
    inputHtml = `<div class="choice-grid">${step.options.map(o=>`
      <div class="choice-card ${c[step.id]===o.value?'picked':''}" onclick="setAnswer('${step.id}','${o.value}')">
        <svg class="icon"><use href="#${o.icon}"/></svg><span>${o.title}</span>
      </div>`).join('')}</div>`;
  } else if(step.type === 'chip-select'){
    inputHtml = `<div class="chip-select">${step.options.map(o=>`
      <div class="chip-option ${c[step.id]===o.value?'picked':''}" onclick="setAnswer('${step.id}','${o.value}')">
        ${o.color?`<span class="dot" style="background:${o.color}"></span>`:''}${o.label}
      </div>`).join('')}</div>`;
  } else if(step.type === 'number-unit'){
    const n = c.duration_value ?? 30, unit = c.duration_unit ?? 'minutes';
    inputHtml = `
      <div class="number-unit-row">
        <input type="number" class="number-input" value="${n}" oninput="setAnswer('duration_value', Number(this.value), true)">
        <div class="unit-toggle">${step.unitOptions.map(u=>`<div class="unit-btn ${unit===u.v?'picked':''}" onclick="setAnswer('duration_unit','${u.v}')">${u.l}</div>`).join('')}</div>
      </div>`;
  } else if(step.type === 'text-insert'){
    const val = c[step.id] || '';
    inputHtml = `
      <div class="field-with-insert">
        <input type="text" class="text-input" placeholder="${step.placeholder||''}" value="${val}" oninput="setAnswer('${step.id}', this.value, true)">
        <div class="insert-btn" onclick="toggleInsertPopover(this)"><svg class="icon icon-sm"><use href="#i-plus"/></svg> إدراج بيانات من التذكرة</div>
        ${renderInsertPopoverHtml(step.id)}
      </div>`;
  } else if(step.type === 'richtext'){
    const val = c[step.id] || '';
    inputHtml = `
      <div class="field-with-insert">
        <textarea class="textarea-input" placeholder="${step.placeholder||''}" oninput="setAnswer('${step.id}', this.value, true)">${val}</textarea>
        <div class="rich-toolbar">
          <button><svg class="icon icon-sm"><use href="#i-bold"/></svg></button>
          <button><svg class="icon icon-sm"><use href="#i-list"/></svg></button>
        </div>
        <div class="insert-btn" onclick="toggleInsertPopover(this)"><svg class="icon icon-sm"><use href="#i-plus"/></svg> إدراج بيانات من التذكرة</div>
        ${renderInsertPopoverHtml(step.id)}
      </div>`;
  }

  const soft = colorSoft(nt.color);
  return `
    <div class="qstep active" style="--node-color:${nt.color}; --node-color-soft:${soft}">
      <div class="qtitle"><span class="qnum" style="background:${soft};color:${nt.color}">${idx+1}</span>${step.question}</div>
      <div class="field-group">${inputHtml}</div>
    </div>`;
}

function renderInsertPopoverHtml(stepId){
  return `
    <div class="insert-popover" style="display:none" id="popover-${stepId}">
      <div class="search-box"><svg class="icon icon-sm"><use href="#i-search"/></svg><input placeholder="ابحث..."></div>
      ${DATA_FIELDS.map(g=>`
        <div class="insert-group">
          <div class="insert-group-title"><svg class="icon icon-sm"><use href="#${g.icon}"/></svg> ${g.group}</div>
          ${g.items.map(item=>`<div class="insert-option" onclick="insertField('${stepId}','${item}')">${item}</div>`).join('')}
        </div>`).join('')}
    </div>`;
}
function toggleInsertPopover(btn){
  document.querySelectorAll('.insert-popover').forEach(p=>{ if(p !== btn.closest('.field-with-insert')?.querySelector('.insert-popover')) p.style.display='none'; });
  const pop = btn.closest('.field-with-insert').querySelector('.insert-popover');
  pop.style.display = pop.style.display==='none' ? 'block' : 'none';
}
function insertField(stepId, fieldName){
  const input = document.querySelector(`#inspectorPanel [oninput*="'${stepId}'"]`);
  if(input){ input.value += ` [${fieldName}]`; input.dispatchEvent(new Event('input')); }
  const pop = document.getElementById(`popover-${stepId}`);
  if(pop) pop.style.display='none';
}

function setAnswer(key, value, skipAdvance){
  const node = nodeById(currentNodeId);
  node.config[key] = value;
  if(!skipAdvance){ window.__editingIdx = null; }
  renderInspector();
  renderCanvas();
  if(document.getElementById('canvasnode-'+currentNodeId)) document.getElementById('canvasnode-'+currentNodeId).classList.add('selected');
}

/* condition builder (kept as a dedicated small UI, same engine spirit) */
function renderConditionBuilder(node, nt){
  const c = node.config || (node.config = {});
  const fieldOptions = [
    {v:'ticket.priority', l:'الأولوية'}, {v:'ticket.category', l:'نوع التذكرة'},
    {v:'ticket.department', l:'القسم'}, {v:'ticket.status', l:'الحالة'},
  ];
  const opOptions = [{v:'equals',l:'تساوي'},{v:'not_equals',l:'لا تساوي'},{v:'contains',l:'تحتوي على'}];
  const valOptions = ['urgent','high','medium','low'];
  const soft = colorSoft(nt.color);
  return `
    <div class="qstep active" style="--node-color:${nt.color}; --node-color-soft:${soft}">
      <div class="qtitle"><span class="qnum" style="background:${soft};color:${nt.color}">1</span>على أي أساس تريد التقسيم؟</div>
      <div class="qhelp">التدفق سيسير في مسار "نعم" إذا تحقق الشرط، وإلا سيتوقف في مسار "لا"</div>
      <div class="field-group">
        <div class="cond-row">
          <select class="cond-select" onchange="setAnswer('variable', this.value, true)">
            ${fieldOptions.map(f=>`<option value="${f.v}" ${c.variable===f.v?'selected':''}>${f.l}</option>`).join('')}
          </select>
          <select class="cond-select" style="flex:0 0 100px" onchange="setAnswer('operator', this.value, true)">
            ${opOptions.map(o=>`<option value="${o.v}" ${c.operator===o.v?'selected':''}>${o.l}</option>`).join('')}
          </select>
          <select class="cond-select" onchange="setAnswer('value', this.value, true)">
            ${valOptions.map(v=>`<option value="${v}" ${c.value===v?'selected':''}>${priorityLabel(v)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;
}

function closeInspector(){
  currentNodeId = null;
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));
  document.getElementById('inspectorPanel').innerHTML = `
    <div class="inspector-empty">
      <div class="icon-wrap"><svg class="icon icon-lg"><use href="#i-mouse-pointer"/></svg></div>
      <p>اضغط على أي خطوة في التدفق<br>لعرض تفاصيلها وتعديلها هنا</p>
    </div>`;
}

function addNodeFromLibrary(key){
  // demo scope: opens/selects rather than mutating the live showcase row
  const nodes = WORKFLOW.definition.nodes||[];
  const existing = nodes.find(n=>n.type===key);
  if(existing){ selectNode(existing.id); return; }
  selectNode(nodes[0]?.id);
}

boot();
</script>
