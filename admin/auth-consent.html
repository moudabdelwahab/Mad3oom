<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلب ربط تطبيق خارجي - مدعوم</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--color-background,#f5f5f5); margin:0; font-family:'Cairo', sans-serif; }
    .box { background:#fff; max-width:440px; width:92%; border-radius:1rem; padding:2rem; box-shadow:0 8px 30px rgba(0,0,0,.12); }
    .box h1 { font-size:1.15rem; margin:0 0 .5rem; }
    .box p { color:#555; font-size:.9rem; line-height:1.6; }
    .client-name { color:#111; }
    .scope-list { margin:1rem 0; padding:.75rem 1rem; background:#f3f4f6; border-radius:.6rem; font-size:.85rem; }
    .scope-list .scope-item { display:flex; align-items:center; gap:.5rem; padding:.25rem 0; }
    .scope-list .scope-item::before { content:"✓"; color:#16a34a; font-weight:800; }
    .scope-list code { direction:ltr; font-family:'Consolas','Monaco',monospace; font-size:.8rem; color:#334155; }
    .actions { display:flex; gap:.75rem; margin-top:1.5rem; }
    button { flex:1; padding:.75rem; border:none; border-radius:.6rem; font-weight:700; cursor:pointer; font-family:inherit; font-size:.92rem; transition:opacity .15s; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .approve { background:#16a34a; color:#fff; }
    .deny { background:#f1f5f9; color:#334155; }
    .loading, .error { text-align:center; padding:2rem 0; color:#666; }
    .error { color:#b91c1c; }
    .spinner { width:28px; height:28px; border:3px solid #e5e7eb; border-top-color:#1677FF; border-radius:50%; margin:0 auto 1rem; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box" id="box"><div class="spinner"></div><div class="loading">جاري التحقق من الجلسة...</div></div>

  <script type="module">
    import { supabase } from '/api-config.js';
    import { checkAdminAuth } from '/assets/js/admin/auth.js';

    // مفتاح مؤقت في sessionStorage يُستخدم فقط بواسطة هذه الصفحة - login.html يقرأه (لو موجود)
    // بعد نجاح الدخول ليُرجع المستخدم هنا بدل اللوحة الافتراضية. لا يؤثر على أي تدفق تسجيل دخول آخر
    // لأنه لا يُكتب إلا من هنا، ويُمسح بمجرد استخدامه.
    const POST_LOGIN_REDIRECT_KEY = 'mad3oom_post_login_redirect';

    const box = document.getElementById('box');
    const params = new URLSearchParams(window.location.search);
    const payload = {
      client_id: params.get('client_id'),
      redirect_uri: params.get('redirect_uri'),
      scope: params.get('scope') || '',
      state: params.get('state') || '',
      code_challenge: params.get('code_challenge'),
      code_challenge_method: params.get('code_challenge_method') || 'S256',
    };

    function showError(message) {
      box.innerHTML = `<div class="error">${message}</div>`;
    }

    if (!payload.client_id || !payload.redirect_uri || !payload.code_challenge) {
      showError('رابط غير صالح - بيانات ناقصة. أعد المحاولة من التطبيق الخارجي.');
      throw new Error('missing oauth params');
    }

    async function callApprove(action) {
      const { data, error } = await supabase.functions.invoke('oauth-authorize-approve', { body: { ...payload, action } });
      if (error) throw new Error(error.message);
      if (data?.error) throw new Error(data.error);
      return data;
    }

    async function init() {
      // نحفظ رابط العودة الحالي (بكل query params الخاصة بالـ OAuth) قبل أي تحقق من الجلسة.
      // لو المستخدم مش مسجّل دخول، checkAdminAuth() هيحوّله فورًا لـ /login.html بدون أي معامل،
      // فلازم تكون الوجهة محفوظة قبل ما الصفحة تتغيّر.
      sessionStorage.setItem(POST_LOGIN_REDIRECT_KEY, window.location.pathname + window.location.search);

      const user = await checkAdminAuth(); // نفس دالة تسجيل الدخول المستخدمة في mcp.html بدون أي تعديل
      if (!user) return; // checkAdminAuth تكفّلت بالتحويل لصفحة تسجيل الدخول

      // وصلنا هنا يعني فيه جلسة صالحة فعلاً - نمسح المفتاح المؤقت فورًا عشان ميتسببش
      // في تحويل غير متوقع لاحقًا لو المستخدم سجّل دخول من مكان تاني.
      sessionStorage.removeItem(POST_LOGIN_REDIRECT_KEY);

      const info = await callApprove('info');
      box.innerHTML = `
        <h1>طلب ربط تطبيق خارجي</h1>
        <p><strong class="client-name">${escapeHtml(info.client_name)}</strong> يطلب الوصول إلى حسابك على منصة مدعوم بالصلاحيات التالية:</p>
        <div class="scope-list">${info.scopes.map((s) => `<div class="scope-item"><code>${escapeHtml(s)}</code></div>`).join('')}</div>
        <p>تقدر توافق أو ترفض هذا الطلب. لو مش متأكد من مصدر هذا التطبيق، الأفضل الرفض.</p>
        <div class="actions">
          <button class="deny" id="denyBtn">رفض</button>
          <button class="approve" id="approveBtn">موافقة والمتابعة</button>
        </div>`;

      document.getElementById('approveBtn').onclick = async (e) => {
        const btn = e.target;
        btn.disabled = true; btn.textContent = 'جاري التحويل...';
        document.getElementById('denyBtn').disabled = true;
        try {
          const res = await callApprove('approve');
          window.location.href = res.redirect_to;
        } catch (err) {
          showError(err.message || 'فشلت الموافقة - حاول مرة أخرى.');
        }
      };
      document.getElementById('denyBtn').onclick = async (e) => {
        const btn = e.target;
        btn.disabled = true;
        document.getElementById('approveBtn').disabled = true;
        try {
          const res = await callApprove('deny');
          window.location.href = res.redirect_to;
        } catch (err) {
          showError(err.message || 'حدث خطأ - حاول مرة أخرى.');
        }
      };
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    init().catch((err) => showError(err.message || 'حدث خطأ غير متوقع.'));
  </script>
</body>
</html>
