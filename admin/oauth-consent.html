<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>طلب ربط تطبيق خارجي - مدعوم</title>
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* هوية مدعوم: الأزرق المؤسسي من styles.css، لا ألوان خارجه.
       كل قيمة لها fallback حتى لا تنهار الصفحة لو حُمّلت قبل الـstylesheet. */
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 1.5rem;
      background: var(--color-background, #F5F5F5);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--color-text, #333);
    }

    .box {
      background: var(--color-surface, #fff);
      max-width: 30rem; width: 100%;
      border-radius: 1rem; overflow: hidden;
      box-shadow: var(--shadow, 0 10px 30px rgba(0,0,0,.1));
      border: 1px solid var(--color-border, #ddd);
    }

    /* ترويسة بالأزرق المؤسسي — أول ما تراه العين يقول «هذه مدعوم». */
    .oc-head {
      background: var(--color-primary, #003366);
      color: #fff; padding: 1.5rem 1.5rem 1.35rem;
      display: flex; align-items: center; gap: .85rem;
    }
    .oc-logo {
      width: 2.75rem; height: 2.75rem; border-radius: .7rem;
      background: #fff; padding: .35rem; box-sizing: border-box;
      object-fit: contain; flex: 0 0 auto;
    }
    .oc-head h1 { font-size: 1.05rem; margin: 0 0 .15rem; font-weight: 700; }
    .oc-head p { margin: 0; font-size: .82rem; opacity: .85; }

    .oc-body { padding: 1.35rem 1.5rem; }

    .oc-app {
      display: flex; align-items: center; gap: .6rem;
      padding: .8rem .9rem; margin-bottom: 1.1rem;
      background: var(--color-muted, #eee); border-radius: .7rem;
      font-size: .9rem; line-height: 1.6;
    }
    .oc-app strong { color: var(--color-primary, #003366); }
    .oc-app-ic {
      width: 2rem; height: 2rem; flex: 0 0 auto; border-radius: .5rem;
      background: var(--color-accent, #0077CC); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .95rem;
    }

    /* تحذير الصلاحيات المرتفعة: أعلى الشاشة لا مدفونًا في قائمة. */
    .oc-warn {
      display: flex; gap: .6rem; padding: .85rem .9rem; margin-bottom: 1.1rem;
      border: 1px solid var(--color-warning, #E0A800); border-radius: .7rem;
      background: rgba(224, 168, 0, .09);
      font-size: .84rem; line-height: 1.65;
    }
    .oc-warn svg { flex: 0 0 auto; color: var(--color-warning, #E0A800); margin-top: .1rem; }
    .oc-warn b { display: block; margin-bottom: .15rem; color: var(--color-text, #333); }

    .oc-sec {
      margin: 0 0 .5rem; font-size: .78rem; font-weight: 700;
      color: var(--color-text-secondary, #777);
    }

    .oc-group { margin-bottom: .9rem; }
    .oc-group-t {
      font-size: .82rem; font-weight: 700; margin-bottom: .35rem;
      color: var(--color-primary, #003366);
    }
    .oc-list { list-style: none; margin: 0; padding: 0; }
    .oc-item {
      display: flex; align-items: flex-start; gap: .55rem;
      padding: .32rem 0; font-size: .85rem; line-height: 1.55;
      cursor: pointer;
    }
    .oc-item input {
      flex: 0 0 auto; margin: .22rem 0 0; width: 1rem; height: 1rem;
      accent-color: var(--color-accent, #0077CC); cursor: pointer;
    }
    .oc-item.danger input { accent-color: var(--color-danger, #D9534F); }
    .oc-item.danger { font-weight: 600; }
    .oc-item svg { flex: 0 0 auto; margin-top: .28rem; color: var(--color-danger, #D9534F); }
    /* صلاحية غير محدَّدة تبهت، ليُرى بالنظرة ما سيُمنَح وما لن يُمنَح. */
    .oc-item:has(input:not(:checked)) { opacity: .5; }

    .oc-bulk {
      display: flex; gap: .5rem; align-items: center;
      margin: 0 0 .7rem; font-size: .78rem;
    }
    .oc-bulk button {
      background: none; border: none; padding: 0; cursor: pointer;
      color: var(--color-accent, #0077CC); font-family: inherit;
      font-size: .78rem; font-weight: 600; text-decoration: underline;
    }
    .oc-bulk span { color: var(--color-border, #ddd); }
    .oc-count {
      margin-inline-start: auto; color: var(--color-text-secondary, #777);
      font-weight: 600; text-decoration: none;
    }
    /* مفتاح تقني لا نعرف له اسمًا عربيًا — يُعرض كما هو، لا يُخفى. */
    .oc-item code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .8rem; background: var(--color-muted, #eee);
      padding: .05rem .3rem; border-radius: .3rem; direction: ltr;
    }
    .oc-raw-note { font-size: .76rem; color: var(--color-text-secondary, #777); margin: .2rem 0 0; }

    .oc-foot {
      padding: 1.1rem 1.5rem 1.35rem;
      border-top: 1px solid var(--color-border, #ddd);
      background: var(--color-background, #F5F5F5);
    }
    .oc-note {
      font-size: .78rem; color: var(--color-text-secondary, #777);
      margin: 0 0 .85rem; line-height: 1.6;
    }
    .oc-err {
      margin: 0 0 .7rem; padding: .6rem .75rem; border-radius: .5rem;
      background: rgba(217, 83, 79, .1);
      border: 1px solid var(--color-danger, #D9534F);
      color: var(--color-danger, #D9534F);
      font-size: .8rem; line-height: 1.55;
    }
    .oc-actions { display: flex; gap: .7rem; }
    .oc-actions button {
      flex: 1; padding: .72rem; border: 1px solid transparent;
      border-radius: .6rem; font-weight: 700; font-size: .88rem;
      font-family: inherit; cursor: pointer; transition: background .15s, opacity .15s;
    }
    .oc-approve { background: var(--color-accent, #0077CC); color: #fff; }
    .oc-approve:hover:not(:disabled) { background: var(--color-accent-hover, #0055AA); }
    .oc-deny {
      background: var(--color-surface, #fff); color: var(--color-text, #333);
      border-color: var(--color-border, #ddd);
    }
    .oc-deny:hover:not(:disabled) { background: var(--color-muted, #eee); }
    .oc-actions button:disabled { opacity: .6; cursor: progress; }

    .oc-state { text-align: center; padding: 3rem 1.5rem; color: var(--color-text-secondary, #777); font-size: .9rem; }
    .oc-state.error { color: var(--color-danger, #D9534F); }
    .oc-spin {
      width: 1.6rem; height: 1.6rem; margin: 0 auto .8rem;
      border: 2px solid var(--color-border, #ddd);
      border-top-color: var(--color-accent, #0077CC);
      border-radius: 50%; animation: oc-rot .7s linear infinite;
    }
    @keyframes oc-rot { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .oc-spin { animation: none; } }

    @media (max-width: 30rem) {
      body { padding: 0; align-items: stretch; }
      .box { border-radius: 0; border: none; min-height: 100vh; display: flex; flex-direction: column; }
      .oc-body { flex: 1; }
    }
  </style>
  <!-- الأساس المتجاوب: يضمن عمل الصفحة على شاشات الجوال -->
  <link rel="stylesheet" href="/assets/responsive-global.css">
  <script src="/assets/responsive-global.js" defer></script>
</head>
<body>
  <div class="box" id="box">
    <div class="oc-state"><div class="oc-spin"></div>جاري التحقق من الجلسة…</div>
  </div>

  <script type="module">
    import { supabase } from '/api-config.js';
    import { checkAdminAuth } from '/assets/js/admin/auth.js';
    // أسماء الصلاحيات بالعربي تأتي من مصدر واحد قائم بالفعل، لا من قائمة
    // ثانية هنا تفترق عنه مع الوقت.
    import { describeScope } from '/assets/js/company/api-token-model.js';

    const box = document.getElementById('box');
    const params = new URLSearchParams(window.location.search);
    const payload = {
      client_id: params.get('client_id'),
      redirect_uri: params.get('redirect_uri'),
      scope: params.get('scope') || '',
      state: params.get('state') || '',
      code_challenge: params.get('code_challenge'),
      code_challenge_method: params.get('code_challenge_method') || 'S256',
    };

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const ICON_OK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    const ICON_WARN = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
    const ICON_WARN_LG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';

    function showState(html, isError) {
      box.innerHTML = `<div class="oc-state${isError ? ' error' : ''}">${html}</div>`;
    }

    if (!payload.client_id || !payload.redirect_uri || !payload.code_challenge) {
      showState('رابط غير صالح — بيانات الطلب ناقصة.', true);
      throw new Error('missing params');
    }

    async function callApprove(action, extra = {}) {
      const { data, error } = await supabase.functions.invoke('oauth-authorize-approve', { body: { ...payload, action, ...extra } });
      if (error) throw new Error(error.message);
      if (data?.error) throw new Error(data.error);
      return data;
    }

    /** الصلاحيات المحدَّدة الآن. الخادم يتقاطعها مع ما طلبه التطبيق فعلًا. */
    function selectedScopes() {
      return [...document.querySelectorAll('.oc-cb:checked')].map((cb) => cb.value);
    }

    /**
     * يبني قائمة الصلاحيات مبوّبة بالعربي.
     *
     * لا يُحذف أي مفتاح: ما لا نعرف له اسمًا عربيًا يظهر بمفتاحه التقني
     * تحت «صلاحيات أخرى». شاشة موافقة تُخفي ما تمنحه هي شاشة تكذب.
     */
    function renderScopes(scopes, defaultChecked) {
      const groups = new Map();
      let unknownCount = 0;

      for (const key of scopes) {
        const d = describeScope(key);
        if (!d.known) unknownCount += 1;
        const groupName = d.group || 'صلاحيات أخرى';
        if (!groups.has(groupName)) groups.set(groupName, []);
        groups.get(groupName).push(d);
      }

      // الصلاحيات المرتفعة أولًا — هي ما يجب أن تُقرأ، لا ما يُمرَّر عليه.
      const ordered = [...groups.entries()].sort((a, b) => {
        const aHi = a[1].some((d) => d.privileged) ? 0 : 1;
        const bHi = b[1].some((d) => d.privileged) ? 0 : 1;
        return aHi - bHi;
      });

      const html = ordered.map(([groupName, items]) => `
        <div class="oc-group">
          <div class="oc-group-t">${esc(groupName)}</div>
          <ul class="oc-list">
            ${items.map((d) => `
              <li class="oc-item${d.danger ? ' danger' : ''}">
                <input type="checkbox" class="oc-cb" value="${esc(d.key)}"
                       ${defaultChecked.has(d.key) ? 'checked' : ''}
                       aria-label="${esc(d.known ? d.label : d.key)}">
                ${d.danger ? ICON_WARN : ''}
                <span>${d.known ? esc(d.label) : `<code>${esc(d.key)}</code>`}</span>
              </li>`).join('')}
          </ul>
        </div>`).join('');

      return {
        html,
        unknownCount,
        privileged: scopes.map(describeScope).filter((d) => d.privileged),
      };
    }

    async function init() {
      // يعيد التوجيه لتسجيل الدخول تلقائيًا لو مفيش جلسة (نفس سلوك mcp.html)
      const user = await checkAdminAuth();
      if (!user) return;

      showState('<div class="oc-spin"></div>جاري قراءة طلب التطبيق…');
      const info = await callApprove('info');

      const scopes = Array.isArray(info.scopes) ? info.scopes : [];

      // الافتراضي: كل ما طُلب **عدا** المرتفع. الخادم يرسل default_scopes؛
      // ولو كان منشورًا بنسخة أقدم لا ترسله، نشتقّه هنا بنفس القاعدة بدل
      // أن نرجع صامتين إلى «حدِّد كل شيء».
      const defaultChecked = new Set(
        Array.isArray(info.default_scopes)
          ? info.default_scopes
          : scopes.filter((s) => !describeScope(s).privileged),
      );
      const { html: scopesHtml, unknownCount, privileged } = renderScopes(scopes, defaultChecked);
      const appName = info.client_name || 'تطبيق غير مُسمّى';
      const initial = esc(appName.trim().charAt(0).toUpperCase() || '?');

      const warnHtml = privileged.length ? `
        <div class="oc-warn">
          ${ICON_WARN_LG}
          <div>
            <b>هذا الطلب يشمل صلاحيات مرتفعة</b>
            الموافقة تمنح <strong>${esc(appName)}</strong> ${privileged.length === 1 ? 'صلاحية' : `${privileged.length} صلاحيات`}
            تتجاوز القراءة والكتابة العادية. لا توافق إلا إذا كنت أنت من بدأ هذا الربط وتثق بالتطبيق.
          </div>
        </div>` : '';

      box.innerHTML = `
        <div class="oc-head">
          <img class="oc-logo" src="/assets/images/logo.png" alt="مدعوم">
          <div>
            <h1>طلب ربط تطبيق خارجي</h1>
            <p>راجع الصلاحيات قبل الموافقة</p>
          </div>
        </div>

        <div class="oc-body">
          <div class="oc-app">
            <span class="oc-app-ic">${initial}</span>
            <span><strong>${esc(appName)}</strong> يطلب الوصول إلى حسابك على مدعوم.</span>
          </div>

          ${warnHtml}

          <p class="oc-sec">اختر ما تمنحه للتطبيق:</p>
          ${scopes.length ? `
            <div class="oc-bulk">
              <button type="button" id="selAll">تحديد الكل</button>
              <span>|</span>
              <button type="button" id="selNone">إلغاء الكل</button>
              <span class="oc-count" id="selCount"></span>
            </div>` : ''}
          ${scopesHtml || '<p class="oc-raw-note">لم يطلب التطبيق أي صلاحية.</p>'}
          ${unknownCount ? '<p class="oc-raw-note">الصلاحيات المعروضة بمفتاحها التقني ليس لها وصف بالعربي بعد — وهي تُمنَح فعلًا عند الموافقة.</p>' : ''}
        </div>

        <div class="oc-foot">
          <p class="oc-err" id="ocErr" hidden></p>
          <p class="oc-note">يمكنك سحب هذا الربط في أي وقت من إعدادات حسابك. الرفض يعيدك إلى التطبيق بلا منح أي صلاحية.</p>
          <div class="oc-actions">
            <button class="oc-deny" id="denyBtn" type="button">رفض</button>
            <button class="oc-approve" id="approveBtn" type="button">موافقة والمتابعة</button>
          </div>
        </div>`;

      const approveBtn = document.getElementById('approveBtn');
      const denyBtn = document.getElementById('denyBtn');
      const countEl = document.getElementById('selCount');
      const errEl = document.getElementById('ocErr');

      function showInlineError(msg) {
        if (!errEl) return;
        errEl.textContent = msg;
        errEl.hidden = false;
      }

      // العدّاد وحالة زر الموافقة يتبعان التحديد: منح صفر صلاحية ليس
      // موافقة، والخادم يرفضه أصلًا — فالأوضح ألا يكون الزر قابلًا للضغط.
      function syncSelection() {
        const n = selectedScopes().length;
        if (countEl) countEl.textContent = `${n} من ${scopes.length}`;
        approveBtn.disabled = n === 0;
        approveBtn.title = n === 0 ? 'اختر صلاحية واحدة على الأقل' : '';
      }

      document.querySelectorAll('.oc-cb').forEach((cb) => cb.addEventListener('change', syncSelection));
      document.getElementById('selAll')?.addEventListener('click', () => {
        document.querySelectorAll('.oc-cb').forEach((cb) => { cb.checked = true; });
        syncSelection();
      });
      document.getElementById('selNone')?.addEventListener('click', () => {
        document.querySelectorAll('.oc-cb').forEach((cb) => { cb.checked = false; });
        syncSelection();
      });
      syncSelection();

      approveBtn.onclick = async () => {
        const granted = selectedScopes();
        if (!granted.length) return;
        if (errEl) errEl.hidden = true;
        approveBtn.disabled = true; denyBtn.disabled = true;
        approveBtn.textContent = 'جاري التحويل…';
        try {
          const res = await callApprove('approve', { granted_scopes: granted });
          window.location.href = res.redirect_to;
        } catch (err) {
          // إعادة تمكين الأزرار: زر معطّل بلا رسالة يترك المستخدم عالقًا.
          // الخطأ يُعرَض داخل البطاقة لا بدلها: استبدال الصفحة كان يترك
          // المستخدم أمام رسالة بلا أي طريق للمحاولة ثانية أو للرفض.
          denyBtn.disabled = false;
          approveBtn.textContent = 'موافقة والمتابعة';
          syncSelection();
          showInlineError(err.message || 'تعذّر إتمام الموافقة.');
        }
      };

      denyBtn.onclick = async () => {
        if (errEl) errEl.hidden = true;
        approveBtn.disabled = true; denyBtn.disabled = true;
        denyBtn.textContent = 'جاري الرفض…';
        try {
          const res = await callApprove('deny');
          window.location.href = res.redirect_to;
        } catch (err) {
          denyBtn.disabled = false;
          denyBtn.textContent = 'رفض';
          syncSelection();
          showInlineError(err.message || 'تعذّر إتمام الرفض.');
        }
      };
    }

    init().catch((err) => showState(esc(err.message || 'حدث خطأ غير متوقع.'), true));
  </script>
</body>
</html>
