<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق البريد - لوحة الإدارة</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .mailbox-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 1.25rem;
            align-items: start;
        }
        @media (max-width: 900px) {
            .mailbox-layout { grid-template-columns: 1fr; }
        }
        .mailbox-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .mailbox-tab {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            background: var(--input-bg);
            color: var(--color-text);
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .mailbox-tab.active {
            background: var(--color-primary, #007bff);
            color: #fff;
            border-color: var(--color-primary, #007bff);
        }
        .mailbox-tab .badge {
            background: rgba(255,255,255,0.25);
            border-radius: 999px;
            padding: 0.05rem 0.5rem;
            font-size: 0.75em;
        }
        .mailbox-tab:not(.active) .badge {
            background: var(--color-danger, #dc3545);
            color: #fff;
        }
        .mail-list {
            max-height: 75vh;
            overflow-y: auto;
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            background: var(--input-bg);
        }
        .mail-item {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--color-border);
            cursor: pointer;
        }
        .mail-item:last-child { border-bottom: none; }
        .mail-item:hover { background: rgba(0,123,255,0.06); }
        .mail-item.selected { background: rgba(0,123,255,0.12); }
        .mail-item.unread { font-weight: 700; }
        .mail-item .mi-top {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.85em;
            color: var(--color-text-secondary, #888);
            margin-bottom: 0.25rem;
        }
        .mail-item .mi-from {
            color: var(--color-text);
            font-weight: 700;
        }
        .mail-item .mi-subject {
            font-size: 0.95em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-pill {
            display: inline-block;
            font-size: 0.75em;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-weight: 700;
        }
        .status-sent, .status-delivered { background: rgba(40,167,69,0.15); color: #28a745; }
        .status-received { background: rgba(0,123,255,0.15); color: #007bff; }
        .status-failed, .status-bounced, .status-complained { background: rgba(220,53,69,0.15); color: #dc3545; }
        .status-delayed { background: rgba(255,193,7,0.15); color: #b8860b; }

        .mail-detail {
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            background: var(--input-bg);
            padding: 1.5rem;
            min-height: 75vh;
        }
        .mail-detail-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70vh;
            color: var(--color-text-secondary, #888);
        }
        .mail-detail-header {
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .mail-detail-header h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.3em;
        }
        .mail-meta-row {
            font-size: 0.9em;
            color: var(--color-text-secondary, #888);
            margin-bottom: 0.25rem;
        }
        .mail-body-frame {
            width: 100%;
            min-height: 300px;
            border: none;
            background: #fff;
            border-radius: 0.5rem;
        }
        .mail-attachments {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .attachment-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            font-size: 0.85em;
            cursor: pointer;
            background: var(--color-bg, #f5f5f5);
        }
        .reply-box {
            margin-top: 1.5rem;
            border-top: 1px solid var(--color-border);
            padding-top: 1rem;
        }
        .reply-box textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--color-text);
            resize: vertical;
        }
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--color-text-secondary, #888);
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <header class="page-header">
            <h1>صندوق البريد</h1>
            <p>إدارة الرسائل الواردة والصادرة</p>
            <div style="margin-top: 0.75rem;">
                <a href="/admin/send-email.html" class="btn btn-secondary" style="display:inline-flex;align-items:center;gap:0.4rem;">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    رسالة جديدة
                </a>
            </div>
        </header>

        <div class="section-card">
            <div class="mailbox-tabs">
                <button class="mailbox-tab active" id="tabInbound" data-direction="inbound">
                    📥 الوارد <span class="badge" id="inboundBadge">0</span>
                </button>
                <button class="mailbox-tab" id="tabOutbound" data-direction="outbound">
                    📤 الصادر
                </button>
            </div>

            <div class="mailbox-layout">
                <div class="mail-list" id="mailList">
                    <div class="empty-state">جاري التحميل...</div>
                </div>
                <div class="mail-detail" id="mailDetail">
                    <div class="mail-detail-empty">اختر رسالة لعرض تفاصيلها</div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" style="display: none; position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--color-success); color: white; padding: 1rem 2rem; border-radius: 0.5rem; box-shadow: var(--shadow-lg); z-index: 9999; font-weight: 600; animation: slideUp 0.3s ease;"></div>

    <style>
        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>

    <script type="module" src="/assets/js/admin/mailbox.js"></script>
</body>
</html>
