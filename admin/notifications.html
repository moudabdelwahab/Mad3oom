<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات - لوحة الإدارة</title>
    <link rel="icon" type="image/png" href="/assets/images/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/robot.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <script src="/theme-manager.js"></script>
    <script src="/language-manager.js"></script>
    <script src="/error-tracker.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .notif-page-container { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }

        /* ===== Hero ===== */
        .notif-hero {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 1.75rem 2rem;
            border-radius: 1.25rem;
            color: white;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 8px 24px rgba(30, 60, 114, 0.3);
        }
        .notif-hero h1 { margin: 0 0 0.35rem 0; font-size: clamp(1.2rem, 3vw, 1.6rem); font-weight: 800; display:flex; align-items:center; gap:0.6rem; }
        .notif-hero p { margin: 0; opacity: 0.9; font-size: 0.9rem; }
        .notif-hero-stats { display: flex; gap: 0.75rem; }
        .notif-hero-stat { background: rgba(255,255,255,0.15); border-radius: 0.75rem; padding: 0.5rem 1.1rem; text-align: center; min-width: 85px; }
        .notif-hero-stat .num { font-size: 1.35rem; font-weight: 800; display: block; }
        .notif-hero-stat .lbl { font-size: 0.7rem; opacity: 0.85; }

        /* ===== Type stat cards ===== */
        .notif-type-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .notif-type-card {
            background: var(--color-surface);
            border: 1.5px solid var(--color-border);
            border-radius: 0.9rem;
            padding: 1rem 0.75rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .notif-type-card::after {
            content: '';
            position: absolute; top:0; right:0; left:0; height: 3px;
            background: var(--card-color);
            transform: scaleX(0);
            transition: transform 0.2s ease;
        }
        .notif-type-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
        .notif-type-card:hover::after, .notif-type-card.active::after { transform: scaleX(1); }
        .notif-type-card.active { border-color: var(--card-color); background: color-mix(in srgb, var(--card-color) 8%, var(--color-surface)); }
        .notif-type-icon {
            width: 38px; height: 38px; margin: 0 auto 0.5rem; border-radius: 0.65rem;
            background: color-mix(in srgb, var(--card-color) 15%, transparent);
            display: flex; align-items: center; justify-content: center;
        }
        .notif-type-count { font-size: 1.3rem; font-weight: 800; color: var(--color-text); display: block; }
        .notif-type-label { font-size: 0.75rem; color: var(--color-text-secondary); font-weight: 600; }

        /* ===== Filters ===== */
        .notif-filters-bar {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem;
            background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 1rem;
            padding: 1rem 1.25rem; margin-bottom: 1.5rem;
        }
        .notif-status-pills { display: flex; gap: 0.4rem; background: var(--color-muted); padding: 0.3rem; border-radius: 0.7rem; }
        .notif-status-pill {
            border: none; background: transparent; padding: 0.45rem 1rem; border-radius: 0.5rem;
            font-size: 0.82rem; font-weight: 700; color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s;
        }
        .notif-status-pill.active { background: var(--color-surface); color: var(--color-accent); box-shadow: var(--shadow-sm); }
        .notif-filters-extra { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
        .notif-filters-extra input {
            padding: 0.5rem 0.75rem; border-radius: 0.5rem; border: 1px solid var(--color-border);
            background: var(--color-muted); color: var(--color-text); font-family: inherit; font-size: 0.82rem;
        }
        .notif-filters-extra input[type="text"] { min-width: 180px; }

        /* ===== Master-detail layout ===== */
        .notif-layout { display: grid; grid-template-columns: 38% 1fr; gap: 1.25rem; height: 68vh; min-height: 480px; }
        .notif-list-panel, .notif-detail-panel {
            background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 1rem;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .notif-list-panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--color-border); background: var(--color-muted);
        }
        .notif-list-panel-header h3 { margin: 0; font-size: 0.9rem; }
        #notifList { flex: 1; overflow-y: auto; }
        #notifPagination { display: flex; justify-content: center; align-items: center; gap: 1rem; padding: 0.9rem; border-top: 1px solid var(--color-border); }
        #notifDetail { flex: 1; overflow: hidden; }

        .notif-day-header {
            position: sticky; top: 0; z-index: 1;
            background: var(--color-muted); color: var(--color-text-secondary);
            font-size: 0.75rem; font-weight: 700; padding: 0.5rem 1.1rem;
        }
        .notif-row {
            display: flex; gap: 0.85rem; align-items: flex-start; padding: 0.9rem 1.1rem;
            border-bottom: 1px solid var(--color-border); cursor: pointer; transition: background 0.15s;
        }
        .notif-row:hover { background: var(--hover-bg); }
        .notif-row.unread { background: rgba(24,121,197,0.06); }
        .notif-row.selected { background: color-mix(in srgb, var(--color-accent) 10%, transparent); border-right: 3px solid var(--color-accent); }
        .notif-row-icon { width: 36px; height: 36px; min-width: 36px; border-radius: 0.65rem; display: flex; align-items: center; justify-content: center; }
        .notif-row-title { font-size: 0.88rem; color: var(--color-text); }
        .notif-row-message { margin: 0.2rem 0 0; font-size: 0.8rem; color: var(--color-text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .notif-row-time { font-size: 0.7rem; color: var(--color-text-secondary); opacity: 0.8; }
        .notif-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); flex-shrink: 0; margin-top: 0.3rem; }

        @media (max-width: 900px) {
            .notif-type-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .notif-layout { grid-template-columns: 1fr; height: auto; }
            .notif-list-panel { height: 50vh; }
            .notif-detail-panel { height: 40vh; }
        }
        @media (max-width: 480px) {
            .notif-type-grid { grid-template-columns: repeat(2, 1fr); }
            .notif-hero { padding: 1.25rem; }
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div class="notif-page-container">

            <!-- Hero -->
            <div class="notif-hero">
                <div>
                    <h1>
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        مركز الإشعارات
                    </h1>
                    <p>تابع كل التنبيهات الإدارية أولاً بأول</p>
                </div>
                <div class="notif-hero-stats">
                    <div class="notif-hero-stat">
                        <span class="num" id="notifHeroUnread">0</span>
                        <span class="lbl">غير مقروءة</span>
                    </div>
                    <div class="notif-hero-stat">
                        <span class="num" id="notifHeroTotal">0</span>
                        <span class="lbl">إجمالي</span>
                    </div>
                </div>
            </div>

            <!-- Type breakdown -->
            <div class="notif-type-grid">
                <div class="notif-type-card" data-type="chat" style="--card-color:#ec4899;">
                    <div class="notif-type-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
                    <span class="notif-type-count">0</span>
                    <span class="notif-type-label">محادثة</span>
                </div>
                <div class="notif-type-card" data-type="info" style="--card-color:#0ea5e9;">
                    <div class="notif-type-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></div>
                    <span class="notif-type-count">0</span>
                    <span class="notif-type-label">معلومة</span>
                </div>
                <div class="notif-type-card" data-type="success" style="--card-color:#10b981;">
                    <div class="notif-type-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div>
                    <span class="notif-type-count">0</span>
                    <span class="notif-type-label">نجاح</span>
                </div>
                <div class="notif-type-card" data-type="subdomain" style="--card-color:#8b5cf6;">
                    <div class="notif-type-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></div>
                    <span class="notif-type-count">0</span>
                    <span class="notif-type-label">نطاق فرعي</span>
                </div>
                <div class="notif-type-card" data-type="error" style="--card-color:#ef4444;">
                    <div class="notif-type-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div>
                    <span class="notif-type-count">0</span>
                    <span class="notif-type-label">تنبيه</span>
                </div>
            </div>

            <!-- Filters -->
            <div class="notif-filters-bar">
                <div class="notif-status-pills">
                    <button class="notif-status-pill active" data-status="all">الكل</button>
                    <button class="notif-status-pill" data-status="unread">غير مقروءة</button>
                    <button class="notif-status-pill" data-status="read">مقروءة</button>
                </div>
                <div class="notif-filters-extra">
                    <input type="date" id="notifDateFrom" title="من تاريخ">
                    <input type="date" id="notifDateTo" title="إلى تاريخ">
                    <input type="text" id="notifSearch" placeholder="بحث في العنوان أو الرسالة...">
                    <button id="notifSearchBtn" class="btn btn-primary" style="padding:0.5rem 1rem;">بحث</button>
                    <button id="notifResetBtn" class="btn btn-secondary" style="padding:0.5rem 1rem;">إعادة تعيين</button>
                    <button id="notifMarkAllBtn" class="btn btn-secondary" style="padding:0.5rem 1rem;">تحديد الكل كمقروء</button>
                </div>
            </div>

            <!-- Master-detail -->
            <div class="notif-layout">
                <div class="notif-list-panel">
                    <div class="notif-list-panel-header"><h3>قائمة الإشعارات</h3></div>
                    <div id="notifList"></div>
                    <div id="notifPagination"></div>
                </div>
                <div class="notif-detail-panel">
                    <div id="notifDetail"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { checkAdminAuth, updateAdminUI } from '/assets/js/admin/auth.js';
        import { initSidebar } from '/assets/js/admin/sidebar.js';
        import { initAdminNotificationsPage } from '/assets/js/admin/notifications-page.js';

        (async function () {
            initSidebar();
            const user = await checkAdminAuth();
            if (!user) return;
            updateAdminUI(user);
            initAdminNotificationsPage();
        })();
    </script>
</body>
</html>
