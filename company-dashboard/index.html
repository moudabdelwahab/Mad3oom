<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الشركة - منصة مدعوم</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/assets/js/admin/admin-style.css">
    <link rel="stylesheet" href="/assets/css/customer-dashboard.css">
    <link rel="stylesheet" href="/assets/css/company-dashboard.css">
    <script>
        /* نفس السكربت في كل صفحات البوابة: يضبط الثيم وحالة طي القائمة قبل
           أول رسم، فمفيش وميض ولا قفزة عند الانتقال بين الصفحات. */
        (function () {
            var root = document.documentElement;
            try {
                var theme = localStorage.getItem('theme-preference')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                root.setAttribute('data-theme', theme);
                if (localStorage.getItem('mad3oom-sidebar-collapsed') === '1') {
                    root.setAttribute('data-sidebar', 'collapsed');
                }
            } catch (e) {
                root.setAttribute('data-theme', 'dark');
            }
            root.classList.add('no-transition');
            window.addEventListener('DOMContentLoaded', function () {
                requestAnimationFrame(function () { root.classList.remove('no-transition'); });
            });
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="/theme-manager.js" defer></script>
    <script src="/language-manager.js"></script>
</head>
<body class="customer-shell company-shell">
    <div id="sidebar-container"></div>

    <main class="admin-main" id="companyMain">

        <!-- شريط المستوى: أوضح فرق بصري بين لوحة العميل ولوحة الشركة.
             نفس نظام التصميم (نفس التوكنز والمكوّنات)، لكن هوية لونية
             ومستوى معلن، عشان المستخدم يعرف إنه في سياق الشركة مش سياقه هو. -->
        <header class="company-banner" id="companyBanner" hidden>
            <div class="company-banner-main">
                <span class="company-level-tag">لوحة الشركة</span>
                <h1 class="company-name" id="companyName">—</h1>
                <p class="company-meta" id="companyMeta"></p>
            </div>
            <div class="company-banner-side">
                <span class="pill" id="companyAccessPill" hidden></span>
                <a class="btn btn-secondary" href="/customer-dashboard.html">حسابي الشخصي</a>
            </div>
        </header>

        <!-- حالة: لا توجد شركة / لا اشتراك مؤهل -->
        <section id="companyGate" class="panel" hidden>
            <div id="companyGateBody"></div>
        </section>

        <div id="companyContent" hidden>
            <div class="kpi-grid" id="companyKpis" aria-live="polite"></div>

            <div class="split-grid">
                <section class="panel" aria-labelledby="companyProfileHeading">
                    <div class="panel-header">
                        <div>
                            <h2 class="panel-title" id="companyProfileHeading">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path></svg>
                                بيانات الشركة
                            </h2>
                            <p class="panel-subtitle">البيانات القانونية والتشغيلية المسجّلة للشركة</p>
                        </div>
                        <button type="button" class="panel-link" id="editCompanyBtn" hidden>تعديل البيانات</button>
                    </div>
                    <div id="companyProfileBody"></div>

                    <form id="companyForm" class="company-form" hidden novalidate>
                        <div class="form-grid">
                            <div class="form-field is-full">
                                <label for="fCompanyName">اسم الشركة <span aria-hidden="true">*</span></label>
                                <input type="text" id="fCompanyName" name="companyName" class="form-control" required>
                                <p class="field-error" data-error-for="companyName" hidden></p>
                            </div>
                            <div class="form-field">
                                <label for="fCrNumber">رقم السجل التجاري <span aria-hidden="true">*</span></label>
                                <input type="text" id="fCrNumber" name="crNumber" class="form-control" required inputmode="numeric">
                                <p class="field-error" data-error-for="crNumber" hidden></p>
                            </div>
                            <div class="form-field">
                                <label for="fCrExpiry">تاريخ انتهاء السجل التجاري <span aria-hidden="true">*</span></label>
                                <input type="date" id="fCrExpiry" name="crExpiry" class="form-control" required>
                                <p class="field-error" data-error-for="crExpiry" hidden></p>
                            </div>
                            <div class="form-field">
                                <label for="fCompanyEmail">البريد الإلكتروني للشركة</label>
                                <input type="email" id="fCompanyEmail" name="companyEmail" class="form-control">
                                <p class="field-error" data-error-for="companyEmail" hidden></p>
                            </div>
                            <div class="form-field">
                                <label for="fCompanyPhone">هاتف الشركة</label>
                                <input type="tel" id="fCompanyPhone" name="companyPhone" class="form-control">
                            </div>
                            <div class="form-field">
                                <label for="fCity">المدينة</label>
                                <input type="text" id="fCity" name="city" class="form-control">
                            </div>
                            <div class="form-field">
                                <label for="fCountry">الدولة</label>
                                <input type="text" id="fCountry" name="country" class="form-control">
                            </div>
                            <div class="form-field is-full">
                                <label for="fAddress">العنوان</label>
                                <input type="text" id="fAddress" name="address" class="form-control">
                            </div>
                            <div class="form-field">
                                <label for="fTaxId">الرقم الضريبي</label>
                                <input type="text" id="fTaxId" name="taxId" class="form-control">
                            </div>
                        </div>
                        <p class="field-error" id="companyFormError" hidden></p>
                        <div class="company-form-actions">
                            <button type="submit" class="btn btn-primary" id="saveCompanyBtn">حفظ البيانات</button>
                            <button type="button" class="btn btn-secondary" id="cancelCompanyBtn">إلغاء</button>
                        </div>
                    </form>
                </section>

                <section class="panel" aria-labelledby="companySubsHeading">
                    <div class="panel-header">
                        <div>
                            <h2 class="panel-title" id="companySubsHeading">
                                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                                اشتراكات الشركة
                            </h2>
                            <p class="panel-subtitle">حالة كل باقة وتاريخ انتهائها</p>
                        </div>
                        <a class="panel-link" href="/customer-subscriptions.html">إدارة الاشتراكات</a>
                    </div>
                    <div id="companySubscriptions"></div>
                </section>
            </div>

            <section class="panel" aria-labelledby="companyServicesHeading">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title" id="companyServicesHeading">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            الخدمات والامتيازات المتاحة للشركة
                        </h2>
                        <p class="panel-subtitle">مشتقّة من الاشتراكات الفعّالة — تتغيّر تلقائيًا عند التجديد أو الانتهاء</p>
                    </div>
                </div>
                <div id="companyEntitlements"></div>
            </section>
        </div>
    </main>

    <script type="module" src="/assets/js/company/company-dashboard.js"></script>
</body>
</html>
