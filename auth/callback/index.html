<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="/error-tracker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري المعالجة - منصة مدعوم</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 1.5rem;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .error-message {
            display: none;
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            text-align: right;
        }

        .error-message.show {
            display: block;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #764ba2;
        }

        .btn-secondary {
            background: #ddd;
            color: #333;
            margin-right: 0.5rem;
        }

        .btn-secondary:hover {
            background: #ccc;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>جاري المعالجة</h1>
        <p id="statusMessage">جاري التحقق من بيانات المصادقة...</p>
        
        <div id="errorContainer" class="error-message">
            <p id="errorText"></p>
        </div>

        <div id="actionButtons" style="display: none;" class="button-group">
            <button class="btn btn-secondary" onclick="window.location.href='/sign-in.html'">العودة لتسجيل الدخول</button>
            <button class="btn" onclick="window.location.href='/index.html'">الذهاب للرئيسية</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from '/api-config.js';
        import { handleFacebookCallback } from '/facebook-oauth.js';

        const statusMessage = document.getElementById('statusMessage');
        const errorContainer = document.getElementById('errorContainer');
        const errorText = document.getElementById('errorText');
        const actionButtons = document.getElementById('actionButtons');

        async function processCallback() {
            try {
                // انتظر قليلاً للسماح لـ Supabase بمعالجة URL parameters
                await new Promise(resolve => setTimeout(resolve, 500));

                // محاولة الحصول على session
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();

                if (sessionError) {
                    throw new Error(`خطأ في الجلسة: ${sessionError.message}`);
                }

                if (!session) {
                    throw new Error('لم يتم العثور على جلسة. قد تكون انتهت صلاحيتها.');
                }

                const user = session.user;
                console.log('[Callback] Session found for user:', user.id);

                // جلب بيانات المستخدم من جدول profiles
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .maybeSingle();

                if (profileError && profileError.code !== 'PGRST116') {
                    console.error('[Callback] Profile fetch error:', profileError);
                }

                // تحديد الدور والصفحة المطلوبة للتحويل
                const role = profile?.role || 'customer';
                const targetPage = (role === 'admin' || role === 'support' || role === 'super_user')
                    ? '/admin-dashboard.html'
                    : '/customer-dashboard.html';

                statusMessage.textContent = `تم المصادقة بنجاح! جاري التحويل إلى لوحة التحكم...`;

                // التحويل بعد ثانية واحدة
                setTimeout(() => {
                    window.location.replace(targetPage);
                }, 1000);

            } catch (error) {
                console.error('[Callback] Error processing callback:', error);

                statusMessage.textContent = 'حدث خطأ أثناء المعالجة';
                errorContainer.classList.add('show');
                errorText.textContent = error.message || 'حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.';
                actionButtons.style.display = 'flex';

                // إضافة معلومات تصحيح إضافية
                console.error('[Callback] Full error details:', {
                    message: error.message,
                    stack: error.stack,
                    timestamp: new Date().toISOString()
                });
            }
        }

        // بدء المعالجة
        processCallback();
    </script>
</body>
</html>
